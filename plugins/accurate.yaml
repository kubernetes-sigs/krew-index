apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: accurate
spec:
  version: v2.1.0
  homepage: https://github.com/cybozu-go/accurate
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.1.0/kubectl-accurate_v2.1.0_darwin_amd64.tar.gz
      sha256: b0845d6a69b20d7d4886128b3d5b28ba5d7f6c31c1bc1e18b37fe2bd14fe4b1a
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.1.0/kubectl-accurate_v2.1.0_darwin_arm64.tar.gz
      sha256: 075eaefdeca90c8ca71bb19eca3c5013df6aab4f1e9f050bb3393ccc351250ba
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.1.0/kubectl-accurate_v2.1.0_linux_amd64.tar.gz
      sha256: eb4b50f2ac8c1ed25989dde56a009c096b6a607b356f551ac6b1e120fd5776d2
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.1.0/kubectl-accurate_v2.1.0_linux_arm64.tar.gz
      sha256: 2f663fcdb0feec03a67803816a88f8a0d6ff9e6005585eb6f107a15e1679f903
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
