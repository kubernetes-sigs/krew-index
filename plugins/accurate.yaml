apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: accurate
spec:
  version: v2.0.0
  homepage: https://github.com/cybozu-go/accurate
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.0.0/kubectl-accurate_v2.0.0_darwin_amd64.tar.gz
      sha256: a307f629dd3ab59e30d5834f3c7fd219949394efc967cd52154337aa624c6ded
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.0.0/kubectl-accurate_v2.0.0_darwin_arm64.tar.gz
      sha256: 242360b9930dfca882609c24bb18f57c725237a73c7ddb0056c4644aa21f3b1f
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.0.0/kubectl-accurate_v2.0.0_linux_amd64.tar.gz
      sha256: 4ea94637edf11cf987328115cf5467f30379a52afb5e3fe3fbb6d1183d9d5547
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.0.0/kubectl-accurate_v2.0.0_linux_arm64.tar.gz
      sha256: b9702ee06a3a7d79dc196b4ce8190e2dc19c3d9ea609ca79a68a309e52fb577b
      bin: kubectl-accurate
      files:
        - from: kubectl-accurate
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/cybozu-go/accurate/releases/download/v2.0.0/kubectl-accurate_v2.0.0_windows_amd64.tar.gz
      sha256: fcdfd8c860590f8d0a48cf9ced3afa9d73cd6fe2f3792cb37d885c1200e0d1dc
      bin: kubectl-accurate.exe
      files:
        - from: kubectl-accurate.exe
          to: .
        - from: LICENSE
          to: .
  shortDescription: Manage Accurate, a multi-tenancy controller
  description: |
    kubectl-accurate is a subcommand of kubectl to manage Accurate features.
    Accurate is a Kubernetes controller for multi-tenancy.
    It propagates resources between namespaces accurately and allows tenant users to create/delete sub-namespaces.
    Read more documentation at: https://cybozu-go.github.io/accurate/index.html
