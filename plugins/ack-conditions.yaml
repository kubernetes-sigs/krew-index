  homepage: https://github.com/steamedeo/kubectl-ack-conditions
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/steamedeo/kubectl-ack-conditions/releases/download/v0.1.2/ack-conditions_linux_amd64.tar.gz
