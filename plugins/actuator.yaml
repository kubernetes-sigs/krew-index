apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: actuator
spec:
  version: v0.1.0
  homepage: https://github.com/deviceinsight/kubectl-actuator
  shortDescription: Interact with Spring Boot Actuator endpoints.
  description: |
    This plugin allows you to interact with Spring Boot Actuator endpoints. You can use it to view and modify log levels, view scheduled tasks, and more.
    Examples:
      # Show loggers and their log levels
      kubectl actuator --pod my-app-pod logger
      # Set log level
      kubectl actuator --pod my-app-pod logger com.example.app.service DEBUG
      # View scheduled tasks
      kubectl actuator --deployment my-app scheduled-tasks
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/deviceinsight/kubectl-actuator/releases/download/v0.1.0/kubectl-actuator_Darwin_x86_64.tar.gz
      sha256: 0791f57b6e993f869d6df91278a88e0aad1bb9f56281e810f1951003d19632a6
      bin: kubectl-actuator
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/deviceinsight/kubectl-actuator/releases/download/v0.1.0/kubectl-actuator_Darwin_arm64.tar.gz
      sha256: 078592dc3f08a0b891bc8bb2bce06c06c6facd619ecea789a1c522f3ad066e83
      bin: kubectl-actuator
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/deviceinsight/kubectl-actuator/releases/download/v0.1.0/kubectl-actuator_Linux_x86_64.tar.gz
      sha256: afd0b8a35c5f387150d0d26001cda9f9442c2d6294b73c4f2ce702750a8c0718
      bin: kubectl-actuator
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/deviceinsight/kubectl-actuator/releases/download/v0.1.0/kubectl-actuator_Windows_x86_64.zip
      sha256: ff29fb0a0efed80113e9a5e63754c82af65b165122b1ad6cfef8f13b230edbd9
      bin: kubectl-actuator.exe