apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: agwmap
spec:
  version: v0.5.0
  homepage: https://github.com/paurosello/agwmap
  shortDescription: Map the gateway configuration as an HTML page
  description: |
    Reads the Gateway API and agentgateway objects of a cluster and writes one
    self-contained HTML page with the request flow of every route: listener,
    policies at each level, route, backends and upstream targets.
    Captures are anonymized by default and can be exported and rendered again.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.5.0/agwmap_darwin_arm64.tar.gz
    sha256: 6bcca1f79651feaaa70196ce231fd376e880a4448f9969f13d82104ecaa77244
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.5.0/agwmap_darwin_amd64.tar.gz
    sha256: 9ad1e92148c8b7d61a2b360abd1c7dfba5ddc4de2eed59d76686b5de1148fe20
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.5.0/agwmap_linux_amd64.tar.gz
    sha256: 8dc0272b87b667d8b44fd719ffeae30de25270db5f60990e5c0159be8041d868
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.5.0/agwmap_linux_arm64.tar.gz
    sha256: 2b19dd5282c277f88d6e568222c1876eba2aa5e3ba93d660aba604b6cf0b97fc
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.5.0/agwmap_windows_amd64.tar.gz
    sha256: c59ebf6addcb6811fa44dae3a9a355ab5ac620296fbfc33324a5c9cb6a618393
    bin: kubectl-agwmap.exe
