apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: agwmap
spec:
  version: v0.4.0
  homepage: https://github.com/paurosello/agwmap
  shortDescription: Map the gateway configuration as an HTML page
  description: |
    Reads the Gateway API and agentgateway objects of a cluster and writes one
    self-contained HTML page with the request flow of every route: listener,
    policies at each level, route, backends and upstream targets.
    Captures are anonymized by default and can be exported and rendered again.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.4.0/agwmap_darwin_arm64.tar.gz
    sha256: a73ff6a6897f91e98ad990a96f1995fd2c8ae83210d4fa2b4c1fd87d389df627
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.4.0/agwmap_darwin_amd64.tar.gz
    sha256: ea6405ddacdb253b02a133791452a7a9511b11ac27cb83ba18a3b53e6e1355a1
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.4.0/agwmap_linux_amd64.tar.gz
    sha256: 5599c2c27cf93dcc0c2eca7c60682e009b11894a09bd8b330bf0b3603f872cb6
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.4.0/agwmap_linux_arm64.tar.gz
    sha256: 05f0779e650be37d2a6088df0bdd8f8ed7434b1e66966a11cf30e8c628d3bd50
    bin: kubectl-agwmap
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/paurosello/agwmap/releases/download/v0.4.0/agwmap_windows_amd64.tar.gz
    sha256: 48ec51ac00f5a04d7a2bba152d6390c8cd0ac75437820412d2c92b2b858e35b8
    bin: kubectl-agwmap.exe
