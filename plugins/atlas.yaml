# Krew plugin manifest for `kubectl atlas`.
#
# This is the manifest submitted to https://github.com/kubernetes-sigs/krew-index
# so operators can `kubectl krew install atlas`. This file is the prepared source.
#
# Release coordinates come from the verified GitHub Release archives and
# checksums.txt. Updating this source does not by itself update upstream Krew.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: atlas
spec:
  version: v1.7.0
  homepage: https://github.com/lithastra/kubeatlas
  shortDescription: Visualize Kubernetes resource dependencies
  description: |
    kubectl-atlas shows a KubeAtlas dependency graph for a resource,
    a namespace, or the whole cluster.

    By default it works offline: it builds the dependency graph
    straight from the Kubernetes API and renders it to an SVG
    locally, with no KubeAtlas server required. With --local-ui it
    instead runs a KubeAtlas server in-process and opens the
    interactive web UI — no graphviz and no in-cluster server. With
    --online (or --server / KUBEATLAS_URL) it opens the live
    KubeAtlas web UI in the cluster instead.

    The plugin installs nothing in the cluster. Run
    `kubectl atlas --help` for usage.
  caveats: |
    No in-cluster KubeAtlas server is needed for offline use.

    Three modes:
      (default)    Render a static SVG. Needs the graphviz
                   `dot` tool on PATH.
      --local-ui   Open an interactive web UI from an in-process
                   server. No graphviz needed.
      --online     Open a live in-cluster KubeAtlas UI (or pass
                   --server / set KUBEATLAS_URL).

    Run `kubectl atlas --help` for usage.
    Docs: https://docs.kubeatlas.lithastra.com
  platforms:
    - selector:
        matchLabels: { os: linux, arch: amd64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_linux_amd64.tar.gz
      sha256: "60cca1ee6f9a5cfd43e386b12e5a251501d6b3a5eeb1e1e3c385f6e54dc31db4"
      bin: kubectl-atlas
    - selector:
        matchLabels: { os: linux, arch: arm64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_linux_arm64.tar.gz
      sha256: "44f29cce0f1a794ad7c3da0b4178aa2d9c0a5c54e8e5d75970c8b4cb2aee1f04"
      bin: kubectl-atlas
    - selector:
        matchLabels: { os: darwin, arch: amd64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_darwin_amd64.tar.gz
      sha256: "ce3995b4c8d3752bc292e6c585f1ed0e5b1e49e1a07602d950fd53926d36595d"
      bin: kubectl-atlas
    - selector:
        matchLabels: { os: darwin, arch: arm64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_darwin_arm64.tar.gz
      sha256: "15737ce624b990716868f759ed5a204388b4d0e3c808c5ca4a3431d60c80efc1"
      bin: kubectl-atlas
    - selector:
        matchLabels: { os: windows, arch: amd64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_windows_amd64.tar.gz
      sha256: "d64e2e11cdb85a16c33de750b90e468efd02b8cce11ae3219a4dd35e9181ffeb"
      bin: kubectl-atlas.exe
    - selector:
        matchLabels: { os: windows, arch: arm64 }
      uri: https://github.com/lithastra/kubeatlas/releases/download/v1.7.0/kubectl-atlas_1.7.0_windows_arm64.tar.gz
      sha256: "e562268bea1c354835bf53bf136aef37b86e5337c90a9058d5e1e323b41283d7"
      bin: kubectl-atlas.exe
