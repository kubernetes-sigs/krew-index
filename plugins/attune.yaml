apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.26"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_linux_amd64.tar.gz
    sha256: 491d188b3a7f4f2e0f96aa2f0270cdd378dd1aa7063ddf1324af39ea9687a5ba
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_linux_arm64.tar.gz
    sha256: ede9509cef15278656a591876ff5a021d1d50d1c7a6eb1bb689ef50c1b86609e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_linux_arm.tar.gz
    sha256: fd3706def4de9a6da65ceee0282c27b12c77d03ef574a1a02e0af5ccf91b915a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_linux_ppc64le.tar.gz
    sha256: b63b5c97a21381b4a8c8cdc2c4647a1d7f97ec0be6b90c7ca34e8e4ed35da2aa
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_darwin_amd64.tar.gz
    sha256: 8dc07e8f4271c5513cda7676ade5d7576b53db17c101a331e8dcd5036f877b71
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.26/kubectl-attune_darwin_arm64.tar.gz
    sha256: 3a929ed97d20f39049f271c689bc5308e87af79ebb549f583589f146c89ef64c
    bin: kubectl-attune
