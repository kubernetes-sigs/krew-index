apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.25"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_linux_amd64.tar.gz
    sha256: 31bbf01a16bc750d17f5ae52954366d2438186fa9511b8f04278dcf3c41ee6b0
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_linux_arm64.tar.gz
    sha256: 43ba6c75c74391c15fab13b5ec533782781a24049d3465a537e54001bb8e9cbc
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_linux_arm.tar.gz
    sha256: 08e0f3a7c0712a8e615518430a8f2c29c0eb623c919f28a62c5aa841738e9091
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 833cffcff2455231eb5726ad6d29fbab73c97f25f68c5257fb4d67050a5d9d95
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_darwin_amd64.tar.gz
    sha256: d4958294b6aa28fa6f752a878566e61c5ce16b28b95d53217a17b8443d09525a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.25/kubectl-attune_darwin_arm64.tar.gz
    sha256: 53bbdac6820eb5445eb13e1485789bb637545fa558324a1d4c2540dd2e4f0134
    bin: kubectl-attune
