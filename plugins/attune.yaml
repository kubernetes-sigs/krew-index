apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.39"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_linux_amd64.tar.gz
    sha256: 376690497273a929c9c4e7f3408e9cb600e172fe2aa1d503bd1e508b1a0e9554
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_linux_arm64.tar.gz
    sha256: 51e64b822dcaacb0ff9226271d31722deaee936a98c1038648b968ffd0ebc9df
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_linux_arm.tar.gz
    sha256: ebfb12936a26b58a782cf4f7d97704b6ac80188de83b1c96380fa9c631d36622
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 8c0c4172231c41bf6825276bededd22809c452682f2a81f77d7cde89d9c2c81b
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_darwin_amd64.tar.gz
    sha256: 407fe6f4b6dd7e7d7b13425b9fb5bd75281b73023230c7ed5f6879bff1d61d2d
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.39/kubectl-attune_darwin_arm64.tar.gz
    sha256: e75b52ce4397c1ebecf806ec96b042137f80e9d63e54ea37c6664fd9d5958313
    bin: kubectl-attune
