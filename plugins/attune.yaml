apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.32"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_linux_amd64.tar.gz
    sha256: f1e6c861f8331d244dcf626c649b4790db1947cb5dadda970123195b609d1d66
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_linux_arm64.tar.gz
    sha256: 3be1d434d76394ac0a25f55f647650dcaf75f6e79d6e90d36d0e4bd967923396
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_linux_arm.tar.gz
    sha256: 238417f36c591924211ffe3827d89feeb8d46ee077fc2794ab67b116318940f8
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_linux_ppc64le.tar.gz
    sha256: eeca11f3a944dc968125ec0b38d9ae19739d522f8c2a83fbaf8500288812654b
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_darwin_amd64.tar.gz
    sha256: 2afca4c1e95f42160dbaea7b9295a21c7e1f5c06d2efe3d9b525bbd77c8a5a86
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.32/kubectl-attune_darwin_arm64.tar.gz
    sha256: 281774d52c8b07d4751ba9abfeaf39245764ad6f9573af9fc4f00991912a7daf
    bin: kubectl-attune
