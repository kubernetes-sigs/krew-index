apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.29"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_linux_amd64.tar.gz
    sha256: 5b4a44f4fe10f07120d60b6d735612d50f29d7b4c71e3445af2a419b26719ab4
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_linux_arm64.tar.gz
    sha256: 6ace28dee8dd093068835e2f7cca43e8fbb3a45984ca7386b7e0d707631f2d8a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_linux_arm.tar.gz
    sha256: ca98c6274929aacf09336883507aab59327125f2d3c381934445310e902e7465
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 8963a005323bc8545e63b75a1cd5405df9bbd512f6413242817a7e3da22e07e0
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_darwin_amd64.tar.gz
    sha256: 17796fdd19a3a8daf3c33a158b85f080ae685bda2a3d62bea0038f6358dee715
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.29/kubectl-attune_darwin_arm64.tar.gz
    sha256: df828601468557480d84320375c7d5ec02a37ad99035be10e744f10ba9e18b8f
    bin: kubectl-attune
