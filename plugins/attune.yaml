apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.33"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_linux_amd64.tar.gz
    sha256: ae9cd674c4bbd7f03c3f5e56b8ac5c46f18759350969d9e26f0903712200b39b
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_linux_arm64.tar.gz
    sha256: 1d2dcd69d5e236a02ddbf486834aa0142f30aa73c4f707c166732ab1af1f7043
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_linux_arm.tar.gz
    sha256: 2533b444bfd1dda522f23982a0d92f3e08af3197f23b1ef98258df0426de1c81
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 6e6ae1c4132fecce3a16162f6b31feac58eb6ae94fa1ec79d6e2881d7f8933f4
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_darwin_amd64.tar.gz
    sha256: 8b6b53c3612990fb5a587137fadf30678afb23154ba23f769d687d771eb15845
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.33/kubectl-attune_darwin_arm64.tar.gz
    sha256: fc5e8bf7dd54b610cabc63a99096f8ae5151840bfa5ebceb4edea9740adc21f1
    bin: kubectl-attune
