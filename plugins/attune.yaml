apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.37"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_linux_amd64.tar.gz
    sha256: d9b562f5dcb5168cb4868969a8a52d5ba4a941444720399bb62c629fccf45682
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_linux_arm64.tar.gz
    sha256: 5a6e9059f4567b72cd0890898205b2c6bf970c114a2784493543979e98813569
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_linux_arm.tar.gz
    sha256: 452914d1010153746cae2d3256484c1420033100e9cee31055081511ef4d793e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 79209afd7303633532b502555b80d671e70e62cc46e80d3be711608b07f9439e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_darwin_amd64.tar.gz
    sha256: e7e05d0591e071aecd69b41541c7c9e11c2dc11e50ca3905dee623e74674c3aa
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.37/kubectl-attune_darwin_arm64.tar.gz
    sha256: f71111a76c3552c94eceefd3e4ac3d5cdfba609f6fdf776f4a9a46ab250300b1
    bin: kubectl-attune
