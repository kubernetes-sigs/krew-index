apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.23"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_linux_amd64.tar.gz
    sha256: ab6494974f9331d4ecadbf192b37c7860f271294496d98d2f1435d353f4d7bda
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_linux_arm64.tar.gz
    sha256: 1d9c83e1861227ec2a14f3837bb8352131af65225347cee34e89eb1fc0cd9883
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_linux_arm.tar.gz
    sha256: da8cbd4bac4e7db4755bf22b91c8f65dd39cb459b88254d67d1155a92b5b49c0
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 46cd53c61186d0d8356ed9b392e03803b22a947b146fed9e004cbfc743cc27fe
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_darwin_amd64.tar.gz
    sha256: 6f01b890175cc93b2b192795d7790818ef4ef0170709dd07220294ea05e9e304
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.23/kubectl-attune_darwin_arm64.tar.gz
    sha256: 7ed33fccf2077c6e47b877730247002089b1865f656525afd2e2c3402e6b93b4
    bin: kubectl-attune
