apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.28"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_linux_amd64.tar.gz
    sha256: a2f68df591218de3fac9b9a2379fd9c5ce249615f9fc0a004a52d22d8118552c
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_linux_arm64.tar.gz
    sha256: 168362f545645d139b0f6d9404951de017ac711d65ec90565c2095203a443dc8
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_linux_arm.tar.gz
    sha256: 4a08cdfa94dd241e7ce375f8ac4a503ba06a153dfd4daef9a4f92a2aa136de2d
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 8e99b88b188e118e7f38d2626b06748e1e5b3a11f16ebbf6ff097de5b0a44508
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_darwin_amd64.tar.gz
    sha256: 223d32138af2bfc62ee9f6c85506a1e309f8567b30a9b7bb686fba4afbaf846f
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.28/kubectl-attune_darwin_arm64.tar.gz
    sha256: 3cc0f5594da695b990f5dd0e9b3d66f3fbb2a4b4b7c056a1914403861ac08ba5
    bin: kubectl-attune
