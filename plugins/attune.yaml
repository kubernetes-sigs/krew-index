apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.22"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_linux_amd64.tar.gz
    sha256: 35c801e0a7d256e5693373bf2131d8d80aa353c9036ffcce79c04e1cd33853da
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_linux_arm64.tar.gz
    sha256: 522d42d33cf71fcf3f078989437209980313d6ff2aeb3bdabfb78471d28e7313
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_linux_arm.tar.gz
    sha256: f9df5a1db187803ec834cbf63b9ee6016bb942d5856267d7af56721be2ff34be
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 33c58894c3474d8d6e53a376cb7abab44e79db1c8654c19e35780e143cd6fb0e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_darwin_amd64.tar.gz
    sha256: 37e8d0d15cd74589f7507fb55eaeb57cd20eb94ffb73ed991329d5a0083e8799
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.22/kubectl-attune_darwin_arm64.tar.gz
    sha256: f2c6797db771fea9cd064e3591f547783216b9bf8148b31f92d5a418b6104148
    bin: kubectl-attune
