apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.24"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_linux_amd64.tar.gz
    sha256: 0cba29af0487454a1faa92a811e352c029a4af6c191b3143b07f7e45eac4a073
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_linux_arm64.tar.gz
    sha256: a3a8a7397b9254b2d462565d176963426c530ef434dd5fbd1b996175e7698271
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_linux_arm.tar.gz
    sha256: 2eb2fe8d8e3d44ce37d77981264b9af31434b55da8dd9d33ea63b0590c912c57
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 9dac7f6cb44abba63e8a0d0822a001945c3884ee6f185da362d9e79b8f218813
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_darwin_amd64.tar.gz
    sha256: 0666424cefc3cb4840fbe2ad4ff9b10f4b804c90e659de0e348a2813156106bc
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.24/kubectl-attune_darwin_arm64.tar.gz
    sha256: d27e6bbab3ee3bb67e4ba764597fff7b68864706a2dece3d72caf38524f46221
    bin: kubectl-attune
