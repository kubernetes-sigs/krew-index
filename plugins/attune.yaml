apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.31"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_linux_amd64.tar.gz
    sha256: d02a5ebd88928f1ab0062ca7a00d1caf5888a1394f849dd117b4d6b59b905ed0
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_linux_arm64.tar.gz
    sha256: 1cf40d580fe2b0b502942975794d30ce0f7d4ce26681ff27b1a492870f0fe76a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_linux_arm.tar.gz
    sha256: 25adc8675380ccfcf15632e7a6cd9bfb37610fa5940ae348caacffc13bb2d5ee
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 77b7cab32e58e554821dbece941855922c9d8738c35b76e4917b1d40023b873b
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_darwin_amd64.tar.gz
    sha256: b9ce07c4b252833b6df4cf5401accbda3ef4bb72a4afb029e260e3a17d67006e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.31/kubectl-attune_darwin_arm64.tar.gz
    sha256: b23ccc3d1b7527bbac4859df796f634e2de1d5849a3dd573c4e5b8683a51604e
    bin: kubectl-attune
