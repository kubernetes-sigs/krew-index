apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.27"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_linux_amd64.tar.gz
    sha256: fac45b38b80ce80109b07ab08de793ee93772c418ba52e4f3ea5b3fd72b02451
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_linux_arm64.tar.gz
    sha256: 89242037f96fe1545d4223da9322fffbd63ef798ad98daf310ee04fea6f3f6b4
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_linux_arm.tar.gz
    sha256: bc6e430fc08df69a202a4196e798128131a2d84fa92a7bfdc189b42a5936ad44
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_linux_ppc64le.tar.gz
    sha256: ff2e14ad0a7f70796a0e44f9e3b1d3a62ec9e69c2c5e4de76425753cbe1617a7
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_darwin_amd64.tar.gz
    sha256: eadb57f7dc741cd85729b8e48e2dce7741f8959803112d721cae4d37ee64a14a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.27/kubectl-attune_darwin_arm64.tar.gz
    sha256: 705c6e14b35ca36a80c469fa4c0c9600163da55f1df63a272eb795d5068df9aa
    bin: kubectl-attune
