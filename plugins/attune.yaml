apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.21"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_linux_amd64.tar.gz
    sha256: b856f519d82484d28f9896b19601906b280330d3cbea0847324b28b9a27264ae
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_linux_arm64.tar.gz
    sha256: 318b7d6b1eebd5c7c564e3bdf7c403da1f9cec6e879f96d90c33f39b04cd6bda
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_linux_arm.tar.gz
    sha256: a7328e7ae2c0325e4142ecc309486f016fbf3721fbd446076d476f3662425100
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_linux_ppc64le.tar.gz
    sha256: f0918b4fc6fb77c2b6c8a6120afe4e9fd35dae1bbe950aefddf92b588919b392
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_darwin_amd64.tar.gz
    sha256: 0817128309a628159ce9c384053d80fa7dd5dc3051b0ce812931a26966044f96
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.21/kubectl-attune_darwin_arm64.tar.gz
    sha256: c2df983436266dc443c3f253724c7b57831d1ac241bad62be238f4afebbb118c
    bin: kubectl-attune
