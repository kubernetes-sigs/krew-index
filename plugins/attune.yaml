apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.30"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_linux_amd64.tar.gz
    sha256: f5387a48f2346364e799fb3be371bec97acb82425a5f6197cdb814eba5c6bd85
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_linux_arm64.tar.gz
    sha256: 4d3bd5d311debffcebd2bebba2e45de49c6ffd5e2c2c22c2576bbdc532eb07cc
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_linux_arm.tar.gz
    sha256: da4e2462899f060be07cd1648eccf621300a0ba76f2eb2ba0fad1a40e3585322
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_linux_ppc64le.tar.gz
    sha256: a237aab8afe4ac1c18f5aac8da4165568a1d5ef04b41914503f3251fdca1dce8
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_darwin_amd64.tar.gz
    sha256: ce9e5119df0ee60939fed772f052754d1f79e687aa2b9f1b33775c1524dfbd15
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.30/kubectl-attune_darwin_arm64.tar.gz
    sha256: 965463c9e532a888e185b877c4291510f409b5b348ef10d54b6e47c227330c05
    bin: kubectl-attune
