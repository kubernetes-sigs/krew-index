apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.38"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_linux_amd64.tar.gz
    sha256: d5d2050588e95b4c54f676890620cefcf6baf6fd361917c6e0404d8fc0c26091
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_linux_arm64.tar.gz
    sha256: 1f3bee285755be8839eab5e8b8335c012877d0cf066eb13684e5852a4e132401
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_linux_arm.tar.gz
    sha256: 3d176d3e6eee2b199474f1be9733a5f4f03f23e40e3b172384949d44fb487b45
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_linux_ppc64le.tar.gz
    sha256: d58c7d2b69da13d81b4460822c32fb33b0353eeb14e3eb78381cac1d4f9b8d2f
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_darwin_amd64.tar.gz
    sha256: 6691f37afcb4327cb1155548d94481d4eb166dafddb329e12982119e6c877942
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.38/kubectl-attune_darwin_arm64.tar.gz
    sha256: df492f97483d558633fe3ae415b2d02630fdfa696be1d76b443c9fe3127bfbf1
    bin: kubectl-attune
