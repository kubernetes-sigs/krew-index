apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.35"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_linux_amd64.tar.gz
    sha256: 68cacecd4ed3ffe4495cdcc129c1d593b16c23f26a4a23f1b173c138727510d4
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_linux_arm64.tar.gz
    sha256: 59c54f108fe4b1ef3629b6cc914fadd572af3eaca5315237277bdc607d11071a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_linux_arm.tar.gz
    sha256: cb2a6a18bc8db85abdfceffd274305fa165ed53a9b4a40a87413eae6f0e84822
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_linux_ppc64le.tar.gz
    sha256: d11043169e7a0af8177c7f42a312c903bf89f2efb0dda5273d35c85669214902
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_darwin_amd64.tar.gz
    sha256: 9e34ab92afb3efa804674818513f52096ed227cc6e49258f9d041528aa9b6b57
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.35/kubectl-attune_darwin_arm64.tar.gz
    sha256: 2c253519cd5b60c127f2bf0c89bd2165cfd2f33e218b425dd4f2ee278f75fc00
    bin: kubectl-attune
