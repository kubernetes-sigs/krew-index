apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.34"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_linux_amd64.tar.gz
    sha256: 9c3dc3e56559923cb214df504f1b25ea23d0fcd56a21991faa12eff6d93a837e
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_linux_arm64.tar.gz
    sha256: a5ed8d9bff7007c4f8a45d0d46fe2739677fb17939a6dbb2e5409b7391ec91c6
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_linux_arm.tar.gz
    sha256: 6e113c1ffdd644fe8f56220a423ebf761fca7f0ae8f285f77f94a91034a7acf1
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_linux_ppc64le.tar.gz
    sha256: 4b72f10124d9896847e3d9411a919e4751d314d98646506a730447a04bdf53b1
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_darwin_amd64.tar.gz
    sha256: f3fd305b49dbb77881c0ba0b00a079047159e4ff055766cc8c66c9b11411abfb
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.34/kubectl-attune_darwin_arm64.tar.gz
    sha256: ab7de5ae3d2ad7d60612cb8271986ff69ce042a1ec1c07a05d9ace7d160dbbe8
    bin: kubectl-attune
