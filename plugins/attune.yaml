apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.40"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_linux_amd64.tar.gz
    sha256: a2072cffd319586280f2a8196d72def9e3feba54d2cb4bf459fc9d8b8f180a62
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_linux_arm64.tar.gz
    sha256: 8dc77fbeb7fa7f615c714390b0c31f489060c27d6e13563c56ee37ea56484a91
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_linux_arm.tar.gz
    sha256: aa2f3b997d4b08e64d35724c2946e2edba481fdb6ea0bbe6105516b859ba3212
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_linux_ppc64le.tar.gz
    sha256: a4f9f58f2cbd698fd4fb763fa10dca5741fbc21d3fcf327514528bf810c4a0c0
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_darwin_amd64.tar.gz
    sha256: 2531d330c10f9c4316285cb1a802f26a2fd420a26d54892eec337c4a8789cb03
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.40/kubectl-attune_darwin_arm64.tar.gz
    sha256: a309d2a86cade7d571f0995aa43cfed1e17304c3f7bd13ce8037586ebcfd9925
    bin: kubectl-attune
