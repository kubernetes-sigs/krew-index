apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: attune
spec:
  version: "v0.1.36"
  homepage: https://github.com/attune-io/attune
  shortDescription: Inspect and explain Attune pod right-sizing policies
  description: |
    The kubectl-attune plugin provides visibility into Attune, a Kubernetes
    operator for safe, in-place pod resource right-sizing. View policy status,
    savings estimates, per-container recommendations, and resize history.
  caveats: |
    Requires the Attune operator to be installed in the cluster.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_linux_amd64.tar.gz
    sha256: 995d49c36ee2cbe27033f5b2b3c1d17db7eb953b4440c371fd8e12fcb5192c65
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_linux_arm64.tar.gz
    sha256: 16c15d03431f4227d5333c9fbb797d5d64099e5e7d6e8fc4b9d242629bf64e7f
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_linux_arm.tar.gz
    sha256: 472d5b55b859e0644dec8b066b4620ba7c8b6754332ce7523325835b0befb41a
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: linux
        arch: ppc64le
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_linux_ppc64le.tar.gz
    sha256: fca8b92b9957dcb8c5ed80e84f19343108c1243966b35f48e337e373086f161c
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_darwin_amd64.tar.gz
    sha256: 269d9a01f0507de42a710d3b0ed441da22e84fe28ae6e273b3e0cb8da6fd2e07
    bin: kubectl-attune
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/attune-io/attune/releases/download/v0.1.36/kubectl-attune_darwin_arm64.tar.gz
    sha256: 996460db952c4112cca85072d566e455d29f75397ccefd471a5aa684eea9b014
    bin: kubectl-attune
