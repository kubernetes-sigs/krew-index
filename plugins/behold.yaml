apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: behold
spec:
  version: "v0.1.1"
  homepage: https://github.com/INTENTIUS/behold/tree/main/surfaces/kubectl-behold
  shortDescription: Visualize a cluster's objects and the cloud resources they use
  description: |
    Draws the objects in the current kubectl context and the references between
    them read-only, and opens the picture in a browser. For one object the
    picture holds that object and its neighbours in both directions. Where an
    object names something outside the cluster, such as the cloud role a
    ServiceAccount assumes or the Git repository an Argo CD application deploys
    from, the picture shows that as well. Nothing is written to the cluster.
  caveats: |
    Needs Node 20 or newer on PATH: the plugin runs a pinned release of
    @intentius/behold through npx, which downloads it on first use.

    A context whose user authenticates through an exec plugin (the GKE, EKS and
    AKS tools) is refused unless you pass --allow-exec-plugin, which lets behold
    run that command once and read with the credential it prints.
  platforms:
  - selector:
      matchExpressions:
      - key: os
        operator: In
        values:
        - darwin
        - linux
    uri: https://github.com/INTENTIUS/behold/releases/download/kubectl-behold-v0.1.1/kubectl-behold-v0.1.1.tar.gz
    sha256: "c88a067ac6b73ca27e3b4253a0d2df82437aa2b3256bd160a3658a58761b5fc4"
    files:
    - from: kubectl-behold
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-behold
