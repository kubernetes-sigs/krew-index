apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: broadcast
spec:
  version: v0.1.2
  homepage: https://github.com/kumarprabhashanand/pod-broadcast
  shortDescription: Send an HTTP request to every ready pod
  description: |
    Sends one HTTP request to every ready pod of a Service, workload or label
    selector, and shows each pod's result with an exit code for scripts.

    A request to a Service normally goes to only one pod, which isn't enough
    when every pod has to get it. The plugin also has built-in shortcuts for
    common Spring Boot tasks, like clearing caches and changing log levels.

    Requests go through the API server's pod proxy with your own credentials,
    so nothing has to be installed in the cluster.
  caveats: |
    This plugin needs the pods/proxy permission in the target namespace, with
    the verb that matches each HTTP method. Details:
    https://github.com/kumarprabhashanand/pod-broadcast/blob/main/docs/rbac.md
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_linux_amd64.tar.gz
    sha256: 4b3fcfbca3ec99eb3b858824398348ce85d94cf35c550b803ffff6b50a1af54d
    bin: kubectl-broadcast
    files:
    - from: kubectl-broadcast
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_linux_arm64.tar.gz
    sha256: f11a6e8b5187f28326e4378d4759a030766e68428b81c2b646a1216d4bcebc99
    bin: kubectl-broadcast
    files:
    - from: kubectl-broadcast
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_darwin_amd64.tar.gz
    sha256: 95ae01fec438020552492b9c8760110bee42cc76c78f80d4ba52408531684547
    bin: kubectl-broadcast
    files:
    - from: kubectl-broadcast
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_darwin_arm64.tar.gz
    sha256: a4634124c11cf00b2776c450f5f8605a14977b87141c8f11c7c44d431582a380
    bin: kubectl-broadcast
    files:
    - from: kubectl-broadcast
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_windows_amd64.zip
    sha256: 1eef730061490fbd51c0d5e6b450870f18587c6905a5c0acb8d878457f323805
    bin: kubectl-broadcast.exe
    files:
    - from: kubectl-broadcast.exe
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/kumarprabhashanand/pod-broadcast/releases/download/v0.1.2/kubectl-broadcast_v0.1.2_windows_arm64.zip
    sha256: 946409ce3a95f616485f7f798183fc16cb1076e210f18915ba5d1bf1a827931f
    bin: kubectl-broadcast.exe
