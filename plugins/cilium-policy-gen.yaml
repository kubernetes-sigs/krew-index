apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cilium-policy-gen
spec:
  version: v1.12.0
  homepage: https://github.com/SoulKyu/cpg
  shortDescription: "Generate CiliumNetworkPolicy from Hubble flows"
  description: |
    Watches dropped network flows in real-time via Hubble Relay and
    automatically generates CiliumNetworkPolicy YAML files that would
    allow them. Useful for clusters with a default-deny posture where
    writing policies manually is tedious and error-prone.

    Supports TCP/UDP ports, ICMP, reserved entities, and CIDR rules.
    Merges with existing policies on disk and writes only on changes.

    Usage:
      kubectl cilium-policy-gen generate -n <namespace>
      kubectl cilium-policy-gen generate --server <relay-addr>
      kubectl cilium-policy-gen generate --cluster-dedup -n <namespace>
  caveats: |
    Requires a running Cilium cluster with Hubble Relay enabled.
    The plugin auto port-forwards to hubble-relay by default.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.0/cilium-policy-gen_linux_amd64.tar.gz
    sha256: 6963820017443df072f2eedbf906d51151d2714d651d4adda5fb295a286c4912
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.0/cilium-policy-gen_linux_arm64.tar.gz
    sha256: 05249316b9f74e4ce636994f703b2999579370c0f38b6937e6fba81c619ab8bc
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.0/cilium-policy-gen_darwin_amd64.tar.gz
    sha256: e9d22210cf9f9ffc39d0e98ec02a208f073cc2381b1a3dc265851ca1f990e1a6
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.0/cilium-policy-gen_darwin_arm64.tar.gz
    sha256: 5daef37b237ce1993e5e8ab522cdcdaf2515c5934fd790d51918b9f669028642
    bin: kubectl-cilium_policy_gen
