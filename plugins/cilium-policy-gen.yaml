apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cilium-policy-gen
spec:
  version: v1.12.2
  homepage: https://github.com/SoulKyu/cpg
  shortDescription: "Generate CiliumNetworkPolicy from Hubble flows"
  description: |
    Watches dropped network flows in real-time via Hubble Relay and
    automatically generates CiliumNetworkPolicy YAML files that would
    allow them. Useful for clusters with a default-deny posture where
    writing policies manually is tedious and error-prone.

    Supports TCP/UDP ports, ICMP, reserved entities, and CIDR rules.
    Merges with existing policies on disk and writes only on changes.

    Usage:
      kubectl cilium-policy-gen generate -n <namespace>
      kubectl cilium-policy-gen generate --server <relay-addr>
      kubectl cilium-policy-gen generate --cluster-dedup -n <namespace>
  caveats: |
    Requires a running Cilium cluster with Hubble Relay enabled.
    The plugin auto port-forwards to hubble-relay by default.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.2/cilium-policy-gen_linux_amd64.tar.gz
    sha256: 73bfb4d676bb0eb8202f4175af7bb411f92baeb39665e16c10e85fbd5f4823f1
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.2/cilium-policy-gen_linux_arm64.tar.gz
    sha256: 54e5b78820472666dee4cac1331b3b92ed3d2ef2f30676b26dd59d086c381bd3
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.2/cilium-policy-gen_darwin_amd64.tar.gz
    sha256: 362e66f94f1d77fd4d87183588b3b6ae467f120a6ece56ae9228875a612eed62
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.2/cilium-policy-gen_darwin_arm64.tar.gz
    sha256: 97a50484d7db2ec931dc642e927f3a52df40392d07cf65ec2bc97fb5b237f535
    bin: kubectl-cilium_policy_gen
