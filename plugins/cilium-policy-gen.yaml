apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cilium-policy-gen
spec:
  version: v1.12.1
  homepage: https://github.com/SoulKyu/cpg
  shortDescription: "Generate CiliumNetworkPolicy from Hubble flows"
  description: |
    Watches dropped network flows in real-time via Hubble Relay and
    automatically generates CiliumNetworkPolicy YAML files that would
    allow them. Useful for clusters with a default-deny posture where
    writing policies manually is tedious and error-prone.

    Supports TCP/UDP ports, ICMP, reserved entities, and CIDR rules.
    Merges with existing policies on disk and writes only on changes.

    Usage:
      kubectl cilium-policy-gen generate -n <namespace>
      kubectl cilium-policy-gen generate --server <relay-addr>
      kubectl cilium-policy-gen generate --cluster-dedup -n <namespace>
  caveats: |
    Requires a running Cilium cluster with Hubble Relay enabled.
    The plugin auto port-forwards to hubble-relay by default.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.1/cilium-policy-gen_linux_amd64.tar.gz
    sha256: 482d5af78129ad29e4a322e03be7cecb4fa90f8f87a5cde8509fab6422cb0dab
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.1/cilium-policy-gen_linux_arm64.tar.gz
    sha256: 702529af1b1d545d1129e5c35bb854377ce33777cdc174a21fab87d1ed4710e5
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.1/cilium-policy-gen_darwin_amd64.tar.gz
    sha256: e6b3ba68b0d18b974cd8575519cfb4775eec73d6afd9128b668992133ea133e9
    bin: kubectl-cilium_policy_gen
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/SoulKyu/cpg/releases/download/v1.12.1/cilium-policy-gen_darwin_arm64.tar.gz
    sha256: c9c8a4a04dde065315f8a0da21d4fd93ec17ac764694d0af534299ea9791c3cf
    bin: kubectl-cilium_policy_gen
