apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cisco-vk
spec:
  version: "v2026.10.0"
  homepage: https://github.com/cisco-open/cisco-virtual-kubelet
  shortDescription: Run read-only IOS-XE commands through CVK
  description: |
    Runs read-only IOS-XE commands through a Cisco Virtual Kubelet
    per-device pod. The plugin discovers the provider pod and uses
    kubectl port-forward to reach its local administrative endpoint.
  caveats: |
    kubectl must be installed and available on PATH. The active Kubernetes
    identity needs permission to get/list pods and create pods/portforward in
    the target namespace. exec currently supports per-device IOS-XE deployments.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.10.0/kubectl-ciscovk_v2026.10.0_darwin_amd64.tar.gz"
    sha256: "1247716f98e54182b5a9977f3236c0e3b5e6bb09b0cd3d6b041122d9c5d83df2"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.10.0/kubectl-ciscovk_v2026.10.0_darwin_arm64.tar.gz"
    sha256: "90556bb541aef2dde11cb483c4075a5a6eaf6fd25aec306e7a528b913255d58c"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.10.0/kubectl-ciscovk_v2026.10.0_linux_amd64.tar.gz"
    sha256: "b9d03e8546a11a7c7639b951a9f1dbd7eda701221feadeabf8da06e174c92d4f"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.10.0/kubectl-ciscovk_v2026.10.0_linux_arm64.tar.gz"
    sha256: "0a786d6680e695ef965a37405b2271f6265ae60fb78117d689e785f432552a7c"
    bin: kubectl-ciscovk
