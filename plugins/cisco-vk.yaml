apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cisco-vk
spec:
  version: "v2026.9.2"
  homepage: https://github.com/cisco-open/cisco-virtual-kubelet
  shortDescription: Run read-only IOS-XE commands through CVK
  description: |
    Runs read-only IOS-XE commands through a Cisco Virtual Kubelet
    per-device pod. The plugin discovers the provider pod and uses
    kubectl port-forward to reach its local administrative endpoint.
  caveats: |
    kubectl must be installed and available on PATH. The active Kubernetes
    identity needs permission to get/list pods and create pods/portforward in
    the target namespace. exec currently supports per-device IOS-XE deployments.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.9.2/kubectl-ciscovk_v2026.9.2_darwin_amd64.tar.gz"
    sha256: "2c7c99fec409cdfccbdfd2f9af733de03650d2354944068e681c2947b7525d8c"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.9.2/kubectl-ciscovk_v2026.9.2_darwin_arm64.tar.gz"
    sha256: "2276237dca65be9c7a6deeafa6631739b6a53cba2f640e46f3c75f9b5972bd09"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.9.2/kubectl-ciscovk_v2026.9.2_linux_amd64.tar.gz"
    sha256: "de8085da2df817a48368784d830a76b1cd8ebe69c7d7b669bd85b75027bb9b8c"
    bin: kubectl-ciscovk
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: "https://github.com/cisco-open/cisco-virtual-kubelet/releases/download/v2026.9.2/kubectl-ciscovk_v2026.9.2_linux_arm64.tar.gz"
    sha256: "825120b5a939825c518d3284e5a07784b6aba5a870172f05a9e440461d9eb187"
    bin: kubectl-ciscovk
