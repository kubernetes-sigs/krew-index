apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: cluster-compare
spec:
  version: v0.13.0
  homepage: https://github.com/openshift/kube-compare
  shortDescription: Diff cluster resources against manifests.
  description: |
    The cluster-compare plugin is capable of performing an intelligent diff between a reference configuration and the specific configuration applied to a cluster.
    The comparison is capable of suppressing diffs of content which is expected to be user variable, validating required and optional configuration, and ignoring known runtime variable fields.
    With these capabilities, a cluster administrator, solutions architect, support engineers, and others can validate a cluster’s configuration against a baseline reference configuration.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_darwin_amd64.tar.gz
      sha256: 549d84f550e788a5eb1c1b0d97e467e4e276e9469799144747d13a877124b69e
      bin: kubectl-cluster_compare
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_darwin_arm64.tar.gz
      sha256: 736060868841b170acc678230a578c58ba5c4b101a6dd0b936dfc4022e8357af
      bin: kubectl-cluster_compare
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_linux_amd64.tar.gz
      sha256: a363bc1519890df77a7be18025be6cd48d1df7d77760374529c91321d8701b22
      bin: kubectl-cluster_compare
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_linux_arm64.tar.gz
      sha256: 0f361f20f3dbeac95442bb2a5d20abaafdeb0da5ed0e11b608c95365eb5249a4
      bin: kubectl-cluster_compare
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_windows_amd64.zip
      sha256: 0ea5bc7bcdce5cbf2ce1015775496729ab8593efbc32990bf14349ff69e7fecb
      bin: kubectl-cluster_compare.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/openshift/kube-compare/releases/download/v0.13.0/kube-compare_windows_arm64.zip
      sha256: d7d1d005b0c0c6fc52fd4b0790370a9c8a05700427d98120cdd63b8bb239d63d
      bin: kubectl-cluster_compare.exe
