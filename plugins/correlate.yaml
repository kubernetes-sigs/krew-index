apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: correlate
  annotations:
    artifacthub.io/category: monitoring-logging
    artifacthub.io/displayName: KubeCorrelate
    artifacthub.io/keywords: |
      - kubernetes
      - logging
      - monitoring
      - events
      - troubleshooting
spec:
  version: "v0.1.6"
  homepage: https://github.com/Dasmat13/kubecorrelate
  shortDescription: Merge logs, events, and node pressures chronologically
  description: |
    KubeCorrelate is a lightweight CLI troubleshooting tool that multiplexes
    pod container logs, Kubernetes events, config updates, and node-level
    resource pressure alerts into a single time-aligned, colorized stream.
  caveats: |
    Requires an active kubeconfig context. Some features like Node watches
    might require permissions that fallback gracefully if missing.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_darwin_amd64.tar.gz
    sha256: 68f79a2647ecb19eea3bceeee53fabfa69d62bab56b1ec444724d614ac79b3e0
    bin: kubecorrelate
    files:
    - from: "kubecorrelate"
      to: "."
    - from: "LICENSE"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_darwin_arm64.tar.gz
    sha256: cddbcc49e819447bc3bf77128de24b309f60db6939617a45f2d157a2bc1027e5
    bin: kubecorrelate
    files:
    - from: "kubecorrelate"
      to: "."
    - from: "LICENSE"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_linux_amd64.tar.gz
    sha256: e9b485ca7b1e3d021ea35a64f77ad79c567076fa40787f115ff17e6b1e983874
    bin: kubecorrelate
    files:
    - from: "kubecorrelate"
      to: "."
    - from: "LICENSE"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_linux_arm64.tar.gz
    sha256: ac32306d632c9a6b3f70680a7a18ae770c3ee2f71b09f529a3bd1b8d9e813851
    bin: kubecorrelate
    files:
    - from: "kubecorrelate"
      to: "."
    - from: "LICENSE"
      to: "."
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_windows_amd64.zip
    sha256: 01e63d3d54f1517f1e7c3422a11bd9a001ab9b71fc60b7ec492f4abe5cae34a4
    bin: kubecorrelate.exe
    files:
    - from: "kubecorrelate.exe"
      to: "."
    - from: "LICENSE"
      to: "."
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Dasmat13/kubecorrelate/releases/download/v0.1.6/kubecorrelate_0.1.6_windows_arm64.zip
    sha256: 7711a6ee5dd5f91abc9f0c66d5c1b315b1f7fd21cb87b7213f1b664027ecbfa2
    bin: kubecorrelate.exe
    files:
    - from: "kubecorrelate.exe"
