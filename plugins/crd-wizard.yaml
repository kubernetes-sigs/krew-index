apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: crd-wizard
spec:
  version: v0.2.1
  homepage: https://github.com/pehlicd/crd-wizard
  shortDescription: A tool to explore Kubernetes CR(D)s via a TUI or web interface.
  description: |
    crd-wizard is a powerful kubernetes plugin that provides two ways to
    explore Custom Resource Definitions (CRDs) and Custom Resources (CRs) in your Kubernetes cluster:

      - A beautiful and interactive Terminal User Interface (TUI)
      - A simple web server providing a JSON API for CRDs

    Read more documentation at: https://github.com/pehlicd/crd-wizard
  platforms:
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.1/kubectl-crd_wizard_v0.2.1_darwin_arm64.tar.gz
    sha256: d7c5da6dd05dbec3f95967905477f0b2409afbb0e36d519b063ca0254a7d4b57
    files:
      - from: LICENSE
        to: .
      - from: kubectl-crd_wizard
        to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.1/kubectl-crd_wizard_v0.2.1_darwin_amd64.tar.gz
    sha256: ec526fe1ff917873a57067b585101aafb7b4647968ae3fe9479c54a317e2a91d
    files:
      - from: LICENSE
        to: .
      - from: kubectl-crd_wizard
        to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.1/kubectl-crd_wizard_v0.2.1_linux_arm64.tar.gz
    sha256: eb6fbc0c69ba0dfcea2f7592aab3461b5d6ea1b9d2c0f16b73cc8edb1453792b
    files:
