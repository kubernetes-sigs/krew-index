    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.0/kubectl-crd_wizard_v0.2.0_linux_amd64.tar.gz
    sha256: 42b734e3375e578a9e5121833bbc8d71add4054e519c9571853a980fa837afcb
