apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: crd-wizard
spec:
  version: v0.2.0
  homepage: https://github.com/pehlicd/crd-wizard
  shortDescription: A tool to explore Kubernetes CR(D)s via a TUI or web interface.
  description: |
    crd-wizard is a powerful kubernetes plugin that provides two ways to
    explore Custom Resource Definitions (CRDs) and Custom Resources (CRs) in your Kubernetes cluster:

      - A beautiful and interactive Terminal User Interface (TUI)
      - A simple web server providing a JSON API for CRDs

    Read more documentation at: https://github.com/pehlicd/crd-wizard
  platforms:
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.0/kubectl-crd_wizard_v0.2.0_darwin_arm64.tar.gz
    sha256: 2a2bfe9a71a713805dd30b2e9c8bcfcaf1de7eefbe6f089ca3bd592b4b2eb16e
    files:
      - from: LICENSE
        to: .
      - from: kubectl-crd_wizard
        to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.0/kubectl-crd_wizard_v0.2.0_darwin_amd64.tar.gz
    sha256: 9889e3efffcd0a2908b7f19afc80f977f72e864a6687f3a35c0d67892a5cb03e
    files:
      - from: LICENSE
        to: .
      - from: kubectl-crd_wizard
        to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-crd_wizard
    uri: https://github.com/pehlicd/crd-wizard/releases/download/v0.2.0/kubectl-crd_wizard_v0.2.0_linux_arm64.tar.gz
    sha256: 2f5ca1ef5c1679fa1d915f1d8a43e5e164f6d858ef56a3d14e9fab715f4c2d89
    files:
      - from: LICENSE
        to: .
      - from: kubectl-crd_wizard
        to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
