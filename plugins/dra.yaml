        os: linux
        arch: arm64
    uri: https://github.com/kphatak/kubectl-dra/releases/download/v0.1.0/kubectl-dra_v0.1.0_linux_arm64.tar.gz
    sha256: c739f6bd92d57868ae6150bbcac2dda352aebd2bfbfbf057e24462ad9092218a
    files:
    - from: kubectl-dra
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/kphatak/kubectl-dra/releases/download/v0.1.0/kubectl-dra_v0.1.0_windows_amd64.tar.gz
    sha256: b19b90761ec7cde8ff0504c51cd477204b1590024bef2e410658b9103bcdc4f6
    files:
    - from: kubectl-dra.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-dra.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/kphatak/kubectl-dra/releases/download/v0.1.0/kubectl-dra_v0.1.0_windows_arm64.tar.gz
    sha256: 8f3fbdfd668a29717dd8275ed4507b1eff7ffdb59c501481ee50feb74deddd8f
