apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: edit-secret
spec:
  version: v0.2.0
  homepage: https://github.com/BardiaYaghmaie/kubectl-edit-secret
  shortDescription: Edit secrets with decoded base64 values
  description: |
    Edit Kubernetes secrets with decoded values: the plugin decodes base64,
    opens a clean YAML view in your editor, and re-encodes and applies on save.

    Features:
    - Multi-line values as YAML block scalars, JSON pretty-printed, binary preserved
    - Change summary and confirmation showing the target context
    - Reopens the editor on invalid YAML or API validation errors; edits never lost
    - TLS cert/key validation and certificate summary before applying
    - Warns about Helm/Argo CD/Flux/operator-managed secrets
    - Shows the workloads using a secret and can restart them
    - Non-interactive edits, secret creation, server-side dry runs, fzf picker
    - Rich tab completion with descriptions
    - Plaintext kept in RAM (/dev/shm on Linux) and wiped on exit or signals
  caveats: |
    Requires a text editor, taken from $KUBE_EDITOR or $EDITOR.

    Tab completion can be enabled with the plugin's completion subcommand;
    see the homepage for details.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/BardiaYaghmaie/kubectl-edit-secret/releases/download/v0.2.0/kubectl-edit-secret_linux_amd64.tar.gz
    sha256: afb34487ef0e6cb7e71cde693c2cd03bd5f967de79103bbc4bd152ee0bd77dc9
    bin: kubectl-edit_secret
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/BardiaYaghmaie/kubectl-edit-secret/releases/download/v0.2.0/kubectl-edit-secret_linux_arm64.tar.gz
    sha256: 72231391d9cf6d6ea80e75d3ea18c1d0447f946495f2d6bedebbe95daef1505a
    bin: kubectl-edit_secret
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/BardiaYaghmaie/kubectl-edit-secret/releases/download/v0.2.0/kubectl-edit-secret_darwin_amd64.tar.gz
    sha256: 39993e0c3a9276ecfd6df00c18b21ea7c217edb10048999566da8e0feb9a8458
    bin: kubectl-edit_secret
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/BardiaYaghmaie/kubectl-edit-secret/releases/download/v0.2.0/kubectl-edit-secret_darwin_arm64.tar.gz
    sha256: 02d053a3d3cd1a5ad55214df553c9a237b339c52569b89ee1f781f778be1e643
    bin: kubectl-edit_secret
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/BardiaYaghmaie/kubectl-edit-secret/releases/download/v0.2.0/kubectl-edit-secret_windows_amd64.zip
    sha256: 88ab7f4164930b29a8c979e13f56628d6f9aa5fa1d31b59c5cec0ec4927fc4b0
    bin: kubectl-edit_secret.exe
