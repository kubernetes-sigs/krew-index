      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bakito/kubexporter/releases/download/v0.10.0/kubexporter_0.10.0_darwin_amd64.tar.gz
    sha256: 74e04e9e586565312ae4b3c10a0d926eaebdccac13491d4c39d8813120eaa835
    bin: kubexporter
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bakito/kubexporter/releases/download/v0.10.0/kubexporter_0.10.0_darwin_arm64.tar.gz
    sha256: 7edae6849658012e8a17d72b9869f93c2bd87092cc0eafbd68b8609437a8e388
    bin: kubexporter
  - selector:
      matchLabels:
        os: linux
        arch: 386
    uri: https://github.com/bakito/kubexporter/releases/download/v0.10.0/kubexporter_0.10.0_linux_386.tar.gz
    sha256: 37714069b4dfc2e6e3f2930c77aa581cfa9cefd22af5bfa36af25ca78cc658e9
