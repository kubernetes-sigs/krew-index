  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bakito/kubexporter/releases/download/v0.10.0/kubexporter_0.10.0_linux_amd64.tar.gz
    sha256: 59205f05633b71841fcf22d8aee7829f2648041eb44aabd952897df197a66af7
