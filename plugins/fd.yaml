      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.2/kubectl-fd_Linux_x86_64.tar.gz
    sha256: 37639054509dffc2aabb609725034a1c11330b994b9e47c089d82ec4099707c8
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
