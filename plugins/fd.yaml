apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fd
spec:
  version: v0.17.0
  homepage: https://github.com/alikhil/kubectl-find
  shortDescription: Find resources and perform action on them.
  description: |
    It's a plugin for kubectl that gives you a UNIX find-like experience.
    Find then print, patch or delete any resource matching the provided criteria based on name, age, labels, etc
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.17.0/kubectl-fd_Linux_x86_64.tar.gz
    sha256: 8538684583392bd1a417548ed5bf69222dbbf1a601d912bdad1f6bab4f2bd0f0
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.17.0/kubectl-fd_Linux_arm64.tar.gz
    sha256: 1874d8e700849afb89fa7bb0721fc42a3abea4800015df3e09715427277626b1
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.17.0/kubectl-fd_Darwin_x86_64.tar.gz
    sha256: 034537f7ef1dbcb8faf161b5e7b4bc8b5f9c7076f71ee5730189aa7b4d37d974
