    sha256: 2290f334ceb7404f118aaddd2c5b9bf95b671ddbf938f44c03387f4138302644
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.2/kubectl-fd_Darwin_x86_64.tar.gz
