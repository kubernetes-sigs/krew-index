      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.1/kubectl-fd_Linux_x86_64.tar.gz
    sha256: a15138ba1e26acb3047061a1a2f61c52b7e61510f3fb28efd2ba882601e594cb
    bin: kubectl-fd
