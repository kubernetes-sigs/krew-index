apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fd
spec:
  version: v0.18.0
  homepage: https://github.com/alikhil/kubectl-find
  shortDescription: Find resources and perform action on them.
  description: |
    It's a plugin for kubectl that gives you a UNIX find-like experience.
    Find then print, patch or delete any resource matching the provided criteria based on name, age, labels, etc
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.18.0/kubectl-fd_Linux_x86_64.tar.gz
    sha256: b50096d7ee073a74c64e3c7b5be86d3e1fcb83d592889df6410bb94481d1923d
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.18.0/kubectl-fd_Linux_arm64.tar.gz
    sha256: 0fd3965ce99b6a5d10134a4ecd0471c82b483721382b1ffcef2a0174d5e215ca
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.18.0/kubectl-fd_Darwin_x86_64.tar.gz
    sha256: 8ba689a835fdc098a664c352c84190057a1ce2a33dabc7326738184b56cb7224
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
