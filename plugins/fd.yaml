apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fd
spec:
  version: v0.16.0
  homepage: https://github.com/alikhil/kubectl-find
  shortDescription: Find resources and perform action on them.
  description: |
    It's a plugin for kubectl that gives you a UNIX find-like experience.
    Find then print, patch or delete any resource matching the provided criteria based on name, age, labels, etc
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.16.0/kubectl-fd_Linux_x86_64.tar.gz
    sha256: 24a158134a56c84142f07a1c941b583bfbde9e0bb4110b8120bbbe64005b63a8
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.16.0/kubectl-fd_Linux_arm64.tar.gz
    sha256: 05d2c5b870789244ac5182731301b5afc6213811024f30c97a6ef394b2daefce
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.16.0/kubectl-fd_Darwin_x86_64.tar.gz
    sha256: 50b320dbb5157ccf549cc1d4bf8ca072e6afae0f8bb6470fa853020eb8c6918d
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
