apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fd
spec:
  version: v0.19.0
  homepage: https://github.com/alikhil/kubectl-find
  shortDescription: Find resources and perform action on them.
  description: |
    It's a plugin for kubectl that gives you a UNIX find-like experience.
    Find then print, patch or delete any resource matching the provided criteria based on name, age, labels, etc
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.0/kubectl-fd_Linux_x86_64.tar.gz
    sha256: 6e2d6311da77911377a840fd068b145d0f572eb0153c64b8f17730eed7e17c85
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.0/kubectl-fd_Linux_arm64.tar.gz
    sha256: 60a7d2c028ce25360b00af529168ded24acf623bf929ca4a3a36c0162e5dbd55
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.0/kubectl-fd_Darwin_x86_64.tar.gz
    sha256: 575f1005bd6b20cf73d52f604bc185f6647f4d1754d18d64dcc2556380f35f3e
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
