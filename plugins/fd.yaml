      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.4/kubectl-fd_Linux_x86_64.tar.gz
    sha256: eb7af294afd36488836e18c7baeb1f7828e7a5c3e60cb44b8dab13dfc64a15f7
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.4/kubectl-fd_Linux_arm64.tar.gz
    sha256: f3eb7617201ae68501df53bd0549ed3ab6041968f9310b5e496cbb14dec47e42
    bin: kubectl-fd
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alikhil/kubectl-find/releases/download/v0.19.4/kubectl-fd_Darwin_x86_64.tar.gz
