apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fieldlord
spec:
  version: "v0.1.5"
  homepage: https://github.com/alexremn/kubectl-fieldlord
  shortDescription: Explain SSA field ownership, drift & clobber
  description: |
    Reads managedFields under Server-Side Apply to explain who owns each field,
    attribute ownership drift to a fieldManager, and predict (via a non-persisting
    server-side dry-run) exactly what --force-conflicts would clobber. Deterministic,
    read-mostly, no LLM.
  caveats: |
    explain and drift are read-only. predict issues a server-side apply with
    dryRun=All (never persists) but does invoke admission webhooks — run against a
    non-production cluster first if their side-effect posture is unknown.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.5/kubectl-fieldlord_linux_amd64.tar.gz
    sha256: f85e2b08a7d9a5c53e5d492db7e1d8754f340b2de02d76fcfc1390f1ead0889d
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.5/kubectl-fieldlord_linux_arm64.tar.gz
    sha256: d6747ba0d254eee70b976677a4f9198dc0e6d93c158b0bb060ade20aa58853ef
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.5/kubectl-fieldlord_darwin_amd64.tar.gz
    sha256: cb7b752cff1ec056c17a9054d9d45fb0888da7dbacf614cd7481810131590e95
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.5/kubectl-fieldlord_darwin_arm64.tar.gz
    sha256: efe5866303d149ffb9c14b28e60f9e67bd01f8d0b99ff258355ed50fc3a0d4f1
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.5/kubectl-fieldlord_windows_amd64.zip
    sha256: 905a9c10c933cb0bd3e8717a535a0c909909a3bf10e600e5d9674e4c38bfcb9a
    bin: kubectl-fieldlord.exe
