apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fieldlord
spec:
  version: "v0.1.2"
  homepage: https://github.com/alexremn/kubectl-fieldlord
  shortDescription: Explain SSA field ownership, drift & clobber
  description: |
    Reads managedFields under Server-Side Apply to explain who owns each field,
    attribute ownership drift to a fieldManager, and predict (via a non-persisting
    server-side dry-run) exactly what --force-conflicts would clobber. Deterministic,
    read-mostly, no LLM.
  caveats: |
    explain and drift are read-only. predict issues a server-side apply with
    dryRun=All (never persists) but does invoke admission webhooks — run against a
    non-production cluster first if their side-effect posture is unknown.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.2/kubectl-fieldlord_linux_amd64.tar.gz
    sha256: 7efdd2da713fc21d1ac3b365d84987358353b1f85af3a4a83da7e8f1c1576eb4
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.2/kubectl-fieldlord_linux_arm64.tar.gz
    sha256: b3677cc92b592b00d72948146c4ad9f8969f3b726f11b593798da17b7de9961b
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.2/kubectl-fieldlord_darwin_amd64.tar.gz
    sha256: aeb6cf82dc17d1aef0ceebe0c5322ddb683ca8bd4435fb256162c41ed041f0ea
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.2/kubectl-fieldlord_darwin_arm64.tar.gz
    sha256: e304a9cd2ef145f079b41293d846071d728876fee0b3ebafc061c666340a9b6a
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.2/kubectl-fieldlord_windows_amd64.zip
    sha256: 46fecc65474381cbbc682c5337a8ae99df696cae2ddf1d3c9bb243e6c45acea4
    bin: kubectl-fieldlord.exe
