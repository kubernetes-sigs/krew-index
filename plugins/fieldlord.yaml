apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fieldlord
spec:
  version: "v0.1.4"
  homepage: https://github.com/alexremn/kubectl-fieldlord
  shortDescription: Explain SSA field ownership, drift & clobber
  description: |
    Reads managedFields under Server-Side Apply to explain who owns each field,
    attribute ownership drift to a fieldManager, and predict (via a non-persisting
    server-side dry-run) exactly what --force-conflicts would clobber. Deterministic,
    read-mostly, no LLM.
  caveats: |
    explain and drift are read-only. predict issues a server-side apply with
    dryRun=All (never persists) but does invoke admission webhooks — run against a
    non-production cluster first if their side-effect posture is unknown.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.4/kubectl-fieldlord_linux_amd64.tar.gz
    sha256: bcd6e3b21459a3cea991bc73d47840dcd3127a807efbe9b23cf594c75e88599a
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.4/kubectl-fieldlord_linux_arm64.tar.gz
    sha256: 68316f8f7487838db8fece3bee06c62e24d17e58f11b1b9628d6d7f231f68607
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.4/kubectl-fieldlord_darwin_amd64.tar.gz
    sha256: 88ddcc4f0afa17b14d4a18361cd1cacf66026de78569c312a52cfa711c0de3d8
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.4/kubectl-fieldlord_darwin_arm64.tar.gz
    sha256: ed2011a89314a7a8231a1633ac93a3098e5cbcff9359337f8c3ce4a1cf32060b
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.4/kubectl-fieldlord_windows_amd64.zip
    sha256: 8dbb788209362b35a2e648f4af7f08e929ac3f821d3c2fbcc30a53d6f0c0fce1
    bin: kubectl-fieldlord.exe
