apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fieldlord
spec:
  version: "v0.1.1"
  homepage: https://github.com/alexremn/kubectl-fieldlord
  shortDescription: Explain SSA field ownership, drift & clobber
  description: |
    Reads managedFields under Server-Side Apply to explain who owns each field,
    attribute ownership drift to a fieldManager, and predict (via a non-persisting
    server-side dry-run) exactly what --force-conflicts would clobber. Deterministic,
    read-mostly, no LLM.
  caveats: |
    explain and drift are read-only. predict issues a server-side apply with
    dryRun=All (never persists) but does invoke admission webhooks — run against a
    non-production cluster first if their side-effect posture is unknown.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.1/kubectl-fieldlord_linux_amd64.tar.gz
    sha256: bb3f65ad206277b8a025cef55c27877dd0fd8e2ce2d2cd3852274b4e0133762d
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.1/kubectl-fieldlord_linux_arm64.tar.gz
    sha256: 6b70dbd7990636cf3f8790a9aeae2f42af3f7ac7b3134fb1b4d387a57f1ddb6d
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.1/kubectl-fieldlord_darwin_amd64.tar.gz
    sha256: ddd7babe28c18b4399c475e1e53e582f2a820f1f50154b5ce8b65d21d84b386c
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.1/kubectl-fieldlord_darwin_arm64.tar.gz
    sha256: 3bc4bef823a9649d85b4cab24a7923907041d34dd12a4d381111d647e169ede5
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.1/kubectl-fieldlord_windows_amd64.zip
    sha256: 71b01449ec415d2c178479af899f154b664a250d027f1317ad611489c530446b
    bin: kubectl-fieldlord.exe
