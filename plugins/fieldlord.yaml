apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: fieldlord
spec:
  version: "v0.1.3"
  homepage: https://github.com/alexremn/kubectl-fieldlord
  shortDescription: Explain SSA field ownership, drift & clobber
  description: |
    Reads managedFields under Server-Side Apply to explain who owns each field,
    attribute ownership drift to a fieldManager, and predict (via a non-persisting
    server-side dry-run) exactly what --force-conflicts would clobber. Deterministic,
    read-mostly, no LLM.
  caveats: |
    explain and drift are read-only. predict issues a server-side apply with
    dryRun=All (never persists) but does invoke admission webhooks — run against a
    non-production cluster first if their side-effect posture is unknown.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.3/kubectl-fieldlord_linux_amd64.tar.gz
    sha256: d7d1eafa2114deaacc6bd2e4ea83bc060d1f43ac34baed52196a520dec40502a
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.3/kubectl-fieldlord_linux_arm64.tar.gz
    sha256: b5e94e6724b0d97b9ac4335f0b96650b41309e8404864e8740c792cf23b788a0
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.3/kubectl-fieldlord_darwin_amd64.tar.gz
    sha256: 32cd9fecde219c8eeb2ba8ea96f7d1ccfbb0eee315b18a98f88d8647e43ee5e2
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.3/kubectl-fieldlord_darwin_arm64.tar.gz
    sha256: 309176d331f9181c7058ed810167bb70446dd79cf1e293bea220547f9ba96a66
    bin: kubectl-fieldlord
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/kubectl-fieldlord/releases/download/v0.1.3/kubectl-fieldlord_windows_amd64.zip
    sha256: 635e9496caf254fe80c82cb09b155292c83a9f12d8b50a26a3ad7a6ff60a834d
    bin: kubectl-fieldlord.exe
