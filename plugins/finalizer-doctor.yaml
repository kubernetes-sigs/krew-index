apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: finalizer-doctor
spec:
  version: "v0.1.4"
  homepage: https://github.com/alexremn/finalizer-doctor
  shortDescription: Safely diagnose & clear stuck finalizers
  description: |
    Pinpoints the finalizer and the dead controller / APIService blocking
    deletion, cleans truly-orphaned resources first, and clears finalizers only
    as a gated last resort. Dry-run and explain by default.
  caveats: |
    This is a last resort. Clearing a finalizer is irreversible and can orphan
    infrastructure. Run without --apply first to see the evidence and verdict.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.4/finalizer-doctor_linux_amd64.tar.gz
    sha256: 818e488c0d2c02e5cbb6472df0d0c2974ad344b3850654ed601b09ac4a6dd93e
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.4/finalizer-doctor_linux_arm64.tar.gz
    sha256: c4c39457c200007dfe59a136c73533ec924552751f930b4afb6ad686fcd80f70
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.4/finalizer-doctor_darwin_amd64.tar.gz
    sha256: b9c0c2abe35b74e248b9ea67eafa8c4206a5afbc2f05713726e103d9889fd536
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.4/finalizer-doctor_darwin_arm64.tar.gz
    sha256: 2af39e33fb6216ee02e923b3a4aa079b1d2b49fbb958974b213adb5e8dd19b9a
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.4/finalizer-doctor_windows_amd64.tar.gz
    sha256: b46557ebdfc405f632bd59986216c81bf261746747d4e443a03b08a00ffbf254
    bin: kubectl-finalizer_doctor.exe
