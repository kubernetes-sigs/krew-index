apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: finalizer-doctor
spec:
  version: "v0.1.6"
  homepage: https://github.com/alexremn/finalizer-doctor
  shortDescription: Safely diagnose & clear stuck finalizers
  description: |
    Pinpoints the finalizer and the dead controller / APIService blocking
    deletion, cleans truly-orphaned resources first, and clears finalizers only
    as a gated last resort. Dry-run and explain by default.
  caveats: |
    This is a last resort. Clearing a finalizer is irreversible and can orphan
    infrastructure. Run without --apply first to see the evidence and verdict.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.6/finalizer-doctor_linux_amd64.tar.gz
    sha256: 7da3ade762b9962412e016cd9d92eb5e9099e8fb4351d60ede88cb91d5870a26
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.6/finalizer-doctor_linux_arm64.tar.gz
    sha256: 84206a9b4e97765899db91434297d9aeca6aa639644d045aa1577bb8ecf40995
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.6/finalizer-doctor_darwin_amd64.tar.gz
    sha256: 39e86f77ecf44c644cd8e5f84bd8cb2172db067fc588bfe18499ccf3d9a20b33
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.6/finalizer-doctor_darwin_arm64.tar.gz
    sha256: a1e1cc6baa608a6401a3738d895cfc035e16572798ad21f1155b7ed0147b45f3
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.6/finalizer-doctor_windows_amd64.tar.gz
    sha256: 0a05662a97a439c0015c5061b7f688b17edb608d6d93732eb28787ce2945d8de
    bin: kubectl-finalizer_doctor.exe
