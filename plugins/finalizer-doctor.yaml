apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: finalizer-doctor
spec:
  version: "v0.1.7"
  homepage: https://github.com/alexremn/finalizer-doctor
  shortDescription: Safely diagnose & clear stuck finalizers
  description: |
    Pinpoints the finalizer and the dead controller / APIService blocking
    deletion, cleans truly-orphaned resources first, and clears finalizers only
    as a gated last resort. Dry-run and explain by default.
  caveats: |
    This is a last resort. Clearing a finalizer is irreversible and can orphan
    infrastructure. Run without --apply first to see the evidence and verdict.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.7/finalizer-doctor_linux_amd64.tar.gz
    sha256: 4d8b35031ab35dc23dddd5950a63679b41f5812e120ade3c9ced3e26cdb55842
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.7/finalizer-doctor_linux_arm64.tar.gz
    sha256: f0afc204fbd6415688fa650dc32c38853a8ebe8aab534b314fe0ad7205164a72
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.7/finalizer-doctor_darwin_amd64.tar.gz
    sha256: 693775a71d99bebcde42c4e0710e4caa03d138b7c4e3e2a25f0fe7ad3ccbf781
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.7/finalizer-doctor_darwin_arm64.tar.gz
    sha256: df77c6b90f7c1bea112e2812e4093840d371965f59c4509f54e7a458676aad73
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.7/finalizer-doctor_windows_amd64.tar.gz
    sha256: 8e40e1d67aa0147e2e1be6f0d47805865c4054475d8065d04f9b1b140b825d2c
    bin: kubectl-finalizer_doctor.exe
