apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: finalizer-doctor
spec:
  version: "v0.1.5"
  homepage: https://github.com/alexremn/finalizer-doctor
  shortDescription: Safely diagnose & clear stuck finalizers
  description: |
    Pinpoints the finalizer and the dead controller / APIService blocking
    deletion, cleans truly-orphaned resources first, and clears finalizers only
    as a gated last resort. Dry-run and explain by default.
  caveats: |
    This is a last resort. Clearing a finalizer is irreversible and can orphan
    infrastructure. Run without --apply first to see the evidence and verdict.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.5/finalizer-doctor_linux_amd64.tar.gz
    sha256: fc324713257216fef79bbb68b917356038be1b236f07ab67d7f3b452d8f6a6ed
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.5/finalizer-doctor_linux_arm64.tar.gz
    sha256: e0334acbb1902e04cec6945072aeab6922ff3720f0c8c11e677ed0067dd5ac2f
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.5/finalizer-doctor_darwin_amd64.tar.gz
    sha256: 2d20cb2af4d56f1f57ce8773219001ce0f6884f17810b0b2b2829aad970de8ad
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.5/finalizer-doctor_darwin_arm64.tar.gz
    sha256: cfd8bcc95d81442ca14a699286a71c87aa57c748241b2a508c1db4b43f68d24d
    bin: kubectl-finalizer_doctor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/alexremn/finalizer-doctor/releases/download/v0.1.5/finalizer-doctor_windows_amd64.tar.gz
    sha256: b374a26a5e54748502a36987b9033a22a9df6607848d06c36faa88165b223c17
    bin: kubectl-finalizer_doctor.exe
