# The krew-index manifest, rendered by krew-release-bot for each release (.github/workflows/release.yml) and by
# hack/krew-manifest.sh for the first, manual submission. One entry per archive goreleaser builds.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: flink-triage
spec:
  version: v0.2.0
  homepage: https://github.com/patrk/kubectl-flink
  shortDescription: Health and triage of Flink jobs
  description: |
    For the Apache Flink Kubernetes Operator: one health value for every FlinkDeployment and FlinkSessionJob,
    across namespaces and clusters, and the cause of a failing job with its evidence from the operator,
    Kubernetes, the JobManager's logs and its REST API. A live terminal UI, the job graph, exceptions,
    checkpoints, snapshots and a redacted handover bundle for a ticket. Read-only.
  caveats: |
    Tab completion: krew links only the plugin. Copy kubectl_complete-flink_triage from
    ~/.krew/store/flink-triage/v0.2.0/ to a directory on your PATH.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/patrk/kubectl-flink/releases/download/v0.2.0/kubectl-flink_v0.2.0_linux_amd64.tar.gz
    sha256: ec7988bc784f09f80e73a947402d58b750484ac9019e3ac6f18611f92d5c5015
    bin: kubectl-flink_triage
    files:
      - from: kubectl-flink_triage
        to: .
      - from: kubectl_complete-flink_triage
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/patrk/kubectl-flink/releases/download/v0.2.0/kubectl-flink_v0.2.0_linux_arm64.tar.gz
    sha256: 0452d0c1e21d0ee117358d6aafa6b5a695e0fda7fc0618b8a574629c8f1adc6a
    bin: kubectl-flink_triage
