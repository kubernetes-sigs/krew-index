    uri: https://github.com/patrk/kubectl-flink/releases/download/v0.1.0/kubectl-flink_v0.1.0_darwin_arm64.tar.gz
    sha256: c52d2bda55a8a5366db45e39e2c9f3351e51b004f28b95553744b7c23d437f63
    bin: kubectl-flink
    files:
      - from: kubectl-flink
