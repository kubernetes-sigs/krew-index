apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.3.3"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--cloud-info), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.3/kubectl-glance-0.3.3-darwin-amd64.tar.gz
    sha256: 99c65e518d60b5c7f5a1cd1fc187d315d0052b4e6bba4457cf04602d5b12fc52
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.3/kubectl-glance-0.3.3-darwin-arm64.tar.gz
    sha256: b790cf3ab1ebe2f1965df394647607e08f9acf1a17547f2cc0ddd3974e553299
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.3/kubectl-glance-0.3.3-linux-amd64.tar.gz
    sha256: c7d42503038b9681b7833279b42a0769952620a4ec4b6c34873d3a147fef5472
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
