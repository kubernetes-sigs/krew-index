apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.4.0"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--cloud-info), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.0/kubectl-glance-0.4.0-darwin-amd64.tar.gz
    sha256: 86eb68a536b965da815aab9d322e3ad686d679a562048fce087e4bee37e85db6
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.0/kubectl-glance-0.4.0-darwin-arm64.tar.gz
    sha256: bdeee9362be09ef1ebdd62b3d728374d54d8292a26ec0d1692ed8424dd9b3d22
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.0/kubectl-glance-0.4.0-linux-amd64.tar.gz
    sha256: dbfcc712532d59ff070ac1ca0017badec582f621bdaf0b40b8f8c78462ace663
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.0/kubectl-glance-0.4.0-linux-arm64.tar.gz
    sha256: 07d6b2ad896feec733d788f823d5c041e6519146d9ac57e67e29fc27c23aa8d1
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.4.0/kubectl-glance-0.4.0-windows-amd64.tar.gz
    sha256: 9a50ff62a0e1ad836d554f8e6681d334666b3ca4f63fc77dc1de27fd64e5a985
    bin: kubectl-glance.exe
    files:
    - from: "*"
