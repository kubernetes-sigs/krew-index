apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.4.3"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--show-cloud-provider), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.3/kubectl-glance-0.4.3-darwin-amd64.tar.gz
    sha256: 8a4a4f336e9f59d97114be3cde188d3efd95d97628a1b62bc288cc8466f6315a
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.3/kubectl-glance-0.4.3-darwin-arm64.tar.gz
    sha256: 2b147ec04e90813b2044a4503c6f4777d4a1aa5c784d99a72f5d9ea25169a542
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.3/kubectl-glance-0.4.3-linux-amd64.tar.gz
    sha256: 56e10bf5c683f3bea0a4e3e3b7f12c86d44d4a55428712dd01eeea3cce3a9063
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.3/kubectl-glance-0.4.3-linux-arm64.tar.gz
    sha256: 689cd8eb10e699b88b3daffcd06519a16221cec90da072350dff40593031a616
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.3/kubectl-glance-0.4.3-windows-amd64.tar.gz
    sha256: 7b6464dbb9ae4c3f95e955d53b1916ccfa6a6c7a96af61351eddad3908ef4711
    bin: kubectl-glance.exe
    files:
    - from: "*"
      to: "."
