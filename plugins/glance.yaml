apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.4.2"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--show-cloud-provider), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.2/kubectl-glance-0.4.2-darwin-amd64.tar.gz
    sha256: 48b899f7d9aab59c906e139d720eca92b110445fe5530cef2320ce8247ca2111
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.2/kubectl-glance-0.4.2-darwin-arm64.tar.gz
    sha256: 976dd547470671b4b968f6541b30cac1267939e0668e6dc9940c07bb0ef3e090
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.2/kubectl-glance-0.4.2-linux-amd64.tar.gz
    sha256: e47b5daeb99978f01d6428865db9dadb2d8a2ecb5b6f889da0e5e3956ecbdd8b
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.2/kubectl-glance-0.4.2-linux-arm64.tar.gz
    sha256: b70ba63d40fc2a4d2634b6adef54be792286552c32ed24c3a68c6f55719e500c
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/DavidXArnold/glance/releases/download/v0.4.2/kubectl-glance-0.4.2-windows-amd64.tar.gz
    sha256: 6d3d44803b5dc343e50f0d944dff44f0821d31b86d78cb2249491aef87ae7477
    bin: kubectl-glance.exe
    files:
    - from: "*"
      to: "."
