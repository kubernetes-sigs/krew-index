    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.1/kubectl-glance-0.3.1-linux-arm64.tar.gz
    sha256: 9f03e3b9938f8c365093ce830bc432b90d001697f474221d84ab41088151e7a2
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
