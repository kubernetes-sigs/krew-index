    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.2/kubectl-glance-0.3.2-linux-arm64.tar.gz
    sha256: 1e46965cb9e484eb31879ebfa6fc9af25c9a9c7c735ed5b4126ffe91ea9fc93c
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
