    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.3/kubectl-glance-0.3.3-linux-arm64.tar.gz
    sha256: c3ba4d665636242e3dc3c463cb442a01ada261cc4b60ca466183905f5c8ce2fa
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: windows
