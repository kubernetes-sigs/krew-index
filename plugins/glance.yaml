    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.3/kubectl-glance-0.3.3-windows-amd64.tar.gz
    sha256: 4f9891e2eb711de0f97db9f52ae1351a72f9b0b0dfbeed1a535452b9faae1dcb
