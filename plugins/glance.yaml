apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: glance
spec:
  version: "v0.3.1"
  homepage: https://gitlab.com/davidxarnold/glance
  shortDescription: View cluster resource allocation and usage.
  description: |
    Glance is a kubectl plugin that displays cluster resource allocation and utilization.

    It allows you to quickly view:
    - Node resource allocation (CPU and memory)
    - Pod resource requests and limits
    - Cluster-wide totals
    - Cloud provider node information (optional)

    Features:
    - Multiple output formats (text, pretty, JSON, charts)
    - Human-readable and exact value display
    - Label and field selectors

    Usage:
      kubectl glance                    # Default view
      kubectl glance -o pretty          # Colored output
      kubectl glance -o json            # JSON format
      kubectl glance --selector tier=app # Filter by labels
      kubectl glance -c                 # Include cloud provider info
  caveats: |
    This plugin requires kubectl 1.12 or higher.
    For cloud provider information (--cloud-info), ensure proper cloud credentials are configured.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.1/kubectl-glance-0.3.1-darwin-amd64.tar.gz
    sha256: 1b11f700efd0a054c6dac49c8a9b336c0f08f3ed5e04153dee9ad942c3a00d20
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.1/kubectl-glance-0.3.1-darwin-arm64.tar.gz
    sha256: 657a9fe657078046a9838bca5156611d9aac156f0f3338b601937d3300cc5fec
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://gitlab.com/api/v4/projects/9502011/packages/generic/kubectl-glance/0.3.1/kubectl-glance-0.3.1-linux-amd64.tar.gz
    sha256: 3f33aeb81dd6a473b6df4ed91430d9b395f50db6873ce1b2f923776d65dfe630
    bin: kubectl-glance
    files:
    - from: "*"
      to: "."
  - selector:
      matchLabels:
