# krew-release-bot template. Rendered on every tag push, the result is
# what gets PR'd to krew-index. The bot resolves `addURIAndSha` by
# fetching each release archive and computing its sha256.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: gpugo
spec:
  version: "v0.2.0"
  homepage: https://github.com/Tal-Naeh/kubectl-gpugo
  shortDescription: Top-like TUI for per-pod GPU usage on Kubernetes
  description: |
    A zero-cluster-footprint, top-like TUI for per-pod GPU usage on
    Kubernetes. Auto-discovers any GPU metrics exporter you already
    have running (dcgm-exporter, or any per-process exporter emitting
    gpu_process_memory_bytes) and scrapes it through the kube-apiserver
    pod-proxy subresource — no DaemonSet to install, no port-forwards
    on your machine, no firewall changes.

    Handles MIG: per-slice rows are grouped by physical GPU and labeled
    with the slice ID (e.g. "0:8" = GPU 0, MIG slice 8). When workloads
    bypass the NVIDIA device plugin via NVIDIA_VISIBLE_DEVICES=all,
    falls back to per-(node, GPU) attribution and lists candidate pods.

    The TUI is scrollable, sorted by physical GPU, and refreshes every
    20 seconds.
  caveats: |
    Requires:
      - A GPU exporter (dcgm-exporter, or one emitting
        gpu_process_memory_bytes) running in the target cluster.
      - The user's RBAC must allow "list pods" cluster-wide and
        "get pods/proxy" in the exporter's namespace.

    Will not work with Lens local-proxy kubeconfigs — their proxy does
    not pass pod-proxy subresource requests through. Use a direct
    kubeconfig.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Tal-Naeh/kubectl-gpugo/releases/download/v0.2.0/kubectl-gpugo_v0.2.0_darwin_amd64.tar.gz
    sha256: 6da852c0bb9d8e21d0b3643939e8511270de6eb21acce2f55a6bb2825a9f9e78
    bin: kubectl-gpugo
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Tal-Naeh/kubectl-gpugo/releases/download/v0.2.0/kubectl-gpugo_v0.2.0_darwin_arm64.tar.gz
    sha256: 0a1849c2cf4124824e9331074e8f01659a8480c6ef7bed088a2e9d7a1a95235b
    bin: kubectl-gpugo
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Tal-Naeh/kubectl-gpugo/releases/download/v0.2.0/kubectl-gpugo_v0.2.0_linux_amd64.tar.gz
    sha256: 1e696fb9d4100670ffc3916283b4db56a2cea2697996c951db992acd7cf18e98
    bin: kubectl-gpugo
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Tal-Naeh/kubectl-gpugo/releases/download/v0.2.0/kubectl-gpugo_v0.2.0_linux_arm64.tar.gz
    sha256: 3edcf76fe68e15a1017f301fb3aee5059d17a98a47908dfa1c467859d2f1b649
    bin: kubectl-gpugo
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Tal-Naeh/kubectl-gpugo/releases/download/v0.2.0/kubectl-gpugo_v0.2.0_windows_amd64.zip
    sha256: 1b04f44a1ecbd794b6532f874b8d6489dcb2316f7186c74e1144ce97b4b886e1
    bin: kubectl-gpugo.exe
