apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: grep
spec:
  platforms:
  - uri: https://github.com/guessi/kubectl-grep/releases/download/v1.33.0/kubectl-grep-Darwin-x86_64.tar.gz
    sha256: 6105ed0c361dafa49e3672a84acb4b4f4fc679c4021e56ea6025475e72849584
    bin: kubectl-grep
    files:
    - from: kubectl-grep
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - uri: https://github.com/guessi/kubectl-grep/releases/download/v1.33.0/kubectl-grep-Darwin-arm64.tar.gz
    sha256: 8bc99c61876e6d87d304b39db4152226b6b6544771e317091757676c82957635
    bin: kubectl-grep
    files:
    - from: kubectl-grep
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - uri: https://github.com/guessi/kubectl-grep/releases/download/v1.33.0/kubectl-grep-Linux-x86_64.tar.gz
    sha256: 67b23543865ad9d908fffe75591ccb729ba1a9fb36057335d85aaeff8b833010
    bin: kubectl-grep
    files:
    - from: kubectl-grep
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - uri: https://github.com/guessi/kubectl-grep/releases/download/v1.33.0/kubectl-grep-Linux-arm64.tar.gz
    sha256: f3f7ef4082131bbf6baf7c7f8f557ca54fcebcfe1ef943a6f32f7f6a6bbe2fc1
    bin: kubectl-grep
    files:
    - from: kubectl-grep
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - uri: https://github.com/guessi/kubectl-grep/releases/download/v1.33.0/kubectl-grep-Windows-x86_64.tar.gz
    sha256: b49a99a0b2355f5f5ab4e7872d348359773dd315907b9ecaca6ba79f6676e6d6
    bin: kubectl-grep.exe
    files:
    - from: kubectl-grep.exe
      to: .
    - from: LICENSE.txt
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
  version: v1.33.0
  homepage: https://github.com/guessi/kubectl-grep
  shortDescription: Filter Kubernetes resources by matching their names
  description: |
    Filter Kubernetes resources by matching their names

    Examples:

    List all pods in all namespaces
    $ kubectl grep pods --all-namespaces

    List all pods in namespace "star-lab" which contain the keyword "flash"
    $ kubectl grep pods -n star-lab flash

    No more pipe, built-in grep :-)
