apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: guard-workloads
spec:
  version: v0.6.0
  homepage: https://github.com/andronaft/k8s-guardian
  shortDescription: Audit and auto-fix workloads against guardrails
  description: |
    guard-workloads audits Kubernetes manifests, Helm charts, Kustomize
    overlays and live cluster resources for missing resource requests and
    limits, root containers, privilege escalation, missing probes, mutable
    image tags, host namespaces and more. It fixes what is safe to fix
    automatically while keeping YAML comments, checks whether a manifest
    fits the target cluster (quotas, node capacity, LimitRanges, missing
    ConfigMaps/Secrets) and flags breaking changes against what is deployed.
  caveats: |
    Checking local files works offline. Some features need extra setup:
      * --live, audit and diff read the cluster of your current kubeconfig
        (read-only, via kubectl).
      * --ai and "rule create" call the Anthropic API and need
        ANTHROPIC_API_KEY. Secrets are never sent.
      * cost --usage needs metrics-server or Prometheus (--prometheus URL).
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_linux_amd64.tar.gz
      sha256: c78a67d9f5f4302af8027a3d21e52930dd87502bf36ee29fbf4d28c81a68963f
      bin: kubectl-guard
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_linux_arm64.tar.gz
      sha256: 050136cf673dbe11e77e090a09ab45437ba893aec57e1769ae2c63fd603b031f
      bin: kubectl-guard
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_darwin_amd64.tar.gz
      sha256: 26dc572583f6135585d02787b3772527e9f6ffdd8da3dfa85ec86a0ba165ad2c
      bin: kubectl-guard
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_darwin_arm64.tar.gz
      sha256: df1a689da6a1fccd4b08d23fc4b9049ba8cc1df39492b2cd03cd2974d26e78b9
      bin: kubectl-guard
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_windows_amd64.zip
      sha256: 010be0d1d19d9b43d8f5d2e28166cefab4491648c99df307999a553bc03039cd
      bin: kubectl-guard.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/andronaft/k8s-guardian/releases/download/v0.6.0/kubectl-guard_v0.6.0_windows_arm64.zip
      sha256: 7d81a152610086867fc8780d6857b050854da98521b60ecb1fa8b13c269760b3
      bin: kubectl-guard.exe
