    uri: https://github.com/mattsu2020/kubectl-hpa-status/releases/download/v3.0.0/kubectl-hpa-status_v3.0.0_linux_arm64.tar.gz
    sha256: 050eb1f7f62ab118e15cbdf75f9c13fe470ab4a10a42ccd492b61281b29f4f0f
