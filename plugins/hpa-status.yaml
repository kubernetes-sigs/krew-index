    uri: https://github.com/mattsu2020/kubectl-hpa-status/releases/download/v4.0.0/kubectl-hpa-status_v4.0.0_linux_arm64.tar.gz
    sha256: 7da4ee13f5bedf32df8516bb3466bb06dac9c405674501bb8754bec9161bcc68
