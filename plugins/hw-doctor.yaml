      uri: https://github.com/kubectl-ltd/kubectl-hw-doctor/releases/download/v0.1.0/kubectl-hw-doctor_v0.1.0_windows_amd64.zip
      sha256: 859d99164f46a4f4f4365eb4d1dd9d39f82d1df3a0a4ed53c37032298bb651de
      files:
