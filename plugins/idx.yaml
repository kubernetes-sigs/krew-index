apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.1.2
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_linux_amd64.tar.gz
    sha256: 7f665ad77b327051f08b30cbc9f3f684f04c62a167b9b7cf9fe06abe9a1055c1
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_linux_arm64.tar.gz
    sha256: a9bfbf99bbd7a37388c9d22f180f4c6ad90428a2c766f7b24713879f57ef96ec
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_darwin_amd64.tar.gz
    sha256: 70de99818a7fac4413c0d7651b0821253858fc07584f0cef53a0fc241caa9b0e
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_darwin_arm64.tar.gz
    sha256: abf11a0979829c35f0fc604421d4cff1bb46d64bc10483ef963e5f1f762e1300
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_windows_amd64.zip
    sha256: d14e3cb5a2c5bbec61f3e5dec56ccc26fdad4d12313054c2b8a239ca5b60dd71
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.1.2/kx_v0.1.2_windows_arm64.zip
    sha256: a0a134771aa71b41b662d050f27184af22a4846b476d9cc05ca0a996333e9a84
    bin: kx/kx.exe
