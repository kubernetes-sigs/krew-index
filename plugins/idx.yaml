apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.9.1
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_linux_amd64.tar.gz
    sha256: 1e30431ed0cd3f13b7e40a6225ca0f4dd8f2000b00f8f81b709b340638dcc3cf
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_linux_arm64.tar.gz
    sha256: 9d9d2620bdd4ab15cfc5ec5a5ca0b43d96cba12c0e1a0aed0131fba6b2ceb596
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_darwin_amd64.tar.gz
    sha256: 079ceb3ed9cf706d21f4eaf9e1004e1f2eac6d607dca687226d107033f8802f5
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_darwin_arm64.tar.gz
    sha256: 3157297aecec8d9b8f5de555f33ec8c5da29bfa851c40a193986a61124e6348c
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_windows_amd64.zip
    sha256: 892f023a8de18c0fdb1508d040579e21a05216bc0996d61fbb58a3a3fa403c99
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.1/kx_v0.9.1_windows_arm64.zip
    sha256: a34bbf082eb67536f9571d896e39ef164f0f1ae10978f324e6b9380a34c3ca35
    bin: kx/kx.exe
