apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.9.2
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_linux_amd64.tar.gz
    sha256: 66faa63195aec66487997703c3970438f47f26bd50794599d1ff27b428c4fde8
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_linux_arm64.tar.gz
    sha256: 23fe1accc4833f7caee776bc6b5bdb365b319571cdea90058589e5d428bf3f99
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_darwin_amd64.tar.gz
    sha256: 401c309b7731c5a879173d3706d07bccc67295eb74351553e1f338d53366e97f
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_darwin_arm64.tar.gz
    sha256: 8e5810854cff34b804605fa5ab64ea47cb880de1834db23c1cc4f4385c5c4e2c
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_windows_amd64.zip
    sha256: 0356256937c28f1a91894130b7d17a1a0087bc8df8bf5e7269cebf98dabe7c2d
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.2/kx_v0.9.2_windows_arm64.zip
    sha256: e3754ae735dff17b62bd391a710bef4b37893525c0e9bd1c8f14d99d7f3fbd35
    bin: kx/kx.exe
