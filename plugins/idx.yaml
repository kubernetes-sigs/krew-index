apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.15.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_linux_amd64.tar.gz
    sha256: 3e188942ce4b1c1c1ea7687069cc0572b8d58344f8a1bc2fd47a83f82b756d1e
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_linux_arm64.tar.gz
    sha256: c0a4894c000ce7ac10e4a60ddc96b14f474ed5c814612d6cb407b35846f207cc
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_darwin_amd64.tar.gz
    sha256: 159b7ab35286651bba9c568b712704087e07da294f21f5e712929985ef248e11
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_darwin_arm64.tar.gz
    sha256: 1843f1a2af0a917febe49d64dee67b41c59d2cc20786827c32e7679d514017ac
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_windows_amd64.zip
    sha256: c18dfca9564d1d6104b64bf2a964aa60ae9f2eb85773f04e7bb3145ffa8c8878
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.15.0/kx_v0.15.0_windows_arm64.zip
    sha256: 822d6e097b157ab80d37b4bf9b29a85972e6d5e2b85df20fb11de05cf61371a4
    bin: kx/kx.exe
