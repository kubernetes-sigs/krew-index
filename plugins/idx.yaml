apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.5.2
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_linux_amd64.tar.gz
    sha256: 16d91f7307b1f948566888a657a1d32b3bd5c5e3a6efb112372875d8a168558d
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_linux_arm64.tar.gz
    sha256: 851522fc7ae775ec85be9a9a788c2c2b74e787b6a4af9dd68c1e7a92bd2f234d
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_darwin_amd64.tar.gz
    sha256: df6804c2381e4241e0b6dfe0943a394433ef011d3ab8bc0e63f56f8b13773f26
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_darwin_arm64.tar.gz
    sha256: 265dd45a724382709f1586cd6201668eb51b385f8b807f5bcaff7e45e23172f6
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_windows_amd64.zip
    sha256: 371b09d40dda260ef92836a6fea68ce7057cad597c9254c0d5bbf24deaa4c6c9
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.2/kx_v0.5.2_windows_arm64.zip
    sha256: fc790908a0dcc8e62ea5fecdb2646c69af91ad4d25dbf2bf3acb069ddf9349f5
    bin: kx/kx.exe
