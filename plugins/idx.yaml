apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.5.1
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_linux_amd64.tar.gz
    sha256: 3a637317cf1a53dbbde90bd3848aadda092f743fd74210408bca2d2d18700304
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_linux_arm64.tar.gz
    sha256: dd303c71f30f0a65412977c4f7fb14fd5edd47e01a13ec8a199d3da7c00e8ed4
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_darwin_amd64.tar.gz
    sha256: 2ddd5b83d2eb9e6a50ea6ca9c45286074b5ef8f4e6afe13260e988af875cb926
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_darwin_arm64.tar.gz
    sha256: 6231732645abdd11cc63ea92d98d7e4c3998583a1f9a4b26f80968ab88f89d6e
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_windows_amd64.zip
    sha256: 59bac982c6b68f162c2ab27ceea50d3f171b9c56baa51dcc08f476981ed1ed27
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.5.1/kx_v0.5.1_windows_arm64.zip
    sha256: 6cc5f5577b04f09f864fc3bc8a456e1d580676fa85866581082e08c70f25506c
    bin: kx/kx.exe
