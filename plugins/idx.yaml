apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.3.1
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_linux_amd64.tar.gz
    sha256: 56658ebe05a3cc8cae164d10685272febc291b5b1bc1f6b59eaf6beaebd4120f
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_linux_arm64.tar.gz
    sha256: 774786ca7bf9cd3e3980f084236222051ff1ed0e7304e75752dac97f00ea2cfe
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_darwin_amd64.tar.gz
    sha256: f38c32a68e22e7c713d36667c28f6a3450ed62ebab752d7109bd7bfd16ae0937
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_darwin_arm64.tar.gz
    sha256: 58ff0acf9f98ab8e3a8abe3b241213da9ee8ab799f06998fda1831d1e7d84131
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_windows_amd64.zip
    sha256: dff95b81601bc699b6a5473bec3926919431ed263e3997696a49a387b5f8d723
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.1/kx_v0.3.1_windows_arm64.zip
    sha256: 5318172fd118f0a829d61f26c7c26558be30dfd46ff4d0562e9aed69384bb8ab
    bin: kx/kx.exe
