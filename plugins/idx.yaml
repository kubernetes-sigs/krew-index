apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.12.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_linux_amd64.tar.gz
    sha256: 33fcde45ca20a59ba7a89bd00f3a270595afbc03b96c9201f67ea502fc0b5970
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_linux_arm64.tar.gz
    sha256: 8ba73366ddf8af50e98367c15e04ae0c1ae3e5b2193e19c6cff769a9aa0157ce
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_darwin_amd64.tar.gz
    sha256: 43c036003dc00c75f4378e8b4d98aae1d5fa040cb520a8350b23f73ca24a1faf
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_darwin_arm64.tar.gz
    sha256: a8c01fc3898d19b7aee214d01bc034f4c543d90e7aaab6f8dc42bf466466e5e6
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_windows_amd64.zip
    sha256: 5539d6ed401f08eb0b1c8ea51a4c02f807f92eb396553dee9e29473e6d4afa3f
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.12.0/kx_v0.12.0_windows_arm64.zip
    sha256: 5b1482fc5debea948eac4a0ba2bc3c85d369ddd18c1cd5cce2bf31875f3df2c2
    bin: kx/kx.exe
