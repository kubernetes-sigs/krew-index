apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.2.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_linux_amd64.tar.gz
    sha256: 98e1dd0a3a1ed40ab478943bac2c936c42fdee36770a2389e42f45a8e5d670e3
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_linux_arm64.tar.gz
    sha256: 3ac6c305000d62dd1a35ad53e1a6d5dbdf300f01cc1c235a50ac2a3ca185cd46
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_darwin_amd64.tar.gz
    sha256: b3362c116e95a5484ff85b83d300d447ade3d2b8b01b3c10450a52381e04aa59
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_darwin_arm64.tar.gz
    sha256: 2fc08d5e12a73d555e107e9e21b443226f6ea27710e68b95cf72894938aad889
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_windows_amd64.zip
    sha256: 582b533aa0c064b98d5611be3139a4c269c5cc1ca530a7288e49e143c567e873
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.2.0/kx_v0.2.0_windows_arm64.zip
    sha256: 3518894b6ada803ea850e3320c015e8b93835dc7070170474273c9bc5d8a39c7
    bin: kx/kx.exe
