apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.3.2
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_linux_amd64.tar.gz
    sha256: 1350e8049722f7a840ddcf91d539a1a5063c9cd0f4f1a6f23dc35dc7c7f064ac
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_linux_arm64.tar.gz
    sha256: d8beeff473e6768e1ab5a8a9daf9d8197b6b724b7a2fb30d4fca6e618ef5afbd
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_darwin_amd64.tar.gz
    sha256: 71a1cb1eafc6b3f486b3718aae96465b515bb5bf638b334c2e203c2716280398
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_darwin_arm64.tar.gz
    sha256: e59d0bae329cea06bcee04289fca269df608a9def917dffe6e7b4c8a956cb3f8
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_windows_amd64.zip
    sha256: 26a90c1e9d5a8aca1c8815fdbd9a1ebad09b9d53ff546d84f39f3605a7783321
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.2/kx_v0.3.2_windows_arm64.zip
    sha256: bb9a4953f047cb33de2f7d32e681c16eb35ce5b5277a50b4ae427df4962aae18
    bin: kx/kx.exe
