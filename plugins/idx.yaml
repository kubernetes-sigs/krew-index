apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.3.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_linux_amd64.tar.gz
    sha256: 7b02e8c2d11a0d1773446eb5f583ad54c81c02d7dbb08a0d3984e7dc85db00b8
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_linux_arm64.tar.gz
    sha256: 8312d3eeb6c02bd594128eaabd46a45cb88626582328fd7fe6f491f395177382
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_darwin_amd64.tar.gz
    sha256: 54fd8c12fe41bd66b5a65287e158dadbf41dfec6d9b5c8938e1bb3948e2d259f
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_darwin_arm64.tar.gz
    sha256: a05ec6e7c986559a13d09cc38252663db9499d10f32e22e297d45328e2442e14
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_windows_amd64.zip
    sha256: 0900f88954fee02eb3266aaaf8165d53d677bc5a4f782e948e0271f65f7b176e
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.0/kx_v0.3.0_windows_arm64.zip
    sha256: 194e26804dc693929bb530954f30b27538741814d6245db9cde428d72157b242
    bin: kx/kx.exe
