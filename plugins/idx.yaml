apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.14.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_linux_amd64.tar.gz
    sha256: 1ed305bca1d9b69e1dd2540de757ecd5d7c26f392aa8d9ecb7fb50a35c1c3086
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_linux_arm64.tar.gz
    sha256: 09d5a5a85d22ae1625f8b118bc4a7195cfb6482ef5f3173c7d8742c6a13e8b7a
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_darwin_amd64.tar.gz
    sha256: e8aac8a2140f3b8328d657c18787e5926a9fa9583bf22ed14fdd1e1ea4da7023
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_darwin_arm64.tar.gz
    sha256: bea8b0e2c032eb0838ac861349780174e2ed021ca2d835a9d787335a2c1b157c
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_windows_amd64.zip
    sha256: ee3fb856e352cbd58fcb3fbbc9dcebd415d7952509e7385d1a4c8379f2b2814e
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.14.0/kx_v0.14.0_windows_arm64.zip
    sha256: cbf66f910ff822727c4f4311cc0deed405f86a2dc32b15b9cde12f838e8db928
    bin: kx/kx.exe
