apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.6.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_linux_amd64.tar.gz
    sha256: 4c3d36b8dd5d82c9fc839d632310a6087932105e8a211bfe411e84d395a4791c
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_linux_arm64.tar.gz
    sha256: 8a95b7f34ebb4c4c561f0fd439c8f59c6fb0d8a7c34e7512656301ba5a39fce5
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_darwin_amd64.tar.gz
    sha256: b7700f212a2b06178b4eecc30033d4950f804f5b251a299afed0be8f4414bcfa
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_darwin_arm64.tar.gz
    sha256: dbcf853566a1ac85987ca140b50fd7b0befb4711c20b7c24285d6c29849c3aa5
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_windows_amd64.zip
    sha256: 32a8aaba4eb326952ef72b9083179b5523569549e8cdca5d5f72c15e0b1eaeb4
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.6.0/kx_v0.6.0_windows_arm64.zip
    sha256: 12e2c9d58b6ab1f8fd734cb2e3243afd010a9d15a6210d953cdc39f8d92cc5c0
    bin: kx/kx.exe
