apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.11.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_linux_amd64.tar.gz
    sha256: b29ff9533477efb2ea11e252d63c16a4172b2a30eb4a00c60ebee79c069c50bd
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_linux_arm64.tar.gz
    sha256: 32025621367f52b653f29def496a396dd6a168e983a4a1978066374072967852
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_darwin_amd64.tar.gz
    sha256: 80da6f2b78dd7505e4a8602bf93a90ecd320f2853893340fa2feb66e3e333e52
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_darwin_arm64.tar.gz
    sha256: defb69c837eac6d978829eabfeeb6860ccb7ec9eeecc97eceedf82311e6afaef
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_windows_amd64.zip
    sha256: c3c6c02ab3e873bd1aa37417f13f4254b27b8f35ef7fe284f8fbe620a8a66074
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.11.0/kx_v0.11.0_windows_arm64.zip
    sha256: 25f95d21640fcd5b7c0e5ca43d6efc614f7af33227fe09d0930aecbedad9ab37
    bin: kx/kx.exe
