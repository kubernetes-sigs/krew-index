apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.3.3
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_linux_amd64.tar.gz
    sha256: 7b8d7041007f42b13215fda24505b4b6fe4b5bb35aa669b246fe94926873828e
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_linux_arm64.tar.gz
    sha256: 94492761c9b22996b58d7ab5f5b08c24c1f0d5465ac91389a0752b19bbe435a9
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_darwin_amd64.tar.gz
    sha256: 3ec540bf2632c81e5d0d9428a901d638412226062eeebd472c1089212fa6c56b
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_darwin_arm64.tar.gz
    sha256: c56ef185ede8492a00293101f2ba54f72f1e8e12b0d1aadd24c12b0565220d24
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_windows_amd64.zip
    sha256: 537a6e563f27ab41738c82cfceb12d425aa20030d65de231d0473f77dbd7d97b
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.3.3/kx_v0.3.3_windows_arm64.zip
    sha256: 18c19428331bf924ddd2c445796c5c4122938a4852a75a61844ea24e9fcca034
    bin: kx/kx.exe
