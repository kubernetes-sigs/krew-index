apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.7.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_linux_amd64.tar.gz
    sha256: e4e9f59e783930a09c3e5b6a41436223f68c5a11bf2f31b14e055024e0b9be4b
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_linux_arm64.tar.gz
    sha256: 37d63a79a517485a3bda3d9abf2ed70499ac20a10a4177df9f8ece52d20218c5
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_darwin_amd64.tar.gz
    sha256: 7762c9a7fbb50203fc8e2baa5af827b49ad451324d71ce88db657d8ee30fb441
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_darwin_arm64.tar.gz
    sha256: 02bedec0ef44e0c71c6d9afb687300928d513aeea34bea1e0de68644ea9befde
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_windows_amd64.zip
    sha256: 2f1a4c5f9be4cf9128c861a8e0f13e23bd682c1d3415894c9afd8e49f9c718db
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.7.0/kx_v0.7.0_windows_arm64.zip
    sha256: 7796cf5be2c78fe98d3ecd93c0ccadb0631d96b9fd5535e0dbc76f292453fed3
    bin: kx/kx.exe
