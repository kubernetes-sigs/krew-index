apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.9.0
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_linux_amd64.tar.gz
    sha256: f55739099511359842d21c8cd2d9b398fad04436cd8745ded0bec3894c9467e4
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_linux_arm64.tar.gz
    sha256: 1e60a4628c280fe825b0d5a06daa3bdc933d82c409a20e8fbc103e49ce679520
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_darwin_amd64.tar.gz
    sha256: d57da6620d90722e6b7803d389d1dfbb37261118fc9e73dfc21074df7fd23f6f
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_darwin_arm64.tar.gz
    sha256: 2215a093880211ba26dcdf01ca80cdf71ef1ee451f6ad703b2102bbd5fa002a0
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_windows_amd64.zip
    sha256: 9beeb755aef464a5fb4d581599c47ccc6895f0baec450c2bc004214d4d197c99
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.9.0/kx_v0.9.0_windows_arm64.zip
    sha256: 8e49c240afc7631ef92f93e1211e542bb0eb1be881ea045601171460db3575c5
    bin: kx/kx.exe
