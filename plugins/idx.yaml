apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: idx
spec:
  version: v0.10.1
  homepage: https://github.com/jzills/kx
  shortDescription: Select resources by index instead of typing names
  description: |
    idx wraps kubectl with index-based resource selection. List resources
    once with "kubectl idx get pods" to assign numbered indexes, then
    reference any resource by number in follow-up commands: describe,
    logs, exec, delete, edit, scale, rollout, port-forward, events,
    yaml, tree, and more. A navigable history of listings keeps indexes
    resolving as you move between resource kinds and namespaces.
    Also distributed as "kx" on PyPI (https://pypi.org/project/kx-cli/).
  caveats: |
    Index history is stored in ~/.kx/ (%USERPROFILE%\.kx on Windows).
  platforms:
  - selector: {matchLabels: {os: linux, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_linux_amd64.tar.gz
    sha256: 15d024361a9eb74fbd64ccdb98e269325649febe500def4604d228b3ff75552a
    bin: kx/kx
  - selector: {matchLabels: {os: linux, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_linux_arm64.tar.gz
    sha256: 36950733199ac9c26f48ab1e065e74fdf08cbf4b0232202a771421d3cf05782b
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_darwin_amd64.tar.gz
    sha256: 3a0a5d2764400a8644a7719b1c61b5f66da429d76fd65717279475215b559f34
    bin: kx/kx
  - selector: {matchLabels: {os: darwin, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_darwin_arm64.tar.gz
    sha256: c3e9a13f406610b1236687a7d0373e0918b1908b8e2941fced4967c4421cc7ee
    bin: kx/kx
  # Windows ships as .zip, which krew extracts alongside .tar.gz, and krew
  # only runs .exe entrypoints there — so the archive holds kx/kx.exe.
  - selector: {matchLabels: {os: windows, arch: amd64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_windows_amd64.zip
    sha256: d57532ab226eda711bb53beacce91118dafdcbba70cbc26549690ec87ce00703
    bin: kx/kx.exe
  - selector: {matchLabels: {os: windows, arch: arm64}}
    uri: https://github.com/jzills/kx/releases/download/v0.10.1/kx_v0.10.1_windows_arm64.zip
    sha256: 856f7ef57f5869551480d9ba5dbc4ea2ac3a00cffbe03f0254f71700f80a3aca
    bin: kx/kx.exe
