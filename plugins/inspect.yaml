apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: inspect
spec:
  version: v1.2.0
  homepage: https://github.com/irenedo/kubectl-inspect
  shortDescription: Browse Kubernetes resources interactively with a TUI tree browser
  description: |
    An interactive terminal UI for browsing Kubernetes resource and CRD field
    structures. Instead of typing kubectl explain repeatedly, use the collapsible
    tree view to explore fields and see full explain output in real-time.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/irenedo/kubectl-inspect/releases/download/v1.2.0/kubectl-inspect_v1.2.0_darwin_amd64.tar.gz
    sha256: 2d309cf7d083cb0018907f15bdff1bef462dea154ec9ff9a0303b62c2566e54f
    bin: kubectl-inspect
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/irenedo/kubectl-inspect/releases/download/v1.2.0/kubectl-inspect_v1.2.0_darwin_arm64.tar.gz
    sha256: e4e10074469678d2b75061b70b88f325e5d226a86dd4cc8157772fc0b4805a8c
    bin: kubectl-inspect
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/irenedo/kubectl-inspect/releases/download/v1.2.0/kubectl-inspect_v1.2.0_linux_amd64.tar.gz
    sha256: b2a5e6606a90246fb66b12d311b7b4f734c727c66e808a35ca698c824ef9bb14
    bin: kubectl-inspect
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/irenedo/kubectl-inspect/releases/download/v1.2.0/kubectl-inspect_v1.2.0_linux_arm64.tar.gz
    sha256: 4ffeffa72f62ebf8795550b13b8b686c75b4bfe9d54d6d358cf1ba358e440279
    bin: kubectl-inspect
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/irenedo/kubectl-inspect/releases/download/v1.2.0/kubectl-inspect_v1.2.0_windows_amd64.tar.gz
    sha256: c5a05b0da0451a887641fa8f7c9948c1ace9407f0d7edeef1489f39389aadb4e
    bin: kubectl-inspect.exe
