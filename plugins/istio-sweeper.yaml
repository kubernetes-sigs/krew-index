apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: istio-sweeper
spec:
  version: v0.1.1
  homepage: https://github.com/jonas-budde/istio-sidecar-sweeper
  shortDescription: Find and restart pods with outdated Istio sidecars
  description: |
    Finds pods whose Istio sidecar is out of date, for example after a canary
    revision upgrade or a patch update of Istio, and restarts their
    Deployments, StatefulSets and DaemonSets one at a time. Restarts are a
    dry run unless --apply is given. Use --provider azure (default) for the
    AKS Istio add-on or --provider generic for upstream Istio.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.1/kubectl-istio_sweeper_darwin_amd64.tar.gz
    sha256: 672864564ce050a40dd5ef2ee475f196056ae927786bfc0ed2821e41f9cf9098
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.1/kubectl-istio_sweeper_darwin_arm64.tar.gz
    sha256: 94c3d3169d4250803ada037e510b41b0f875c5cb2391c5685b9efb1f5586ec49
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.1/kubectl-istio_sweeper_linux_amd64.tar.gz
    sha256: 3daf706983d2c89ed0f0be53cc3b3b31f7a8b6b9664d719faec2dc53eeb1f306
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.1/kubectl-istio_sweeper_linux_arm64.tar.gz
    sha256: 9618075b16dd8e20d39816f64d32b6af3220e1f268cafc8bc60cf76a6519d212
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.1/kubectl-istio_sweeper_windows_amd64.tar.gz
    sha256: 7d6d28c61dcb2a0fba4f5278b58522b6214d5dc9abbf9883d0e4fe3d4e9ae3f7
    bin: kubectl-istio_sweeper.exe
