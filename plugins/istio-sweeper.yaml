apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: istio-sweeper
spec:
  version: v0.1.2
  homepage: https://github.com/jonas-budde/istio-sidecar-sweeper
  shortDescription: Find and restart pods with outdated Istio sidecars
  description: |
    Finds pods whose Istio sidecar is out of date, for example after a canary
    revision upgrade or a patch update of Istio, and restarts their
    Deployments, StatefulSets and DaemonSets one at a time. Restarts are a
    dry run unless --apply is given. Use --provider azure (default) for the
    AKS Istio add-on or --provider generic for upstream Istio.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.2/kubectl-istio_sweeper_darwin_amd64.tar.gz
    sha256: fc12f810a96f769351c1d05773334906506f2b5d7a7608895a4b3dd988663c5a
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.2/kubectl-istio_sweeper_darwin_arm64.tar.gz
    sha256: 7bcbdb95e4faa56658783d12249ccbb180f9440ea1dcf06dc896518c1ac7c420
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.2/kubectl-istio_sweeper_linux_amd64.tar.gz
    sha256: 7fc2e76f19e4ceeec8d6ad5266811a425bd1b09f9984e43b2d2ea4cdb2e185f6
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.2/kubectl-istio_sweeper_linux_arm64.tar.gz
    sha256: db4374057e9b9fa2ea81a11ccb003ddda245f7755a4af45327b5372636185c1b
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.2/kubectl-istio_sweeper_windows_amd64.tar.gz
    sha256: a256c984b83b592af9d129118bfe36faef9eb70356d8e51a1b748809850fec8d
    bin: kubectl-istio_sweeper.exe
