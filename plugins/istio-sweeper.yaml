apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: istio-sweeper
spec:
  version: v0.1.3
  homepage: https://github.com/jonas-budde/istio-sidecar-sweeper
  shortDescription: Find and restart pods with outdated Istio sidecars
  description: |
    Finds pods whose Istio sidecar is out of date, for example after a canary
    revision upgrade or a patch update of Istio, and restarts their
    Deployments, StatefulSets and DaemonSets one at a time. Restarts are a
    dry run unless --apply is given. Use --provider azure (default) for the
    AKS Istio add-on or --provider generic for upstream Istio.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.3/kubectl-istio_sweeper_darwin_amd64.tar.gz
    sha256: bf34001d02159ecd24c45b710cadcd6d58403076bf16dd08276580968e9c7d0e
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.3/kubectl-istio_sweeper_darwin_arm64.tar.gz
    sha256: f7cc10a4f582065a0262007cf6e27104c80f0fbf1a94e9573e9cfda648ee01ae
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.3/kubectl-istio_sweeper_linux_amd64.tar.gz
    sha256: 45ed5c4bb7daf614e9e46ecc50b6f6558d69063d6a23ea6fb9e9f8513e97db9a
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.3/kubectl-istio_sweeper_linux_arm64.tar.gz
    sha256: cfae74edd385d2b2b18fe8c974bacb98a2cec3f60ac6d9a83d6a05efe01d9ede
    bin: kubectl-istio_sweeper
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/jonas-budde/istio-sidecar-sweeper/releases/download/v0.1.3/kubectl-istio_sweeper_windows_amd64.tar.gz
    sha256: 45c4f7214dd1a5c9e5c3bf0c6206d2277e57924a69cac31c2f7795248e8294e3
    bin: kubectl-istio_sweeper.exe
