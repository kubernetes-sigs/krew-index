# The Krew manifest of the plugin, as the template krew-release-bot renders:
# on every stable release the release workflow's krew-index job fills in the
# tag and each archive's sha256 and opens the version bump in
# kubernetes-sigs/krew-index, which merges a bump of version, uri and sha256
# alone without review. The archives are those scripts/kubectl-plugin-archive.sh
# packs for the release workflow's publish-kubectl-plugin matrix;
# tests/contracts/krew_test.go keeps the three in step.
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: joulie
spec:
  version: v0.3.0
  homepage: https://joulie-k8s.github.io/Joulie/
  shortDescription: Energy dashboard of a Joulie-managed cluster
  description: |
    Shows the energy state of a cluster that Joulie manages: the measured and
    capped power of each node, its power profile (performance or eco), the
    CPU and GPU caps its agent applied, the digital twin's power headroom and
    cooling stress, and which nodes run performance and standard pods. As
    tables, as JSON, or as a live terminal dashboard.
  caveats: |
    Needs Joulie installed in the cluster: https://joulie-k8s.github.io/Joulie/
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/joulie-k8s/Joulie/releases/download/v0.3.0/kubectl-joulie_v0.3.0_linux_amd64.tar.gz
    sha256: c732dc03c7c1f5dd0d885ff2314c632de1a0f8f7d7026a6c909a7213b53a17d8
    bin: kubectl-joulie
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/joulie-k8s/Joulie/releases/download/v0.3.0/kubectl-joulie_v0.3.0_linux_arm64.tar.gz
    sha256: 40ae7d5a2577fba3d0a1527edc0c2ffa79ecd11f1e9c7e712dbf69ea55b5bc45
    bin: kubectl-joulie
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/joulie-k8s/Joulie/releases/download/v0.3.0/kubectl-joulie_v0.3.0_darwin_amd64.tar.gz
    sha256: 35786f9f8c0571f8e0cc7e757194b5998d99edf73b6c2db327963978c74de9cb
    bin: kubectl-joulie
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/joulie-k8s/Joulie/releases/download/v0.3.0/kubectl-joulie_v0.3.0_darwin_arm64.tar.gz
    sha256: 458c9aca46e2db0c66f083192f76f07313df8bdbcab9a0f70be0adeda174c469
    bin: kubectl-joulie
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/joulie-k8s/Joulie/releases/download/v0.3.0/kubectl-joulie_v0.3.0_windows_amd64.tar.gz
    sha256: c261edd4806881bd6dae33ea79cc03112b338e02111797ba2a2658fcd8ccc72f
    bin: kubectl-joulie.exe
