      uri: https://github.com/ViktorUJ/kubectl-k8i/releases/download/v0.1.5/kubectl-k8i_windows_amd64.zip
      sha256: "6b5b9b84e3dbb83d850929d5407e5718756b0ef8cc648fb8be02814cd220d89f"
