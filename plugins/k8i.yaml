      uri: https://github.com/ViktorUJ/kubectl-k8i/releases/download/v0.1.6/kubectl-k8i_darwin_arm64.tar.gz
      sha256: "afcb922aaec151fd6148c03266ab1e17dd6a1f4f8813582631bf9d8321bf3b33"
