          arch: arm64
      uri: https://github.com/ViktorUJ/kubectl-k8i/releases/download/v0.1.5/kubectl-k8i_darwin_arm64.tar.gz
      sha256: "b9815ef9d07fb77a4ca3086f96b81ce79c1a270f6348aad064628ea6111d4c35"
      bin: kubectl-k8i
    - selector:
