apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: karmada
spec:
  description: |
    Karmada (Kubernetes Armada) is a Kubernetes management system that enables
    you to run your cloud-native applications across multiple Kubernetes
    clusters and clouds, with no changes to your applications. By speaking
    Kubernetes-native APIs and providing advanced scheduling capabilities,
    Karmada enables truly open, multi-cloud Kubernetes.
    This cli tools controls a federation of Karmada clusters.
  homepage: https://github.com/karmada-io/karmada
  platforms:
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.0/kubectl-karmada-linux-arm64.tgz
    sha256: f372de6f3b161692f26ee8d946e9882fd54cdef768831fb3625f75ea324d164d
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.0/kubectl-karmada-darwin-arm64.tgz
    sha256: e8c1e750a95d71ce56d63a45d4ce981591c57948309711579d8e6bb621a0cc64
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.0/kubectl-karmada-linux-amd64.tgz
    sha256: 5a8648a503c57567b42cfde14b67b6558361339f04034c3237f70024d3ba657e
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.0/kubectl-karmada-darwin-amd64.tgz
    sha256: c40029dd51bba092d69efd6fd756e11fa206596b502c276b1a6e1bdb33987f80
  shortDescription: Manage clusters with Karmada federation.
  version: v1.19.0
