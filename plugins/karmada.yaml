apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: karmada
spec:
  description: |
    Karmada (Kubernetes Armada) is a Kubernetes management system that enables
    you to run your cloud-native applications across multiple Kubernetes
    clusters and clouds, with no changes to your applications. By speaking
    Kubernetes-native APIs and providing advanced scheduling capabilities,
    Karmada enables truly open, multi-cloud Kubernetes.
    This cli tools controls a federation of Karmada clusters.
  homepage: https://github.com/karmada-io/karmada
  platforms:
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.1/kubectl-karmada-linux-arm64.tgz
    sha256: 2e9f974efcff11c308f3338497de0b03f30e4db6d7c755abcc02cd93730267ab
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.1/kubectl-karmada-darwin-arm64.tgz
    sha256: 90c6c54f382d2081a43a1d16a5aef03c1cc092ff9f33f416aa9919b9a15dfadb
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.1/kubectl-karmada-linux-amd64.tgz
    sha256: b26c5f2a95a99766f7062e63db048bac42a052a6dc3b27790a28cd62d5a8066a
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.19.1/kubectl-karmada-darwin-amd64.tgz
    sha256: cf5915a8f11af097ee0a72c4af2a4ffcaef50c45b0ce4f4a5ef7099a6aa24135
  shortDescription: Manage clusters with Karmada federation.
  version: v1.19.1
