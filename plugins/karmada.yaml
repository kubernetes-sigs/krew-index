apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: karmada
spec:
  description: |
    Karmada (Kubernetes Armada) is a Kubernetes management system that enables
    you to run your cloud-native applications across multiple Kubernetes
    clusters and clouds, with no changes to your applications. By speaking
    Kubernetes-native APIs and providing advanced scheduling capabilities,
    Karmada enables truly open, multi-cloud Kubernetes.
    This cli tools controls a federation of Karmada clusters.
  homepage: https://github.com/karmada-io/karmada
  platforms:
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.2/kubectl-karmada-linux-arm64.tgz
    sha256: 9f9bb7b9dcb6364e45d467f53d093e90b46ef4e9e30c1ca8c801f2d822dc0742
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.2/kubectl-karmada-darwin-arm64.tgz
    sha256: 823c89cb1e2b17aeaab58cb0bb8c29a5e51f67a803e93d67d1a65f7c5b148b06
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.2/kubectl-karmada-linux-amd64.tgz
    sha256: 78163e4ecde302fd973e8138a90842180dec06c83b6b9ada19ebab117cf15024
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.2/kubectl-karmada-darwin-amd64.tgz
    sha256: 53bf7307d0a7f3ca13f73fbce3014acdc37a82e2869d856e530e3815c9b10580
  shortDescription: Manage clusters with Karmada federation.
  version: v1.18.2
