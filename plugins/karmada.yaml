apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: karmada
spec:
  description: |
    Karmada (Kubernetes Armada) is a Kubernetes management system that enables
    you to run your cloud-native applications across multiple Kubernetes
    clusters and clouds, with no changes to your applications. By speaking
    Kubernetes-native APIs and providing advanced scheduling capabilities,
    Karmada enables truly open, multi-cloud Kubernetes.
    This cli tools controls a federation of Karmada clusters.
  homepage: https://github.com/karmada-io/karmada
  platforms:
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.3/kubectl-karmada-linux-arm64.tgz
    sha256: ff7a02677d89ae9be1c17777dfdfc0692e6c0b662c246037398d32694d1190fa
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: arm64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.3/kubectl-karmada-darwin-arm64.tgz
    sha256: 2348dd982e0ad232766961e16c1c11837caf2d4f1457c271405271814b2cc1af
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: linux
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.3/kubectl-karmada-linux-amd64.tgz
    sha256: 594efe5f9fa015ae6dbc8ffb0bed1dbe1413fdd73141abdb4eb1c3b620330942
  - bin: kubectl-karmada
    files:
    - from: kubectl-karmada
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        arch: amd64
        os: darwin
    uri: https://github.com/karmada-io/karmada/releases/download/v1.18.3/kubectl-karmada-darwin-amd64.tgz
    sha256: 2955f9f3b85bd5c1be5a7eb517ab655cf2b00e0545fc5e912adc2a10a921c5eb
  shortDescription: Manage clusters with Karmada federation.
  version: v1.18.3
