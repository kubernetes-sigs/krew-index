apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.4.0"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics (TCP, UDP, ICMP, DNS,
    HTTP, and MTR per-hop traces) between any two nodes — without opening
    Grafana. It requires kconmon-ng to be installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon mtr node-1 node-2

    Docs: https://esdmitrii.github.io/kconmon-ng/
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.4.0/kconmon_2.4.0_linux_amd64.tar.gz
      sha256: "e6778dd78b2734affec34499bfc655835ec80634e14f0f268932fe344b86b238"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.4.0/kconmon_2.4.0_linux_arm64.tar.gz
      sha256: "bbf139c9d44a12bc3b30fdafa73fca2d3333ba294e0c91cf220fc8a914f2dd89"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.4.0/kconmon_2.4.0_darwin_amd64.tar.gz"
      sha256: "af4a091fc6be69551da8d1f8c851c136eeb6f201ad731409be2cb6e8707a8baf"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.4.0/kconmon_2.4.0_darwin_arm64.tar.gz"
      sha256: "a405c430842941c0dec063c7d91f77a5811d1e42995c318a0c629e2da7110a04"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
