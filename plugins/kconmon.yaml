apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.3.0"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics (TCP, UDP, ICMP, DNS,
    HTTP, and MTR per-hop traces) between any two nodes — without opening
    Grafana. It requires kconmon-ng to be installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon mtr node-1 node-2
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.3.0/kconmon_2.3.0_linux_amd64.tar.gz
      sha256: "1c22c6ecc73c2c5b17f62a411660c29e1d23357d222fed9953e8cc567d44ac3d"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.3.0/kconmon_2.3.0_linux_arm64.tar.gz
      sha256: "9411306dcbcd3baca2c66cd561af224166cb34fc31d1ec6e22908c7af31389d4"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.3.0/kconmon_2.3.0_darwin_amd64.tar.gz"
      sha256: "ff5b1359fd7b888bb52317868021f272cad8747f57f95493f87fb259ece91857"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.3.0/kconmon_2.3.0_darwin_arm64.tar.gz"
      sha256: "e6c05d2f747f4a8a6ee60158525d0ab6322e0bda1363599cd677260af136a25d"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
