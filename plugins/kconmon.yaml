apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.3.1"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics (TCP, UDP, ICMP, DNS,
    HTTP, and MTR per-hop traces) between any two nodes — without opening
    Grafana. It requires kconmon-ng to be installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon mtr node-1 node-2
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.3.1/kconmon_2.3.1_linux_amd64.tar.gz
      sha256: "4aa573103bd13539ed6e1eca434701257ab7d18487791e5964ca94422366ca0e"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.3.1/kconmon_2.3.1_linux_arm64.tar.gz
      sha256: "9e21466415f12decde86529b3f39aa091e774592227aad3a7ef7762f28875d53"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.3.1/kconmon_2.3.1_darwin_amd64.tar.gz"
      sha256: "9c143446f4bb5fe773203d14ce68bffdcbdd395247b96bcd5ae9a4217905525b"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.3.1/kconmon_2.3.1_darwin_arm64.tar.gz"
      sha256: "51c2128d2100e90a00265abd70371ffbb3d9c96483e2105ff6ad6f4763ee6b06"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
