apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.0.2"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics (TCP, UDP, ICMP, DNS,
    HTTP, and MTR per-hop traces) between any two nodes — without opening
    Grafana. It requires kconmon-ng to be installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon mtr node-1 node-2
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.0.2/kconmon_2.0.2_linux_amd64.tar.gz
      sha256: "e54381aa56d0c0d642f07af1ad433b8a50e966d8735b8de27dbf889ecd085cfc"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.0.2/kconmon_2.0.2_linux_arm64.tar.gz
      sha256: "e26a785f73b3f8a662c2a244b54d975174692aa473a6ee5230b934591533922a"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.0.2/kconmon_2.0.2_darwin_amd64.tar.gz"
      sha256: "69fdf76c78a933d9f05889af1b56dabc17b7eda27475e90bef97dd366a2de29e"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.0.2/kconmon_2.0.2_darwin_arm64.tar.gz"
      sha256: "d6d49dd16d5a588bfdd46795d111d6c6fa081a6f85d794d48183552c776357bb"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
