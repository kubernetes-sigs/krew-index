apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.5.1"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics between any two nodes
    without opening Grafana: TCP, UDP, ICMP, DNS, HTTP, a path MTU probe
    (--type pmtu) and MTR per-hop traces. It requires kconmon-ng to be
    installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon check node-1 node-2 --type pmtu
      kubectl kconmon mtr node-1 node-2

    Docs: https://esdmitrii.github.io/kconmon-ng/
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.5.1/kconmon_2.5.1_linux_amd64.tar.gz
      sha256: "2f4201d4071ef27f6db3533a6ea46b76b20f475bf69f84aef6515f1eabce8011"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.5.1/kconmon_2.5.1_linux_arm64.tar.gz
      sha256: "dfc156ade0acc5ab0b5532a101404a25c18f4775e93637bdb1d3898192c32fd4"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.5.1/kconmon_2.5.1_darwin_amd64.tar.gz"
      sha256: "1238f0f8cc07805c7b29c88227d7f30cff29fa7ded7d7392707b634746fb9da9"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.5.1/kconmon_2.5.1_darwin_arm64.tar.gz"
      sha256: "4525ff0e9e14498fe27758c4d96df855cef041af675a1d9852e9863eff871847"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
