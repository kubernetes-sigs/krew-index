apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kconmon
spec:
  version: "v2.0.3"
  homepage: https://github.com/EsDmitrii/kconmon-ng
  shortDescription: On-demand node-to-node connectivity checks for kconmon-ng
  description: |
    kubectl-kconmon talks to a running kconmon-ng controller's HTTP API through
    a client-go port-forward, so operators can inspect the cluster's node/zone
    topology and run one-shot connectivity diagnostics (TCP, UDP, ICMP, DNS,
    HTTP, and MTR per-hop traces) between any two nodes — without opening
    Grafana. It requires kconmon-ng to be installed in the cluster.

    Examples:
      kubectl kconmon topology
      kubectl kconmon check node-1 node-2 --type icmp
      kubectl kconmon mtr node-1 node-2
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.0.3/kconmon_2.0.3_linux_amd64.tar.gz
      sha256: "11597eb84196924b6342d046a836082ac84c1dde668297af4e68b54b3056be47"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/EsDmitrii/kconmon-ng/releases/download/v2.0.3/kconmon_2.0.3_linux_arm64.tar.gz
      sha256: "33938890a45ac5d048d01ca7fe0ed7ee0189baac39889cb8b44c278d897f22b2"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.0.3/kconmon_2.0.3_darwin_amd64.tar.gz"
      sha256: "a6cd9ee555eeb101172dd22d75694c90b7d4e0aa52f42e34311a4a4ee433c212"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: "https://github.com/EsDmitrii/kconmon-ng/releases/download/\
        v2.0.3/kconmon_2.0.3_darwin_arm64.tar.gz"
      sha256: "89b550748c5adfafa4f041d547013465b64d6d5d5e6660893c53d437453ff997"
      files:
        - from: kubectl-kconmon
          to: .
        - from: LICENSE
          to: .
      bin: kubectl-kconmon
