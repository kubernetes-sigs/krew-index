apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kenv
spec:
  version: v0.5.1
  homepage: https://github.com/dexiotropic/kubenv
  shortDescription: Render manifest variables
  description: |
    Render Kubernetes manifest variables before applying resources with
    kubectl. The plugin uses explicit env placeholders by default and can
    also render shell-style $NAME and ${NAME} placeholders.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_linux_amd64.tar.gz
    sha256: c16d265ea2d09a77d788ba2071061ace877d0b5e2c9d33aa02e5c43f1918c951
    bin: kubectl-kenv
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_linux_arm64.tar.gz
    sha256: faec92348c83c3d8ea4a8c415a6ec78742fa21d9957739bee90778baddfcb10e
    bin: kubectl-kenv
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_darwin_amd64.tar.gz
    sha256: aa68f104f42d1931338104f315270464a4595e07bcfb06e52781cbed1fd32ed2
    bin: kubectl-kenv
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_darwin_arm64.tar.gz
    sha256: 889bb4b60ed0472f500cb5363d6b93adaf13bd86dfbf1271be5e279b4c4cbad7
    bin: kubectl-kenv
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_windows_amd64.zip
    sha256: 53768b74a7bfb30d4a4d85767fb9b0f72118467abdb111ce0952a48c3bd62e9d
    bin: kubectl-kenv.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/dexiotropic/kubenv/releases/download/v0.5.1/kubenv_kubectl-kenv_0.5.1_windows_arm64.zip
    sha256: 936a83d7046bbaff3014b8602515b5be47485d031bb79056c84581cee80a629a
    bin: kubectl-kenv.exe
