apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.10.18
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.18/kubectl-kopiur_0.10.18_linux_amd64.tar.gz
      sha256: 970c721e78fda5c24add6a993d6d4360e5cb079248dab1072518ac7273bd27eb
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.18/kubectl-kopiur_0.10.18_linux_arm64.tar.gz
      sha256: 7f6b91fc2bd8c93952f8873f5167f4b1696f20b0df0e5bd202e7c6cfe383b08b
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.18/kubectl-kopiur_0.10.18_darwin_amd64.tar.gz
      sha256: c50b84213016b7b5d0a99e62c1d52490fbf9b2be5c0a96296549dfb2b7138c77
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.18/kubectl-kopiur_0.10.18_darwin_arm64.tar.gz
      sha256: 107acf3787b0c7584113c62e26be718567ac2c7624b00181700eaae179b3cd00
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
