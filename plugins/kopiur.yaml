apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.10.17
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.17/kubectl-kopiur_0.10.17_linux_amd64.tar.gz
      sha256: 5325a7835e21669b83171068e48c390001ef729ed6aaffbeced2b005c52e6e51
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.17/kubectl-kopiur_0.10.17_linux_arm64.tar.gz
      sha256: ee4fd84974f2d7cfe8fbfae3fea7585bebb6dd2ceb19fde550f868dac3543ec6
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.17/kubectl-kopiur_0.10.17_darwin_amd64.tar.gz
      sha256: c8cb31e0debffb4c44c4c08453d8fb1b1ecb48309420c404869ab472ad690420
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.17/kubectl-kopiur_0.10.17_darwin_arm64.tar.gz
      sha256: 62cfe48761d3d466b6c70828fcbafdd3cb01b8c4e85ced51fa00e357f91deaa1
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
