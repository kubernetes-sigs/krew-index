apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.10.15
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.15/kubectl-kopiur_0.10.15_linux_amd64.tar.gz
      sha256: b407b6c2ac3a838db60c2d045d57a81cf2e89784fe98fd9dc4a7bfb2c09cbca4
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.15/kubectl-kopiur_0.10.15_linux_arm64.tar.gz
      sha256: de1a2ac984f599c07fb2fa2b89b405b2d4bf000b95daf4609095aefc40e4852e
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.15/kubectl-kopiur_0.10.15_darwin_amd64.tar.gz
      sha256: 2c99cc33bd2974e12abd22114a6513633fe6fd40649696716caf785a674aafe5
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.15/kubectl-kopiur_0.10.15_darwin_arm64.tar.gz
      sha256: a5baf79e6be2dcedea021361cd12515a40a0457480f2775ca4c00aaae6a0367f
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
