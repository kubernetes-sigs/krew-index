apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.10.21
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.21/kubectl-kopiur_0.10.21_linux_amd64.tar.gz
      sha256: f5d50159fab46fc3ff59b5b365b6ce70aad1e657603fe11430b6d8e287d7c138
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.21/kubectl-kopiur_0.10.21_linux_arm64.tar.gz
      sha256: 5de04a972b71ddd8fd66ca4c880e56beedbda81983088f69fba32f77df6e20a3
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.21/kubectl-kopiur_0.10.21_darwin_amd64.tar.gz
      sha256: dd3ae21fd69a3362bcc1b6bbe012f7a35d65dc6da75cb5331e8a71bbcbfdfce0
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.21/kubectl-kopiur_0.10.21_darwin_arm64.tar.gz
      sha256: 2d28222fdaffd3e3443e3877db351b4f521549bbea7bf7f1f39b79ebd48b1b6d
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
