apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.11.0
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.0/kubectl-kopiur_0.11.0_linux_amd64.tar.gz
      sha256: 90cc67dd440458d590151e0bad570ea3cb7528ffbeaa010eb2d580375e6e3dce
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.0/kubectl-kopiur_0.11.0_linux_arm64.tar.gz
      sha256: 4d030ed1f1e0276036b54078eda969e37f487e93f96cc7937974a6301645204f
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.0/kubectl-kopiur_0.11.0_darwin_amd64.tar.gz
      sha256: bce4de64c826574a43da58e66810805dc539e2e02c62c836b1728501c4badcc5
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.0/kubectl-kopiur_0.11.0_darwin_arm64.tar.gz
      sha256: 536571227006d55df532aa5f839abbe917c2cd72a5c7bd07667bc3b25473d4e3
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
