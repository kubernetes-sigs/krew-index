apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.11.1
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.1/kubectl-kopiur_0.11.1_linux_amd64.tar.gz
      sha256: 1cc6063ff1631ee3aa573f72232743b8fcf19df21024916c2d001dc0a33fd0a4
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.1/kubectl-kopiur_0.11.1_linux_arm64.tar.gz
      sha256: 34839f0cd9f0f628377dfcddaae2f9a22317e1da6aeffb7c85510abcfe3c6768
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.1/kubectl-kopiur_0.11.1_darwin_amd64.tar.gz
      sha256: 8162b53bd0fcdd3510162b56a4b2f53686a8622ccd1539bf3dbcd837d6131df1
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.1/kubectl-kopiur_0.11.1_darwin_arm64.tar.gz
      sha256: 0d38e39659825d8347197895da23073ed22ad8474165f8c0907186bd9df59879
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
