apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.11.2
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.2/kubectl-kopiur_0.11.2_linux_amd64.tar.gz
      sha256: 785aa809b51913c84b252b5d82bd8cdec58bd7af3c47c5946f62b24421f1d5b0
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.2/kubectl-kopiur_0.11.2_linux_arm64.tar.gz
      sha256: 77b1c4de61d69806fb31dee1cd0f3022da24294146200947e7b47c3e31d45a39
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.2/kubectl-kopiur_0.11.2_darwin_amd64.tar.gz
      sha256: 300efdf6d809a4c684c20bd95511d53cabb9ad83a0a1e600f3e81d787cbbc062
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.11.2/kubectl-kopiur_0.11.2_darwin_arm64.tar.gz
      sha256: 212b3112fcdecf517ff9a60039c4d2fdf6a3454338241e02a8105203cb29d9d8
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
