apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kopiur
spec:
  version: v0.10.16
  homepage: https://kopiur.home-operations.com/cli/
  shortDescription: Operate the kopiur backup operator
  description: |
    Operates the kopiur Kopia-native Kubernetes backup operator: trigger
    snapshots and restores, suspend and resume resources, inspect snapshots,
    run repository maintenance, browse files inside snapshots through a
    read-only in-cluster session, diagnose installs with `doctor`, and
    translate VolSync restic configs with `migrate volsync`.
  caveats: |
    The plugin tracks the kopiur v1alpha1 CRDs, so keep it on the same
    release as the operator. Browsing needs the chart's opt-in browse
    ClusterRole (rbac.browseRole) or equivalent RBAC.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.16/kubectl-kopiur_0.10.16_linux_amd64.tar.gz
      sha256: 5c587d53585e5e321c861b67d77c72b3cf1650cf73e4c5709d9ba88f8fb60c47
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.16/kubectl-kopiur_0.10.16_linux_arm64.tar.gz
      sha256: a9c4c77eb8242808c4014bc36e248e5f39207ed278f6d61767db8b62ec2f3f3e
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.16/kubectl-kopiur_0.10.16_darwin_amd64.tar.gz
      sha256: b4bd3516c9e943547311a0289850506f1aab47f8736ead55d701d9357e0f396f
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/home-operations/kopiur/releases/download/0.10.16/kubectl-kopiur_0.10.16_darwin_arm64.tar.gz
      sha256: 410fd44d811717de65aee57797aae7ecc7a65531bd5ce980e1f79c200ed2784e
      files:
        - from: kopiur
          to: .
        - from: LICENSE
          to: .
      bin: kopiur
