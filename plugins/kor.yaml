apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kor
spec:
  version: v0.7.1
  homepage: https://github.com/yonahd/kor
  shortDescription: Kor is a tool to discover unused K8s resources.
  description: |
    This plugin shows unused Kubernetes resources (namespaced or cluster-scoped).
    It provides additional capabilities such as exporting Prometheus metrics,
    deleting unused resources, and more!
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.1/kor_Linux_x86_64.tar.gz
    sha256: 226bf7566b87e1c88f7fa872cb9abaf51d8bb78b0720dceb5837d1ccfed582a1
    bin: kor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.1/kor_Linux_arm64.tar.gz
    sha256: 146328dc0f37b4139b0ac767e900d5cd1e5825f78278ddefb29bdd2f3383d61d
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.1/kor_Darwin_x86_64.tar.gz
    sha256: 1b6a65ff78c2c976533d736216dc34fcbc2a1f7d97c85395d2b627088d2c2f5e
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.1/kor_Darwin_arm64.tar.gz
    sha256: 6ac7849459e83d708e472716e4d05233f1a2229020fba3ef30c7bda64277447c
    bin: kor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.1/kor_Windows_x86_64.zip
    sha256: 2c9e6f69004931fb273266f3221e9397fc4357af9a49bc2de31517f332f7d9e5
    bin: kor.exe
