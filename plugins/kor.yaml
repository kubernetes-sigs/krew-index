apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kor
spec:
  version: v0.6.9
  homepage: https://github.com/yonahd/kor
  shortDescription: Kor is a tool to discover unused K8s resources.
  description: |
    This plugin shows unused Kubernetes resources (namespaced or cluster-scoped).
    It provides additional capabilities such as exporting Prometheus metrics,
    deleting unused resources, and more!
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.6.9/kor_Linux_x86_64.tar.gz
    sha256: 6ca2c3f034a1cc16f12a42bb722028288c7a50a83131bd1662248b4c58f6d6a6
    bin: kor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.6.9/kor_Linux_arm64.tar.gz
    sha256: f735868a033b01f259cff230e0fbc205467130d394ce4d72cdb163515ab67521
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.6.9/kor_Darwin_x86_64.tar.gz
    sha256: a2ee75d86d3355feb41161368eadd5d2682cbaeda044a41fa6e0882315e593fe
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.6.9/kor_Darwin_arm64.tar.gz
    sha256: 2e1a0c3cdbaf74fbe1aa03c5b26f5cef26ff97220dbfe5718cb4b15d327916c1
    bin: kor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.6.9/kor_Windows_x86_64.zip
    sha256: cc91a3f06f536d4b188bb09d5ad7f4083485598e5b35e40a0a77955828d554d6
    bin: kor.exe
