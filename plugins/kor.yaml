apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kor
spec:
  version: v0.7.0
  homepage: https://github.com/yonahd/kor
  shortDescription: Kor is a tool to discover unused K8s resources.
  description: |
    This plugin shows unused Kubernetes resources (namespaced or cluster-scoped).
    It provides additional capabilities such as exporting Prometheus metrics,
    deleting unused resources, and more!
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.0/kor_Linux_x86_64.tar.gz
    sha256: 0bda611b832fd05b20432646b8ec265a334479064a659e79672418dfa1ae8a87
    bin: kor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.0/kor_Linux_arm64.tar.gz
    sha256: 35874f582a1cbc8e5cdc451ff0ca7197744d3b12d9bcac9e0d65a7106f6af3fe
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.0/kor_Darwin_x86_64.tar.gz
    sha256: 7e68ed00961821a3f21ae8ba87cf741fea3c66bce04e6cf8fbe01cf408331b94
    bin: kor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.0/kor_Darwin_arm64.tar.gz
    sha256: 3d5ab92a83a0350520fdacc9a56a7aed234b5bdde1173e7240dc41abd97c6c11
    bin: kor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/yonahd/kor/releases/download/v0.7.0/kor_Windows_x86_64.zip
    sha256: 52764603ac3ea5a9d201cbff528efd76ae62f647097cac8d6a276f97bf9a17ea
    bin: kor.exe
