apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ktop
spec:
  version: v0.7.3
  platforms:
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.3/kubectl-ktop_v0.7.3_linux_arm64.tar.gz
      sha256: 512efcadedff0ac692e0f334fce014504491a4c2dcf8ca9dd7feb291418d367b
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.3/kubectl-ktop_v0.7.3_linux_amd64.tar.gz
      sha256: d55d6ab026b45c0cdf16a9b4a25408cca4033ff15805f760886b7a82dcfcfb3f
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.3/kubectl-ktop_v0.7.3_darwin_arm64.tar.gz
      sha256: 6a64c1b8abe67dbaf0ec566320fa06793ef880b61a05edcdb932d34e45fda1ea
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.3/kubectl-ktop_v0.7.3_darwin_amd64.tar.gz
      sha256: c1c4543c52012c701172ce755725eb71de8f7d139055159b81ec8f93a33d9517
      selector:
        matchLabels:
          os: darwin
          arch: amd64
  shortDescription: A top tool to display workload metrics
  homepage: https://github.com/vladimirvivien/ktop
  caveats: |
    * By default, ktop displays metrics for resources in the default namespace. You can override this behavior
    by providing a --namespace or use -A for all namespaces.
  description: |
    This is a kubectl plugin for ktop, a top-like tool for displaying workload
    metrics for a running Kubernetes cluster.