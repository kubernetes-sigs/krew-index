    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.5/kubectl-ktop_v0.7.5_linux_amd64.tar.gz
      sha256: c6d90d95bd617fce946b82553da9c9414b648f012a952242321399a056f06cde
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
