          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.6.2/kubectl-ktop_v0.6.2_linux_amd64.tar.gz
      sha256: 4acede01321cf786fc1dc4560ff28cbccf2fd3ab83b123ba40d6fc5e8d166af3
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
