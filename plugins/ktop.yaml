      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.0/kubectl-ktop_v0.7.0_linux_arm64.tar.gz
      sha256: 02966c2f4bf88afedef054465591b6b74b3e166f6023ea1b9b2011a6ec8c1459
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.0/kubectl-ktop_v0.7.0_linux_amd64.tar.gz
      sha256: 367aac1df4813a4654be660796f9478700bc498f0277f5d4e597e3a87fc10833
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.0/kubectl-ktop_v0.7.0_darwin_arm64.tar.gz
      sha256: 6c2adbafb6b7ea36450818f6a49ebaa984ed5952ea7571c147bc223ea0571cd6
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.0/kubectl-ktop_v0.7.0_darwin_amd64.tar.gz
      sha256: 4f4dc800cafbb5d51e13ee114c4221923cb71004702699d86b88ad97513395df
      selector:
        matchLabels:
          os: darwin
          arch: amd64
  shortDescription: A top tool to display workload metrics
  homepage: https://github.com/vladimirvivien/ktop
  caveats: |
    * By default, ktop displays metrics for resources in the default namespace. You can override this behavior
    by providing a --namespace or use -A for all namespaces.
  description: |
    This is a kubectl plugin for ktop, a top-like tool for displaying workload
    metrics for a running Kubernetes cluster.