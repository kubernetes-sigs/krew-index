apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ktop
spec:
  version: v0.7.1
  platforms:
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.1/kubectl-ktop_v0.7.1_linux_arm64.tar.gz
      sha256: 6b58fe45f20d1ff31af2f4fad0e061888c0730ab5e01002a4be812323b7d0161
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.1/kubectl-ktop_v0.7.1_linux_amd64.tar.gz
      sha256: f8c8f650cdec29f7fbb9a6405922d46c2a68ac3c8aeadc9b4cfc1c323831a914
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.1/kubectl-ktop_v0.7.1_darwin_arm64.tar.gz
      sha256: 14b739c28eb69dbb2af7c497f14ddaf094bba2265f2a2ad5ec7e6defc7b7f4f3
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.1/kubectl-ktop_v0.7.1_darwin_amd64.tar.gz
      sha256: 9de37830b3ff163ccdef9354bf29dadf5a96be1d74efb27614a7ee5f7fedcea2
      selector:
        matchLabels:
          os: darwin
          arch: amd64
  shortDescription: A top tool to display workload metrics
  homepage: https://github.com/vladimirvivien/ktop
  caveats: |
    * By default, ktop displays metrics for resources in the default namespace. You can override this behavior
    by providing a --namespace or use -A for all namespaces.
  description: |
    This is a kubectl plugin for ktop, a top-like tool for displaying workload
    metrics for a running Kubernetes cluster.