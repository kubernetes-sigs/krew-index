    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.8/kubectl-ktop_v0.7.8_linux_amd64.tar.gz
      sha256: 066bd3977c78ade13f137d0bd39fb48a359e9a22a3f7eeb23aee1ad4a89426d9
      selector:
        matchLabels:
          os: linux
