apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ktop
spec:
  version: v0.6.0
  platforms:
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.6.0/kubectl-ktop_v0.6.0_linux_arm64.tar.gz
      sha256: ed1ee69d19da0380a61e6b22b3c9ab400eb899704c4aa5ea431d977f4719b8dd
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.6.0/kubectl-ktop_v0.6.0_linux_amd64.tar.gz
      sha256: 6e6310317c18e17e9e6bb002d5365c59b40d3f49b80a12cf41827435050bb402
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.6.0/kubectl-ktop_v0.6.0_darwin_arm64.tar.gz
      sha256: 099e2a085227086acef94256cdd0b0e815455b0f4182313333af15fc38e964e7
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.6.0/kubectl-ktop_v0.6.0_darwin_amd64.tar.gz
      sha256: e4bea3b8531b54760adec78f8d14a008a658732ff6926bdb5bee2931b37a5ed3
      selector:
        matchLabels:
          os: darwin
          arch: amd64
  shortDescription: A top tool to display workload metrics
  homepage: https://github.com/vladimirvivien/ktop
  caveats: |
    * By default, ktop displays metrics for resources in the default namespace. You can override this behavior
    by providing a --namespace or use -A for all namespaces.
  description: |
    This is a kubectl plugin for ktop, a top-like tool for displaying workload
    metrics for a running Kubernetes cluster.