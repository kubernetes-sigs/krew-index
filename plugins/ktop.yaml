apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ktop
spec:
  version: v0.7.2
  platforms:
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.2/kubectl-ktop_v0.7.2_linux_arm64.tar.gz
      sha256: 960a041ebd1e4a8436e7b2f9ff660d18a083f7dd83abcc5974414ec03c54d2e1
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.2/kubectl-ktop_v0.7.2_linux_amd64.tar.gz
      sha256: 38464b2e63f930e43f100323e34307d36d285d30d1d871a80eb2233406ab5dfe
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.2/kubectl-ktop_v0.7.2_darwin_arm64.tar.gz
      sha256: cc739836f122ffd24683394f2ad1d5d48b4bea9d84fd7cb97c95bee4e25ab6ef
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.2/kubectl-ktop_v0.7.2_darwin_amd64.tar.gz
      sha256: a37639b99800eea57399c1bc1de785fec95c46da26fe4a950f3176b4bfc5cd40
      selector:
        matchLabels:
          os: darwin
          arch: amd64
  shortDescription: A top tool to display workload metrics
  homepage: https://github.com/vladimirvivien/ktop
  caveats: |
    * By default, ktop displays metrics for resources in the default namespace. You can override this behavior
    by providing a --namespace or use -A for all namespaces.
  description: |
    This is a kubectl plugin for ktop, a top-like tool for displaying workload
    metrics for a running Kubernetes cluster.