    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.4/kubectl-ktop_v0.7.4_linux_amd64.tar.gz
      sha256: d90f3329ce70c9b82ddfae809924a9eac44c00d9929f0697da1715525327ecac
      selector:
        matchLabels:
          os: linux
