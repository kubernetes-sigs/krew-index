      sha256: ce54ba3bc8925885de3318adb9c2595c8267fe81ae5776b10f2ce5e9f6864659
      selector:
        matchLabels:
          os: linux
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.7/kubectl-ktop_v0.7.7_linux_amd64.tar.gz
      sha256: 42623600d6847b5051dbf2213b2aaa67d71d94edf87d91f970f47b6b90f865eb
      selector:
        matchLabels:
          os: linux
          arch: amd64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.7/kubectl-ktop_v0.7.7_darwin_arm64.tar.gz
      sha256: 55814c4ea8d2264c4d1283520a63dcafd221501abb251a94ed8106f3ef350114
      selector:
        matchLabels:
          os: darwin
          arch: arm64
    - bin: kubectl-ktop
      uri: https://github.com/vladimirvivien/ktop/releases/download/v0.7.7/kubectl-ktop_v0.7.7_darwin_amd64.tar.gz
      sha256: f5ea420e1df8a5dcd3cb0edae2405dab4a24c3a1e927ef71e9ea748b8b2024f9
