# krew-release-bot template. On every v* release, the release workflow's
# krew-release-bot step renders this with the new tag and opens a version-bump
# PR against kubernetes-sigs/krew-index automatically.
#
# v1.3.0 is the git tag (v1.2.0); archive filenames use the bare
# version (1.2.0), hence 1.3.0 inside the asset URLs.
#
# Test-render locally:
#   docker run -v $(pwd)/.krew.yaml:/tmp/template-file.yaml \
#     ghcr.io/rajatjindal/krew-release-bot:v0.0.47 \
#     krew-release-bot template --tag v1.2.0 --template-file /tmp/template-file.yaml
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kubesplaining
spec:
  version: v1.3.0
  homepage: https://github.com/0hardik1/kubesplaining
  shortDescription: Scan for security risks and RBAC escalation paths
  description: |
    Kubesplaining scans a Kubernetes cluster (live, or offline from a
    snapshot file) and emits scored security findings as HTML, JSON, CSV,
    or SARIF.

    Its differentiator is an RBAC privilege-escalation graph: it searches
    from every subject toward sinks such as cluster-admin, kube-system
    secrets, node escape, and token minting, and reports the full hop
    chain for each route it finds, including whether the route survives
    the recommended fix.

    Additional analyzers cover overbroad RBAC grants, pod security
    (privileged containers, host namespaces, hostPath), NetworkPolicy
    coverage, admission webhook weaknesses, secret and ConfigMap
    exposure, service-account token handling, certificate-signing abuse,
    and EKS-specific IAM mappings. Raw Secret values are never read, and
    ConfigMap values are redacted at collection time.
  caveats: |
    This plugin needs read (get/list) access to the RBAC, workload, and
    policy APIs it inspects. Forbidden resources are skipped and recorded
    as collection warnings, so partial scans of locked-down clusters
    still work.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/0hardik1/kubesplaining/releases/download/v1.3.0/kubesplaining_1.3.0_Darwin_arm64.tar.gz
    sha256: a092ec29577c69519bec308a352e952462da5e430c3d84f9d7e24cd6a74907be
    bin: kubesplaining
    files:
    - from: kubesplaining
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/0hardik1/kubesplaining/releases/download/v1.3.0/kubesplaining_1.3.0_Darwin_x86_64.tar.gz
    sha256: cbe907262a6937c2ce8445cfcdba091c7781dfb845d4d83536b64f405228d04b
    bin: kubesplaining
    files:
    - from: kubesplaining
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/0hardik1/kubesplaining/releases/download/v1.3.0/kubesplaining_1.3.0_Linux_arm64.tar.gz
    sha256: b57bb799ac1d449c251c5ce0ac32eb644fd7c345d4dc5e27c7e509bcb4435749
    bin: kubesplaining
    files:
    - from: kubesplaining
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/0hardik1/kubesplaining/releases/download/v1.3.0/kubesplaining_1.3.0_Linux_x86_64.tar.gz
    sha256: 2c21817fa914f976c717d9140630ca568afcba3629b3d0eac2522378c9e75490
    bin: kubesplaining
    files:
    - from: kubesplaining
      to: .
    - from: LICENSE
      to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/0hardik1/kubesplaining/releases/download/v1.3.0/kubesplaining_1.3.0_Windows_x86_64.zip
    sha256: b608d29ff97a44d36132a5e008b3b5daa0184208c2e4444f5f7adb0be95a48b8
    bin: kubesplaining.exe
    files:
    - from: kubesplaining.exe
      to: .
    - from: LICENSE
      to: .
