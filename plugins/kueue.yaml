apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.0
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.0/kubectl-kueue-linux-amd64.tar.gz
    sha256: 543ff0e6fa848829ec1bd426e768e0d988c4ec74af24c5092342fa02911a6182
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.0/kubectl-kueue-linux-arm64.tar.gz
    sha256: f87752baa94fdab592d2db64ce34ee1b690c92109cec311dde34cafec90f1c69
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.0/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 49b5d042713600062414b81f715e254254d63f0b31bf328681a4d1ff805f108b
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.0/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 76d6a3f8bae48e0a45f0554ce7d94e78a596a0a71d491210eee9b4410869d8a0
    bin: "kubectl-kueue"
