apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.4
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.4/kubectl-kueue-linux-amd64.tar.gz
    sha256: eac1dbc56b318fd68ac87c5db97550e72ece6bc95a571dc299cbf3a30b3be657
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.4/kubectl-kueue-linux-arm64.tar.gz
    sha256: e85007a1e5a0896d9cbc000dad429ebf3db34566f4ec72d70bc935e0a98d4020
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.4/kubectl-kueue-darwin-amd64.tar.gz
    sha256: db7c6e8d46714e8af2b9236f4e5065b0af6827dee756bc669361f1f333fab291
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.4/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 9a2c6ebd34751c9f6ae6d2d2fb5c8119259a05a060dbdf7603e2dfbdabb11398
    bin: "kubectl-kueue"
