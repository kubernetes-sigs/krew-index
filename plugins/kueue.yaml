apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.19.5
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.5/kubectl-kueue-linux-amd64.tar.gz
    sha256: 7ebaa6cc0daa020e39cb72018e3534bca07a6dbf1da7b6f57221b480ecaa94b7
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.5/kubectl-kueue-linux-arm64.tar.gz
    sha256: 5dc535f3840fcbf7557fc03091226286afe24903f3ae4fe3a14d499b51bcfa6a
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.5/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 01d20655bcc3298296779640b332c1eb0e931d13bf7458d53e2bba3fee471c27
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.5/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 24f95c80010bb946f193b3fadc747eb8b01330ed86f330083ea7f8da12bef013
    bin: "kubectl-kueue"
