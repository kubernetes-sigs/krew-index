apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.2
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.2/kubectl-kueue-linux-amd64.tar.gz
    sha256: 5c5da87d9967ffe9f5b5cbef9aa630731a32ace6b077d519a2f82f2b88cbf324
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.2/kubectl-kueue-linux-arm64.tar.gz
    sha256: 6d5b7448c7a7ca5840b828a68b231005b3f6194cf477aa225d6816f09adc4aa3
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.2/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 6e9395cd82439e1b1ad2ee44ca0756fc7b76c0a98b15e8534b8be375da451e59
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.2/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 5c3818049eb82087f49da532854538865c3f9c495490bab55886c3919acd8e6d
    bin: "kubectl-kueue"
