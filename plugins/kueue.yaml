apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.18.9
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.18.9/kubectl-kueue-linux-amd64.tar.gz
    sha256: b406a7ab79b5dcb3bf6b83abad17711f7cf14a40e01c8679e8b2d70bd1c8a33f
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.18.9/kubectl-kueue-linux-arm64.tar.gz
    sha256: a0c616baea7f7a4505c3885c6c3d6863924dd1ca29d2ecd8ded5f89fdbe276b7
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.18.9/kubectl-kueue-darwin-amd64.tar.gz
    sha256: ab755e9396e03881f9d106ec3d792d54c2dbb09e800eb00cacab9b29710bb217
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.18.9/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 012a2e456842a4cbeaa5266fb349ee975ba1d2f3bcbedce1e92cec0f3472b301
    bin: "kubectl-kueue"
