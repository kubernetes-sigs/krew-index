apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.1
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.1/kubectl-kueue-linux-amd64.tar.gz
    sha256: 4f746b5bae487c9847e10d584970f26d964f76a7b209b3a544205a3e4d644225
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.1/kubectl-kueue-linux-arm64.tar.gz
    sha256: 46f2008c692e3eeb7b8821de6aa84f7ec2f598680851c83f4720dfefc59f0c00
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.1/kubectl-kueue-darwin-amd64.tar.gz
    sha256: f75a2567d0519387a5efe4782493e9f90fb530cd14723709e07b9b58f8ec90d4
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.1/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 3754d85e153fdbc8c7ec239762194bf54057e7f7e5cf10ab864794e39a76fe3e
    bin: "kubectl-kueue"
