apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.19.7
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.7/kubectl-kueue-linux-amd64.tar.gz
    sha256: 26e4b7f3589ef984ed04e81a78014704547c23fa11cf316fea6818199cad538b
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.7/kubectl-kueue-linux-arm64.tar.gz
    sha256: 5046788120c5b0f35f5475de6df4a5175c82b70aa43af72257e1da4ac7911a48
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.7/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 6502357ced724e681fed22703d4bbb40f24454b10c97717ba9744449b3232bb8
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.19.7/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 349efa18d60abf09733a1278ccfdf56ef8fe743aa8cf1f6ec2835e183f8a5ca9
    bin: "kubectl-kueue"
