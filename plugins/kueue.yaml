apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.5
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.5/kubectl-kueue-linux-amd64.tar.gz
    sha256: 45b15f51253a94a6fb3807f9c4f987742594614207d177633c4532411c70c7d7
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.5/kubectl-kueue-linux-arm64.tar.gz
    sha256: 9a137a03278fc200c421d8c1c11944c0c959d3cc50fda4fb0663ab49711ccfa0
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.5/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 11349d4f9b58f8cf8dc375b6ce4a2b23fdd88600d0ed21f6334aae3853d8100e
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.5/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 23af8f4d8844783b6e378686a95d3a788583f6cdfee808822cc2c6be19c47ce8
    bin: "kubectl-kueue"
