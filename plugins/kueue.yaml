apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.8
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.8/kubectl-kueue-linux-amd64.tar.gz
    sha256: 6f98887718654ceb3063fbea878e67225dd751c11c8d016afbfb946b9db34926
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.8/kubectl-kueue-linux-arm64.tar.gz
    sha256: a9a52e6ddde62572466ea3bf138d3476ad219d56dd24c552a85340d661b8e72f
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.8/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 58f044fdcdcf5b16a7748aa073b6c8defc0619daa3a8587eeff45afa17f22f39
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.8/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 8e105b1c8f679317d4ac644e1640f81ff70b4eb9307c36224eda9135855cd7d6
    bin: "kubectl-kueue"
