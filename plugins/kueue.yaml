apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.6
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.6/kubectl-kueue-linux-amd64.tar.gz
    sha256: 3cfd90d44ed36bb408c5685622d5bb6e8d3a4b0301ff0231332de315e833ef30
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.6/kubectl-kueue-linux-arm64.tar.gz
    sha256: 3c28b8792a7ed63513335c7d85cec7f4f6412df706f24bb0a18c6b6e2469f1ce
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.6/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 0e340dee4538bfe1be6ac59fc6236fa0259ffeacd1d396b3d5a49589de6325aa
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.6/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 4cbf743112706f056dddab9e0d067f4bc653daa199693d0fa633acdde4d927a9
    bin: "kubectl-kueue"
