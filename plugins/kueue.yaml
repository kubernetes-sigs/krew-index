apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kueue
spec:
  version: v0.20.3
  shortDescription: Controls Kueue queueing manager.
  homepage: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  description: |
    The kubectl-kueue plugin, kueuectl, allows you to list, create, resume
    and stop kueue resources such as clusterqueues, localqueues and workloads.

    See the documentation for more information: https://kueue.sigs.k8s.io/docs/reference/kubectl-kueue/
  caveats: |
    Requires the Kueue operator to be installed:
      https://kueue.sigs.k8s.io/docs/installation/
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.3/kubectl-kueue-linux-amd64.tar.gz
    sha256: 742b282081d20d62e9fcf0e2935d90edd3fe79960418dd818a2593c9d45a6882
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.3/kubectl-kueue-linux-arm64.tar.gz
    sha256: f1ebe3807a730e937e9b2dd9285e3aab4ec0fcc9c37631909ea31ffa41cb891b
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.3/kubectl-kueue-darwin-amd64.tar.gz
    sha256: 95a4618718d33fe1051adbb0ed00b3052426a11a89971cc5d452903a4849c0a7
    bin: "kubectl-kueue"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kubernetes-sigs/kueue/releases/download/v0.20.3/kubectl-kueue-darwin-arm64.tar.gz
    sha256: 6905ed7a71f7a7cbb3d0a198a1ffc201374620c26bdede8718b65cc915e6dc9c
    bin: "kubectl-kueue"
