apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kuttl
spec:
  version: "v0.27.0"

  shortDescription: Declaratively run and test operators
  homepage: https://github.com/kudobuilder/kuttl
  description: |
    The KUbernetes Test TooL (KUTTL) is a highly productive test
    toolkit for testing operators on Kubernetes.
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.27.0/kuttl_0.27.0_linux_x86_64.tar.gz
    sha256: "5a51888ff8a162b4ffe2f32564b8c62d5c0319569ccf6805851554fa1a8ded8b"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "386"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.27.0/kuttl_0.27.0_linux_i386.tar.gz
    sha256: "2b4adcf30ac53b5b398aa77250629c1c077f40d8722b330980927c86eaaaf53d"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.27.0/kuttl_0.27.0_linux_arm64.tar.gz
    sha256: "6737b87c7d10bbe60a21347a7ba9a983ad4ba455a8d8990cc9bf749b7f0c8299"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.27.0/kuttl_0.27.0_darwin_x86_64.tar.gz
    sha256: "114b67fcd1cc6878166c8b7ea8364925ff8effbae7ba80ce375876677879189e"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.27.0/kuttl_0.27.0_darwin_arm64.tar.gz
    sha256: "a9b9c09e89f6ecf128a79350b111bea39df84d628e89afc9add5d593137864df"
    bin: "./kubectl-kuttl"
