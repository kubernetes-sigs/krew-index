apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kuttl
spec:
  version: "v0.28.0"

  shortDescription: Declaratively run and test operators
  homepage: https://github.com/kudobuilder/kuttl
  description: |
    The KUbernetes Test TooL (KUTTL) is a highly productive test
    toolkit for testing operators on Kubernetes.
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.28.0/kuttl_0.28.0_linux_x86_64.tar.gz
    sha256: "efd9eeb816633951d31b1a62ecde24e3ead1f05e1ec534fe807d0332f578068a"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "386"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.28.0/kuttl_0.28.0_linux_i386.tar.gz
    sha256: "a2fb040beea9cd82908f9bfcaff7f280c26a73ea9b493c099037b77fe6725985"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.28.0/kuttl_0.28.0_linux_arm64.tar.gz
    sha256: "c6a8bd180cc6d7d51924ea20526d0410311595baeb62ccee01693170423fd410"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.28.0/kuttl_0.28.0_darwin_x86_64.tar.gz
    sha256: "9d56ca51050895080984786a5ae6e3f296c8271826c2d0e27a2cfb354c12ba53"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.28.0/kuttl_0.28.0_darwin_arm64.tar.gz
    sha256: "37f5a4722103e593ab7c24a090336c1e409f75b1b04e898401da50438c4ee453"
    bin: "./kubectl-kuttl"
