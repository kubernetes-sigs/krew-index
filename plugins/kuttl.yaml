apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kuttl
spec:
  version: "v0.29.0"

  shortDescription: Declaratively run and test operators
  homepage: https://github.com/kudobuilder/kuttl
  description: |
    The KUbernetes Test TooL (KUTTL) is a highly productive test
    toolkit for testing operators on Kubernetes.
  platforms:
  - selector:
      matchLabels:
        os: "linux"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.29.0/kuttl_0.29.0_linux_x86_64.tar.gz
    sha256: "2c1b1e688c885b0d1b6280ca309d3c9c20655f281590a683f14797ee9b3b06c1"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "386"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.29.0/kuttl_0.29.0_linux_i386.tar.gz
    sha256: "1b898af8a1b2379504887ea2d77ab51336210563460a0bffbc2dc2dd3eb0057e"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "linux"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.29.0/kuttl_0.29.0_linux_arm64.tar.gz
    sha256: "08f1fb95a19af5384f170ed374025977b9f1cb0644ba4623c360d97069f2d020"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "amd64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.29.0/kuttl_0.29.0_darwin_x86_64.tar.gz
    sha256: "97deee20eca95ee5db56cfe6a1efa7af14276beb9f27109dcb5a1f944d1f084d"
    bin: "./kubectl-kuttl"
  - selector:
      matchLabels:
        os: "darwin"
        arch: "arm64"
    uri: https://github.com/kudobuilder/kuttl/releases/download/v0.29.0/kuttl_0.29.0_darwin_arm64.tar.gz
    sha256: "e2f1cd69f8896294d64d63f6be40cecd4599d4c1e746d9116a9816da0d50c757"
    bin: "./kubectl-kuttl"
