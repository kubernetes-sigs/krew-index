apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: lastwords
spec:
  version: v0.1.3
  homepage: https://github.com/Arvo-AI/lastwords
  shortDescription: Read heap and crash captures from dead containers
  description: |
    Reads the evidence the lastwords DaemonSet saves when a container dies or
    runs low on memory: Java class histograms and Go heap profiles taken before
    an OOM kill, the logs of the container instance that died, pod events, and
    core dumps matched to their pod. It can list captures, print a capture's
    summary, download its files, and show the containers closest to their
    memory limit right now. It talks to the agents through the API server's
    pod proxy, so it needs no extra ports or credentials beyond kubectl's.
  caveats: |
    This plugin needs the lastwords agent running in the cluster (a Helm chart).
    Installation and docs: https://github.com/Arvo-AI/lastwords
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Darwin_arm64.tar.gz
    sha256: 8ad0a50cd906a154f39f4eb35ec8557bd9591cb768da716f59cb051693d0482b
    bin: lastwords
    files:
      - from: lastwords
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Darwin_x86_64.tar.gz
    sha256: 4a1d0a3ce1938a382b97b5600f4b8e2d163020e24117919ab9de6f20185bc28c
    bin: lastwords
    files:
      - from: lastwords
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Linux_arm64.tar.gz
    sha256: 307d05a115a3b5d5c4f316a09076d131b9ca0e9c59b508e3dbc842bcfdd523bb
    bin: lastwords
    files:
      - from: lastwords
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Linux_x86_64.tar.gz
    sha256: c2ca99a94776002cac5e97b8a4496d892070ba026229805a62efb17943e51234
    bin: lastwords
    files:
      - from: lastwords
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Windows_arm64.zip
    sha256: faba2d3b2553c59484e6a1783e7ac005c6d1f0a9744deaed1a14d5bdbf3684d4
    bin: lastwords.exe
    files:
      - from: lastwords.exe
        to: .
      - from: LICENSE
        to: .
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Arvo-AI/lastwords/releases/download/v0.1.3/lastwords_Windows_x86_64.zip
    sha256: 434239807ce82b9c5aaa5a3bc06c54bb48baf2da88d97b0ed8e5d41546b03252
    bin: lastwords.exe
    files:
      - from: lastwords.exe
        to: .
      - from: LICENSE
        to: .
