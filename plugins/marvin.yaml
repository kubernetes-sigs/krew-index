apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: marvin
spec:
  homepage: https://github.com/undistro/marvin
  shortDescription: Scan clusters with your own checks written in CEL.
  description: |
    Marvin scans a Kubernetes cluster by performing CEL expressions 
    to report potential issues, misconfigurations and vulnerabilities.
    
    Marvin allows you to write your own checks by using CEL expressions.
  version: v0.2.13
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/undistro/marvin/releases/download/v0.2.13/marvin_Linux_x86_64.tar.gz
    sha256: a04f2bfbe7144d66b9cb2ec19a401a41873216c1318928a526662b57f77a6025
    bin: marvin
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/undistro/marvin/releases/download/v0.2.13/marvin_Linux_arm64.tar.gz
    sha256: c174e6675e3cd101087faa1068b684afaa0317ddbdb3e9a7233e3e3fcd0b4c04
    bin: marvin
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/undistro/marvin/releases/download/v0.2.13/marvin_Darwin_x86_64.tar.gz
    sha256: 13b4a6c85ebf881672bc031c78c79e607f4ac7132d5eefd2c972d37e34facc45
    bin: marvin
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/undistro/marvin/releases/download/v0.2.13/marvin_Darwin_arm64.tar.gz
    sha256: 29e78921433e0e8a234bea915c122b87651acc8b53b1863f777b8b037ab5e4e0
    bin: marvin
