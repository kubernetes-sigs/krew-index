apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: mayastor
spec:
  version: v2.12.0
  homepage: https://openebs.io/docs/
  shortDescription: Provides commands for OpenEBS Mayastor.
  description: |
    This plugin allows you to manage Mayastor volumes and upgrades.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.0/kubectl-mayastor-x86_64-apple-darwin.tar.gz
    sha256: 05295f212db3ceea9bb695ed38aa2704dff0780622356797c945fbac46f1485d
    bin: kubectl-mayastor
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.0/kubectl-mayastor-aarch64-apple-darwin.tar.gz
    sha256: bf982bc99c63c55213e32be5247155e1295108e3719c6476c79ec2f17ecae54b
    bin: kubectl-mayastor
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.0/kubectl-mayastor-x86_64-linux-musl.tar.gz
    sha256: 205333abb8f27659ab14e2213250595c1dbf55a01d7e8887881c10174cee624b
    bin: kubectl-mayastor
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.0/kubectl-mayastor-aarch64-linux-musl.tar.gz
    sha256: 2876993e970aa1c2cbe317661823602c83a46384dfb5745083f7d6a9281046d1
    bin: kubectl-mayastor
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.0/kubectl-mayastor-x86_64-windows-gnu.tar.gz
    sha256: 300dced0478d5d4efc966a8823d72bb8c4adc41de4438275491da16c4a69158c
    bin: kubectl-mayastor.exe
