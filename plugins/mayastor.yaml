        arch: arm64
    uri: https://github.com/openebs/mayastor-extensions/releases/download/v2.12.2/kubectl-mayastor-aarch64-apple-darwin.tar.gz
    sha256: 082642b7e72d2a2d41ba26d1d8e9bec8a727e7bb2aa718a97b6822b5fc0a8106
