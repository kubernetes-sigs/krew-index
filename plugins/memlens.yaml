apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: memlens
spec:
  version: "v1.0.6"
  homepage: https://github.com/danushkastanley/KubeMemLens
  shortDescription: Explain why Pod memory is high
  description: |
    Breaks Pod and container memory into anonymous memory, file cache,
    tmpfs/shared memory and other, using cgroup v2 evidence, so you can tell
    a real leak from reclaimable page cache before an OOMKill. Includes a
    terminal dashboard, per-Pod explanations and offline incident replay.
    It never changes workloads.
  caveats: |
    Full cgroup detail needs the KubeMemLens Helm chart in the cluster:
      https://github.com/danushkastanley/KubeMemLens/blob/main/docs/installation.md
    Without it, the plugin shows Metrics API working set only, which needs
    metrics-server.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.6/kube-memlens_1.0.6_linux_amd64.tar.gz
      sha256: "dc3db8e220130f67dd2ef0c937ec157686b62c09f0aa8cc6925e43672a20fd9f"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.6/kube-memlens_1.0.6_linux_arm64.tar.gz
      sha256: "5abf16ff79fc98f6aef9336ac4a85f9f0db4ebc74d0cc0569e393f284fb8934b"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.6/kube-memlens_1.0.6_darwin_amd64.tar.gz
      sha256: "732953c0c88a5e6bec151af807ff64d1aee6a31ff5666cc79a7d7c25a460d7a3"
      files:
        - from: "kubectl-memlens"
          to: "."
