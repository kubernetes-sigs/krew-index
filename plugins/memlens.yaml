      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.4/kube-memlens_1.0.4_windows_amd64.zip
      sha256: "4e361c8f3141f326484323b0d5d9303286f9aeb580ee5a2c662a9bb209eeedfc"
      files:
        - from: "kubectl-memlens.exe"
