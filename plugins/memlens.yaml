          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.5/kube-memlens_1.0.5_windows_amd64.zip
      sha256: "9577b9955b329358a92544377f161081a6d0c02f0ad9e5d493e1edabeca3e626"
      files:
        - from: "kubectl-memlens.exe"
