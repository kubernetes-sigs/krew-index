      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.6/kube-memlens_1.0.6_darwin_arm64.tar.gz
      sha256: "97283a7031bf96ad559c93c953e4f76ac1a6dbc631ceebb30ca9083b4721393c"
      files:
        - from: "kubectl-memlens"
          to: "."
