      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.4/kube-memlens_1.0.4_darwin_arm64.tar.gz
      sha256: "10ea5f3b93cf2e6e86799fefae4d878217bbf772b282380e4b157acf6823bd1f"
      files:
        - from: "kubectl-memlens"
          to: "."
