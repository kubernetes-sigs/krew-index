apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: memlens
spec:
  version: "v1.0.4"
  homepage: https://github.com/danushkastanley/KubeMemLens
  shortDescription: Explain why Pod memory is high
  description: |
    Breaks Pod and container memory into anonymous memory, file cache,
    tmpfs/shared memory and other, using cgroup v2 evidence, so you can tell
    a real leak from reclaimable page cache before an OOMKill. Includes a
    terminal dashboard, per-Pod explanations and offline incident replay.
    It never changes workloads.
  caveats: |
    Full cgroup detail needs the KubeMemLens Helm chart in the cluster:
      https://github.com/danushkastanley/KubeMemLens/blob/main/docs/installation.md
    Without it, the plugin shows Metrics API working set only, which needs
    metrics-server.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.4/kube-memlens_1.0.4_linux_amd64.tar.gz
      sha256: "e55d8f94dd97ae51ced21d16d743a19ac816836d74af56ad563bf50e15a3ab75"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.4/kube-memlens_1.0.4_linux_arm64.tar.gz
      sha256: "b1abd61472840f097db30f7a33c8f65815209d7bd83670eea972b0a263afa24c"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.4/kube-memlens_1.0.4_darwin_amd64.tar.gz
      sha256: "38f8c06680942a00e31677c2dd9d14d0565d4e7c6912b26454f625a55ab9b950"
      files:
        - from: "kubectl-memlens"
          to: "."
