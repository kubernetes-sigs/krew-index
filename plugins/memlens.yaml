      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.6/kube-memlens_1.0.6_windows_amd64.zip
      sha256: "70edbf628b0dd6746a5c3c2e4b00dc31bfc3a7c927535d067560fcf747876be4"
      files:
        - from: "kubectl-memlens.exe"
