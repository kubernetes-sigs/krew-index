      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.5/kube-memlens_1.0.5_darwin_arm64.tar.gz
      sha256: "fff17a6875e5d2c32323c84381df7ffa808ab8607bb475cc83466708d855aab6"
      files:
        - from: "kubectl-memlens"
          to: "."
