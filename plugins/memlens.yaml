apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: memlens
spec:
  version: "v1.0.5"
  homepage: https://github.com/danushkastanley/KubeMemLens
  shortDescription: Explain why Pod memory is high
  description: |
    Breaks Pod and container memory into anonymous memory, file cache,
    tmpfs/shared memory and other, using cgroup v2 evidence, so you can tell
    a real leak from reclaimable page cache before an OOMKill. Includes a
    terminal dashboard, per-Pod explanations and offline incident replay.
    It never changes workloads.
  caveats: |
    Full cgroup detail needs the KubeMemLens Helm chart in the cluster:
      https://github.com/danushkastanley/KubeMemLens/blob/main/docs/installation.md
    Without it, the plugin shows Metrics API working set only, which needs
    metrics-server.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.5/kube-memlens_1.0.5_linux_amd64.tar.gz
      sha256: "5668718e4dccbdd31b4b2da66805f7ad2344cb587ef9799f53618d2c98936d82"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.5/kube-memlens_1.0.5_linux_arm64.tar.gz
      sha256: "764338f49ef532b9ba295cf00a45695e055915b3f984b257ff18a8e369dbbee5"
      files:
        - from: "kubectl-memlens"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: kubectl-memlens
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/danushkastanley/KubeMemLens/releases/download/v1.0.5/kube-memlens_1.0.5_darwin_amd64.tar.gz
      sha256: "a0ae93e0de8df0fe32d0c74b0c17d8360783398f70292497a64e88f23f64d13f"
      files:
        - from: "kubectl-memlens"
          to: "."
