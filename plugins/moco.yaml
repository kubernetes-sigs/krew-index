apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: moco
spec:
  version: v0.37.0
  homepage: https://github.com/cybozu-go/moco
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.37.0/kubectl-moco_v0.37.0_darwin_amd64.tar.gz
      sha256: c6c1cf84039d2e2e18f7543bcda966815ad83a565f3c6ad5071813436f973488
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.37.0/kubectl-moco_v0.37.0_darwin_arm64.tar.gz
      sha256: 803dda91ce8bcc0ac8d66e33a65edd03c145001e9bd88e29d0b74b4e1a1e50a3
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.37.0/kubectl-moco_v0.37.0_linux_amd64.tar.gz
      sha256: bee4a2be7a938672d3b1891579920be8c628c90e6db933c92488f2546eed5764
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.37.0/kubectl-moco_v0.37.0_linux_arm64.tar.gz
      sha256: 909b6f7b5ead2e1cf65e766c0a4aa4344b54ef728222529d81507afcb8a9dd4c
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.37.0/kubectl-moco_v0.37.0_windows_amd64.tar.gz
      sha256: 18e55b85534276f81d1f367417156260527ff41cb1e2087c768c6fef87c95701
      bin: kubectl-moco.exe
      files:
        - from: kubectl-moco.exe
          to: .
        - from: LICENSE
          to: .
  shortDescription: Interact with MySQL operator MOCO.
  description: |
    kubectl-moco is a kubectl plugin for controlling MySQL clusters created by the MySQL operator MOCO.
    MOCO is a MySQL operator on Kubernetes.
    Its primary function is to manage MySQL clusters using GTID-based semi-synchronous replication.
    It does not manage group replication clusters.
    Read more documentation at: https://cybozu-go.github.io/moco/index.html
