apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: moco
spec:
  version: v0.38.0
  homepage: https://github.com/cybozu-go/moco
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.38.0/kubectl-moco_v0.38.0_darwin_amd64.tar.gz
      sha256: 550cb07b1ba1d5c40e9dabbd08ff43d38e0e722002de192b50eb9bac138d6534
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.38.0/kubectl-moco_v0.38.0_darwin_arm64.tar.gz
      sha256: 79b03b020b6a9839eb9c1dbea36bc62bfb9e9fc1ca0876129e47778e4e294602
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.38.0/kubectl-moco_v0.38.0_linux_amd64.tar.gz
      sha256: 9f8a6edf534cec35307fef185d829439bdf7ed9c33cdbf8897026ee1b359b36d
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.38.0/kubectl-moco_v0.38.0_linux_arm64.tar.gz
      sha256: ad31e74a5a47aff13bcd9feadec32203df2f5bec91e5d7848de27b1f838be14c
      bin: kubectl-moco
      files:
        - from: kubectl-moco
          to: .
        - from: LICENSE
          to: .
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/cybozu-go/moco/releases/download/v0.38.0/kubectl-moco_v0.38.0_windows_amd64.tar.gz
      sha256: 5dca47c89b9c68b23d7321eeaa508252ddf230bfee3efbb8a379c2c06d0c8d80
      bin: kubectl-moco.exe
      files:
        - from: kubectl-moco.exe
          to: .
        - from: LICENSE
          to: .
  shortDescription: Interact with MySQL operator MOCO.
  description: |
    kubectl-moco is a kubectl plugin for controlling MySQL clusters created by the MySQL operator MOCO.
    MOCO is a MySQL operator on Kubernetes.
    Its primary function is to manage MySQL clusters using GTID-based semi-synchronous replication.
    It does not manage group replication clusters.
    Read more documentation at: https://cybozu-go.github.io/moco/index.html
