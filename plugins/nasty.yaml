apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: nasty
spec:
  version: v0.0.5
  homepage: https://github.com/nasty-project/nasty-plugin
  shortDescription: Manage NASty CSI volumes
  description: |
    kubectl plugin for managing NASty CSI driver volumes.

    Commands:
    - list: List all managed volumes with clone relationships
    - list-snapshots: List snapshots with source volumes
    - list-orphaned: Find volumes without matching PVCs
    - describe: Show detailed volume information
    - health: Check health of all volumes
    - troubleshoot: Diagnose PVC issues
    - summary: Dashboard overview of all resources
    - cleanup: Delete orphaned volumes safely
    - mark-adoptable: Mark volumes for DR/adoption
    - adopt: Generate PV manifest for adoption
    - status: Show volume status from NASty
    - connectivity: Test NASty connection
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/nasty-project/nasty-plugin/releases/download/v0.0.5/kubectl-nasty-linux-amd64.tar.gz
    sha256: dde1778c9a06ea874c35ef24a9f44fec76266a2c7d7837df66ee8ba9a5af3dff
    bin: kubectl-nasty
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/nasty-project/nasty-plugin/releases/download/v0.0.5/kubectl-nasty-linux-arm64.tar.gz
    sha256: d02423ef492afc404343491dc258d352dd2fb6f1fc018acd7465c0c96a5f4ad5
    bin: kubectl-nasty
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/nasty-project/nasty-plugin/releases/download/v0.0.5/kubectl-nasty-darwin-amd64.tar.gz
    sha256: bbafd086b5471e45fe51c0109d2a84c3f7e289951f5dafb5ac2abea36133162a
    bin: kubectl-nasty
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/nasty-project/nasty-plugin/releases/download/v0.0.5/kubectl-nasty-darwin-arm64.tar.gz
    sha256: 6b1f35d40e1d5e2520ac921324cbb12f25a2aa604a43713182473a14badcd512
    bin: kubectl-nasty
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/nasty-project/nasty-plugin/releases/download/v0.0.5/kubectl-nasty-windows-amd64.zip
    sha256: 2926e6e10d3d071286ff989996a321591410b2845ef8ad09bcbbe30487a66931
    bin: kubectl-nasty.exe
