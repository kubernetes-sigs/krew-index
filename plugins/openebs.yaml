      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.0/kubectl-openebs-x86_64-windows-gnu.tar.gz
    sha256: 2c77ce4d229b4f72000e938c71980b6bc243d43271722738745f05a135e5ad5a
