      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.0/kubectl-openebs-x86_64-apple-darwin.tar.gz
    sha256: c3bf7797083116890a716c5ab4ff96dc06e4727a8c6ebfd7babef23a91f34b4b
    bin: kubectl-openebs
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.0/kubectl-openebs-aarch64-apple-darwin.tar.gz
    sha256: fccd4f1b5d80b3334f723e5be6364aa02a3f25672dc0a56e4ad846cefecd8bde
    bin: kubectl-openebs
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.0/kubectl-openebs-x86_64-linux-musl.tar.gz
    sha256: da14bdf3bd51650d5c13a89338ea0c9718a5a164e21b953f41db1ff8d05931b7
