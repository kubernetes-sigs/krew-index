  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.1/kubectl-openebs-aarch64-apple-darwin.tar.gz
    sha256: 033159c66033cf67979b1d44ccba7752974bf12972b4cff634734bf850ba490b
    bin: kubectl-openebs
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.1/kubectl-openebs-x86_64-linux-musl.tar.gz
    sha256: 263ad8301eab9a4a28f190fd7127bf14674f13a85a4b779674496301ace3fb67
    bin: kubectl-openebs
  - selector:
      matchLabels:
        os: linux
        arch: arm64
