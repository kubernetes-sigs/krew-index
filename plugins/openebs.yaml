      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/openebs/openebs/releases/download/v4.6.1/kubectl-openebs-x86_64-apple-darwin.tar.gz
    sha256: e8028bc823a9dd314634aeec447dff25252f4786a4beb3375812e17384898855
