apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: openunison-cli
spec:
  version: v1.4.0
  homepage: https://github.com/openunison/openunison-cli
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.4.0-macos.zip
    sha256: d3468ba231b79fbd0fac2e9e06c3854a2e7db1b0c0491155d4a52240411017b8
    bin: oulogin
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.4.0-macos-arm64.zip
    sha256: 7a5368654b9cb63ee61b765a37ec0542dc6eaf779515b140bfd3bb81e33c5a3d
    bin: oulogin
  - selector:
      matchLabels:
        os: linux
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.4.0-linux.zip
    sha256: c5a048d9d9be2ff4a7b32d095df83e143544d56fa6521d688a93349a934a9bd0
    bin: oulogin
  - selector:
      matchLabels:
        os: windows
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.4.0-win.zip
    sha256: 1f246c3a355704d7cbdfe4e5d5945b7bbd27ffb4a79d815dfcc0f1473b284a5e
    bin: oulogin.exe
  shortDescription: "Login to a kubernetes cluster via OpenUnison"
  description: |
    kubectl exec plugin that will launch a browser to authenticate you 
    without having a pre-existing kubectl configuration file.  The first
    time you execute this plugin, include the host of your OpenUnison 
    server and the plugin will launch a browser and authenticate you.  As
    you work with kubectl it will keep your short-lived tokens updated and
    if they expire, automatically re-launch a browser window to authenticate
    you.