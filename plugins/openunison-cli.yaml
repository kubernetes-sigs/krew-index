apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: openunison-cli
spec:
  version: v1.5.1
  homepage: https://github.com/OpenUnison/openunison-cli
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.1-macos.zip
    sha256: 56eb4b7e2721e05fa52894c856b0ab111be008026e76f8360100c6fde8e19a1f
    bin: openunison-cli
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.1-macos-arm64.zip
    sha256: e73d22a59dfe7a2b2314ee98240b7124df92d03a12372c888a8a5f016e9ab151
    bin: openunison-cli
  - selector:
      matchLabels:
        os: linux
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.1-linux.zip
    sha256: 008c1fd208fd87c09440324273ad77d81390f629a126970f0f73990acb10ba95
    bin: openunison-cli
  - selector:
      matchLabels:
        os: windows
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.1-win.zip
    sha256: 84f43cfb102a8ba8e153a6789135a35c16304deca06b48fcacdb8a04bd9bd2db
    bin: openunison-cli.exe
  shortDescription: "Login to a kubernetes cluster via OpenUnison"
  description: |
    kubectl exec plugin that will launch a browser to authenticate you 
    without having a pre-existing kubectl configuration file.  The first
    time you execute this plugin, include the host of your OpenUnison 
    server and the plugin will launch a browser and authenticate you.  As
    you work with kubectl it will keep your short-lived tokens updated and
    if they expire, automatically re-launch a browser window to authenticate
    you.