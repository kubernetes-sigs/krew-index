apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: openunison-cli
spec:
  version: v1.5.0
  homepage: https://github.com/openunison/openunison-cli
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.0-macos.zip
    sha256: 836e024293e80faf295232a2038dd070774fdb46c8aae3bbb697a44bb49e23ed
    bin: oulogin
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.0-macos-arm64.zip
    sha256: 0da0d9fc689151d659aab3a77dc6be4c2a706a5b9d42bf9553062a5e3dbd46fa
    bin: oulogin
  - selector:
      matchLabels:
        os: linux
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.0-linux.zip
    sha256: 76ba599987140b75bc080b13f6dbddc33310568a27e298d84f9a358578a9a9e5
    bin: oulogin
  - selector:
      matchLabels:
        os: windows
    uri: https://nexus.tremolo.io/repository/openunison-cli/openunison-cli-v1.5.0-win.zip
    sha256: 76b59e7a7afbc620fa79d5ceedeb764fd6ad1188817397cf73398e867fcb55d7
    bin: oulogin.exe
  shortDescription: "Login to a kubernetes cluster via OpenUnison"
  description: |
    kubectl exec plugin that will launch a browser to authenticate you 
    without having a pre-existing kubectl configuration file.  The first
    time you execute this plugin, include the host of your OpenUnison 
    server and the plugin will launch a browser and authenticate you.  As
    you work with kubectl it will keep your short-lived tokens updated and
    if they expire, automatically re-launch a browser window to authenticate
    you.