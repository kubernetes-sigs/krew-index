apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: outagedeck
  annotations:
    artifacthub.io/category: monitoring-logging
    artifacthub.io/displayName: OutageDeck dependency status
    artifacthub.io/keywords: |
      - cloud status
      - incident response
      - kubernetes
      - monitoring
      - official status feeds
      - saas status
      - sre
    artifacthub.io/license: MIT
    artifacthub.io/links: |
      - name: homepage
        url: https://outagedeck.com
      - name: repository
        url: https://github.com/outagedeck/kubectl-outagedeck
      - name: support
        url: https://github.com/outagedeck/kubectl-outagedeck/issues
    artifacthub.io/provider: OutageDeck
    artifacthub.io/readme: |
      Check whether cloud and SaaS dependencies behind Kubernetes workloads
      are reporting incidents. OutageDeck normalizes official provider status
      feeds and complements cluster and synthetic monitoring.

      The plugin checks explicit provider slugs without cluster access, or
      discovers dependencies from `outagedeck.com/providers` annotations on
      Deployments, StatefulSets, and DaemonSets. Annotation discovery is
      read-only, resource names never leave the machine, and API failures are
      never reported as operational. The `alerts` command turns either source
      into a prefilled managed-alert setup link without sending cluster data.
spec:
  version: v0.1.1
  homepage: https://github.com/outagedeck/kubectl-outagedeck
  shortDescription: Check external dependencies for provider incidents
  description: |
    Checks whether cloud and SaaS dependencies behind Kubernetes workloads
    are reporting incidents in their official status feeds. Provider slugs can
    be supplied directly, or discovered from annotations on Deployments,
    StatefulSets, and DaemonSets. Discovery is read-only and resource names,
    labels, kubeconfig data, and cluster credentials stay on the user's machine.
    The plugin supports namespace, all-namespace, label-selector, context,
    kubeconfig, JSON-output, timeout, and severity-threshold options. Its alerts
    command builds a prefilled setup link from named or discovered providers.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_darwin_amd64.tar.gz
    sha256: 06a7764f0afad702bb1f9485ebe942e7500e307df973ada89867420810ee30c3
    files:
    - from: kubectl-outagedeck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_darwin_arm64.tar.gz
    sha256: 65b87700c9b47751f6a99654c140adaf1fbc320fedb8dbe0803c076284b12478
    files:
    - from: kubectl-outagedeck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_linux_amd64.tar.gz
    sha256: 7223133df9bb876341dcd59c4be0ff2b9da0be6e91bec5c0722d27ad33777ef4
    files:
    - from: kubectl-outagedeck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_linux_arm64.tar.gz
    sha256: f384f0a01f02d7397f6a02411b1932290e5a2e9301dbc0e684137145759fd3fe
    files:
    - from: kubectl-outagedeck
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_windows_amd64.zip
    sha256: 6a74f8227151b5a07fd6aa6d5ddca3c81a2d8eb2e83c11d9de2a48851ebb8478
    files:
    - from: kubectl-outagedeck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/outagedeck/kubectl-outagedeck/releases/download/v0.1.1/kubectl-outagedeck_windows_arm64.zip
    sha256: 4285dc7c750a892dbe10c3f2e12c0a3c5f631b8e4672d13c4548b4176c9c89ef
    files:
    - from: kubectl-outagedeck.exe
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-outagedeck.exe
