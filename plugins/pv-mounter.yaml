apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pv-mounter
spec:
  version: v26.37.0
  shortDescription: Mount PVC locally using SSHFS or NFS
  homepage: https://github.com/fenio/pv-mounter
  description: |
    Plugin that allows to mount PVC locally using SSHFS or NFS.
    Use --backend nfs for the NFS backend (NFS-Ganesha).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.37.0/pv-mounter_v26.37.0_linux_amd64.tar.gz
    sha256: f8c11318e09001ba73553cd4bce2a89669e67fb97ecd653cfd52df83c544c1fa
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.37.0/pv-mounter_v26.37.0_linux_arm64.tar.gz
    sha256: 2c62f20a985133281d199f253843b58aac6c210a07833d54477fc3d8dbdb5b00
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.37.0/pv-mounter_v26.37.0_darwin_amd64.tar.gz
    sha256: 78c676ab96b8d670b87a7da06955d9d062dff6c958a98721e13d6c25b6b07d11
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.37.0/pv-mounter_v26.37.0_darwin_arm64.tar.gz
    sha256: c74e00ce303fe133a203fc673edcaf90ea0e8af7311e74e5057adc234f29f097
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
