apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pv-mounter
spec:
  version: v26.32.0
  shortDescription: Mount PVC locally using SSHFS or NFS
  homepage: https://github.com/fenio/pv-mounter
  description: |
    Plugin that allows to mount PVC locally using SSHFS or NFS.
    Use --backend nfs for the NFS backend (NFS-Ganesha).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.32.0/pv-mounter_v26.32.0_linux_amd64.tar.gz
    sha256: a049fc12ba86862a7d34711c41d983c69944207635f5f76f3d34b6102ca81c2f
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.32.0/pv-mounter_v26.32.0_linux_arm64.tar.gz
    sha256: fba616c089ffd278d5f29f2242b3e50e3a4c558ca14c856e4686d34a4487f666
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.32.0/pv-mounter_v26.32.0_darwin_amd64.tar.gz
    sha256: 9eae37dbcce9e6546d05cdc41479fee24f21f72065e7a2dd510d2ecdc9761134
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.32.0/pv-mounter_v26.32.0_darwin_arm64.tar.gz
    sha256: 96401fcf9355ba1b7af24d54b3daebf7c365cf137d7847d55ef3667cf50f5709
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
