apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pv-mounter
spec:
  version: v26.48.0
  shortDescription: Mount PVC locally using SSHFS or NFS
  homepage: https://github.com/fenio/pv-mounter
  description: |
    Plugin that allows to mount PVC locally using SSHFS or NFS.
    Use --backend nfs for the NFS backend (NFS-Ganesha).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.48.0/pv-mounter_v26.48.0_linux_amd64.tar.gz
    sha256: aeb14b73991b76ec389fe84953de0bda6551e3cb9811b4f9006ff48d68d937a3
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.48.0/pv-mounter_v26.48.0_linux_arm64.tar.gz
    sha256: f9bc8fb44c4865a6f01501d953e82c65a5561db1c58b427755bd6545c0bff9ac
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.48.0/pv-mounter_v26.48.0_darwin_amd64.tar.gz
    sha256: a40fb43c4d7d15ecccb4673477078ac8d54e6c2c556d18a0d154905e5fd0acce
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.48.0/pv-mounter_v26.48.0_darwin_arm64.tar.gz
    sha256: 3ae360ff5e7069cce57515ada32e331f78777fe88d33f49a88e4d0d78ebf3527
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
