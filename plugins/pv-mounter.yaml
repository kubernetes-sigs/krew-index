apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pv-mounter
spec:
  version: v26.34.0
  shortDescription: Mount PVC locally using SSHFS or NFS
  homepage: https://github.com/fenio/pv-mounter
  description: |
    Plugin that allows to mount PVC locally using SSHFS or NFS.
    Use --backend nfs for the NFS backend (NFS-Ganesha).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.34.0/pv-mounter_v26.34.0_linux_amd64.tar.gz
    sha256: ab057956cd87af19a16894da47f0505798da8a09c06298469746f4152b22796d
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.34.0/pv-mounter_v26.34.0_linux_arm64.tar.gz
    sha256: a9d542c0e178d1ee2a3c9874661d630a519c22b84ec56276f60fd20eb26c169c
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.34.0/pv-mounter_v26.34.0_darwin_amd64.tar.gz
    sha256: 561e5a74e8ad6147276084b020af522d6bc2e4400f9db0251777c0847d4a1e64
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.34.0/pv-mounter_v26.34.0_darwin_arm64.tar.gz
    sha256: a95e89cc613f8c6a0afe21c2888ebe795948b821c888e6c3755d25ec49d8afe6
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
