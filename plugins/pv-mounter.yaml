apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: pv-mounter
spec:
  version: v26.41.0
  shortDescription: Mount PVC locally using SSHFS or NFS
  homepage: https://github.com/fenio/pv-mounter
  description: |
    Plugin that allows to mount PVC locally using SSHFS or NFS.
    Use --backend nfs for the NFS backend (NFS-Ganesha).
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.41.0/pv-mounter_v26.41.0_linux_amd64.tar.gz
    sha256: 8fd0368db35b7fb607d60ebca7abc7dbd865d4b8bf34999a1a56f374be1a4f76
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.41.0/pv-mounter_v26.41.0_linux_arm64.tar.gz
    sha256: ae44564e7ade04fc7fafb54e6769668c32de0830859909a6d4610a0ca6b97d26
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.41.0/pv-mounter_v26.41.0_darwin_amd64.tar.gz
    sha256: 2e48762769da97dd3a5cfae94e90fc7419db69dce6b747595dab37d3b30f0dde
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/pv-mounter/releases/download/v26.41.0/pv-mounter_v26.41.0_darwin_arm64.tar.gz
    sha256: 092931c8df0f5aa6006f574b889459bbd13ce4e9e8bfd784e600adf3c627e22c
    files:
    - from: "./pv-mounter"
      to: "."
    - from: LICENSE
      to: "."
    bin: "pv-mounter"
