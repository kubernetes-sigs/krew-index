  homepage: https://github.com/hown3d/kubectl-pwru
  shortDescription: Run pwru for pods in your cluster
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/hown3d/kubectl-pwru/releases/download/v0.0.1/kubectl-pwru_linux_amd64.tar.gz
    sha256: 794e8f1a37cb6695c295672cab085c6b4b43d2fa55d75080965bb819d8545651
