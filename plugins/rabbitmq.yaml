apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.22.4
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.4/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: 492892c371e0d1892b02d96d7c5d9c79258693b9e2da8d32b16d1174feaba6c2
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.4/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: c069ea0adbfc0eca29d1374ae697ad3f0d0a5ecf08717ea1c3a35f8d837246ca
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.4/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: 939bb612839fc7919ee9f4a207bb63fd8d78783fd4314047e5885159e0dd9a4c
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.4/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: 988bf2e14fcdf374c540bc1f8a2b598265c1ddf1d71f56f49099de45410f6d69
    bin: kubectl-rabbitmq-linux-arm64
