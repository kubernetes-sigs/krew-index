apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.22.5
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.5/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: acc24997ff5d322402eb4fae5fa069bf9c900fcc02398caa3888e9c360a5934d
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.5/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: 013f170f6b15b7fcbc05e392d216999fd76e7561281934af030a97fe67d91cd9
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.5/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: 4769898fd28fb1763d70f77a5b495d9105f3323eccc3895f99301d8448e2989b
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.22.5/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: ca9b5950d26e95d4cd52753e513a5139953ddb52f8c2e48e9ec4af4df066a0b5
    bin: kubectl-rabbitmq-linux-arm64
