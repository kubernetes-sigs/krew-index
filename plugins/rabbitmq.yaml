apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.23.3
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.3/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: 63831e898fc5d23866bb2401d1816f8aaa97cae649f96a2cbc6239490eada3e4
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.3/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: bfa64c4b152a399038c92d4b2e95eadcb585f09ab4259555ec495acb5663e8a1
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.3/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: 787ed405632a54f43c5832ba85e1ac6d464b9af8d489c56ec1238072c2e94051
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.3/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: 6fcf7500c6f3a562cd072dd6406eab555eacdb23bb4b5c37ca9b8cf9f5c08a6d
    bin: kubectl-rabbitmq-linux-arm64
