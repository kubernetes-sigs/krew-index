apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.23.1
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: 1b6570a4fbf184fe7826bfc4f5c5de593202fdbb3fadcf7d02a668b5fa45bb8d
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: a196fb1adfc54271e66c7fc928d3bc7b70252cfdc6e2ce2b35f99fa8d4219791
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: ae4c9271e21620e3a35bc8b06a541e1749b034fda8c85c9e5d8268372c0f5aff
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.1/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: 02e25ac0205a0d603342aaa7d6e5f5f46ef7372014e21fc09cdbd1d76b306dd2
    bin: kubectl-rabbitmq-linux-arm64
