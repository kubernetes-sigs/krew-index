apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.23.0
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.0/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: 9817d5ba07314dbdbfb15d81022177920a3f16484b17d76e3f26595afc3d1567
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.0/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: 123c932a55130fce36d2fc5b76345bf8ae481e096fa8074e52d0515e7b48a976
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.0/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: 9ea88a057d276e4986768dcd2c7b1c64d7ad00ea4b3e364a5f221f2c22a68e4f
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.0/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: 023d47ebc80c0551da63c726f05b589cde2d50a4054f21c82e096b26c88749ca
    bin: kubectl-rabbitmq-linux-arm64
