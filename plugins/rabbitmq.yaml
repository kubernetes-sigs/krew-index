apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rabbitmq
spec:
  homepage: https://github.com/rabbitmq/cluster-operator
  shortDescription: Manage RabbitMQ clusters
  version: v2.23.2
  description: |
    A plugin providing utilities to operate RabbitMQ clusters deployed
    by the RabbitMQ cluster operator.
  caveats: |
    This plugin requires the RabbitMQ cluster operator to be installed.
    To install the RabbitMQ cluster operator run `kubectl rabbitmq install-cluster-operator`.

    `tail` subcommand requires the `tail` plugin. You can install it with `kubectl krew install tail`.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.2/kubectl-rabbitmq-darwin-amd64.tar.gz
    sha256: b591e6af2c173e9c777a41581b3576baa801cf882ce077714e097439fb93d9b0
    bin: kubectl-rabbitmq-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.2/kubectl-rabbitmq-darwin-arm64.tar.gz
    sha256: 6ba5a4ebb6f0c578ed7efa189e6b28ee4be42580f5193fe930298133969dc866
    bin: kubectl-rabbitmq-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.2/kubectl-rabbitmq-linux-amd64.tar.gz
    sha256: fea1440811dd5b2b90bcd0f7f3a2d3526226bf381166bebd6144184627a4be75
    bin: kubectl-rabbitmq-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/rabbitmq/cluster-operator/releases/download/v2.23.2/kubectl-rabbitmq-linux-arm64.tar.gz
    sha256: e46b747bb01eec462561e9e92793b2862f2186ab21ae64af1c8ad07b70860799
    bin: kubectl-rabbitmq-linux-arm64
