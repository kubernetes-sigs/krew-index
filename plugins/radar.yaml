apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.12.1
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.1/radar_v1.12.1_darwin_arm64.tar.gz
    sha256: 6afe0769ec59e5201c1f5e6248b213360a0c6a6af949b424527a869f5219f74c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.1/radar_v1.12.1_darwin_amd64.tar.gz
    sha256: cb05e29bf3fedb5212c969d313041a6dbaee6e473d87651491c5848a4eb05ee5
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.1/radar_v1.12.1_linux_amd64.tar.gz
    sha256: dfacea9459bf6e94669aa0ca6763a27c4aaa02a9dfcc3dd06bcfaf0b7b74248e
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.1/radar_v1.12.1_linux_arm64.tar.gz
    sha256: 401b1303428a31bd50f1d7abe4ddad1d72d88cba713305cde80eefbe0c67efe0
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.1/radar_v1.12.1_windows_amd64.zip
    sha256: 932304a9509f57a5acce2e29a00a586c59823ba748530475218a7265219b4470
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
