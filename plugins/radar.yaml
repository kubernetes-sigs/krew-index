  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.4/radar_v1.21.4_windows_amd64.zip
    sha256: f3bd8357eef35b27be504dd79e8d4e44f337fe404b8504304f1f88cb833e64f8
    files:
