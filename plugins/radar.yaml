apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.21.5
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.5/radar_v1.21.5_darwin_arm64.tar.gz
    sha256: a4a7c3316d40c10afb3834e5ccc78f06ea2e72db2a6f11813a1d7d035f6a8335
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.5/radar_v1.21.5_darwin_amd64.tar.gz
    sha256: eb225f0a6e68d9002d14cfefdc25f869b33b14e334c4d2b8ea41ce69795a2d8e
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.5/radar_v1.21.5_linux_amd64.tar.gz
    sha256: 010296d08f15ca68842ca3551b7eaa79090f3f6e8b98e873d6072518eb6fc02b
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.5/radar_v1.21.5_linux_arm64.tar.gz
    sha256: ac441c506ea6d102786e0a72cd69b1eed22b2f3ebded74b2b8a84a57c7a014ca
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.5/radar_v1.21.5_windows_amd64.zip
    sha256: 6704039ebfd443b9a4a112fa356398fede93c10605ac0cfdcf3c82d3982a6cf6
    files:
    - from: kubectl-radar.exe
      to: .
