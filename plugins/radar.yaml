apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.15.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.15.0/radar_v1.15.0_darwin_arm64.tar.gz
    sha256: af0767ffffdf5d616c1a2d03862a95bffa157d1cbe34ad4430a63b68c351f7df
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.15.0/radar_v1.15.0_darwin_amd64.tar.gz
    sha256: 4508622020912d86db14de23c840ccba0652b29b3c5714cf5338aa3ae5e1c87c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.15.0/radar_v1.15.0_linux_amd64.tar.gz
    sha256: c2026f7bbb3c593cfde4d0d4b9aa2b3f5a35030c323a90119b4a0ba930d1dffe
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.15.0/radar_v1.15.0_linux_arm64.tar.gz
    sha256: 0f114ef914e029d0e07e29c2b8955a535fd8678c4ac349d428a061e39e768530
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.15.0/radar_v1.15.0_windows_amd64.zip
    sha256: dc4360858f19d8fb75072c83458600142d9db43f1e4c3c5c98a48e50514f6371
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
