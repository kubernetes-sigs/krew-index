apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.18.3
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.3/radar_v1.18.3_darwin_arm64.tar.gz
    sha256: d4278ef3949acd630c0c18e9a77730260608219a7e0bd3ee1625fdaa19f9f564
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.3/radar_v1.18.3_darwin_amd64.tar.gz
    sha256: 6a3b4a66d3ce1dbbeff527fb4d2d3e4a2a9a374d08ae46a263543986a8be9b19
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.3/radar_v1.18.3_linux_amd64.tar.gz
    sha256: c256051823591526d7836447bb33f9d5fe654876bcdb0f7ef2eaeb9977081842
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.3/radar_v1.18.3_linux_arm64.tar.gz
    sha256: 0095511db6a7d45caf6b8099182ea6bbe2254baa421dfe076044b163c9cf6d45
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
