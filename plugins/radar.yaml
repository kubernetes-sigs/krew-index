  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.8.7/radar_v1.8.7_windows_amd64.zip
    sha256: 7c7192ce3905f8d3f585c9815ee8d4cabc137b2d909fb7b1f472a20350e701ed
    files:
    - from: kubectl-radar.exe
      to: .
