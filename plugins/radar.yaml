apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.11.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.11.0/radar_v1.11.0_darwin_arm64.tar.gz
    sha256: bf949c9c7f388766c43eeaccee6faccdd267987336523c0bac82470a651cb868
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.11.0/radar_v1.11.0_darwin_amd64.tar.gz
    sha256: ffdadfee6686669d599f980bbe442a78947d9eb1c2374b5839b47939936a4f77
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.11.0/radar_v1.11.0_linux_amd64.tar.gz
    sha256: d333e2065b430331358ce94e593ed8b8df098c113bb13cfcb9ff3e85bbe68961
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.11.0/radar_v1.11.0_linux_arm64.tar.gz
    sha256: 3d11ecb8abdca4350898a88eaddf81a987812b77981bbd3c0d85d3a7635e5ab5
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.11.0/radar_v1.11.0_windows_amd64.zip
    sha256: 6c248f71a76903cc92daae5a7c76e923eb9499434f6ad4116fc25a96c31ee4dd
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
