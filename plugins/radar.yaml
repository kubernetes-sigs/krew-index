apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.12.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.0/radar_v1.12.0_darwin_arm64.tar.gz
    sha256: 65f355be02aab530b20498d83f0f542fc46010a660123c8a356f2b1d7f39cbf7
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.0/radar_v1.12.0_darwin_amd64.tar.gz
    sha256: fc9f036a3e5f4f1ea0233a4826e02b1e87339750133a0c6bd6734a302be91ddc
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.0/radar_v1.12.0_linux_amd64.tar.gz
    sha256: ae4cc48e1f93a5c9b9bd8b1848a23ce8d3a785aa47538e6a8389c2563e53e504
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.0/radar_v1.12.0_linux_arm64.tar.gz
    sha256: 156383af1cd768b8fef6447bb039785b1129ca3b812b6cbbd5ac01fa7b59137f
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.12.0/radar_v1.12.0_windows_amd64.zip
    sha256: 2bdb273e9fef7cdd9b0edd2a228e2feda2a1a52329b644b28512bcc4130cf8ef
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
