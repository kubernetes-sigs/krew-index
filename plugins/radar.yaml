  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.0/radar_v1.14.0_windows_amd64.zip
    sha256: 4a8984e45a55f8640fa7cfe1b087614ace5789838b5b53daacb954cab8e792bf
    files:
