  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.2/radar_v1.21.2_windows_amd64.zip
    sha256: 992ff7441067308ee68097c23fa0592cfb7dbf7d529b56e73de485a9ab57ea27
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
