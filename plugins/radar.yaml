apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.20.3
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.20.3/radar_v1.20.3_darwin_arm64.tar.gz
    sha256: 3a00e038f7ed327d5a81cd6aca4a989280012bb0187e03d25c7793107737d0ec
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.20.3/radar_v1.20.3_darwin_amd64.tar.gz
    sha256: f2a9ea72739e430eb3c42308ea1f13c660fba077d6164f0d19dcd6c8450f01b2
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.20.3/radar_v1.20.3_linux_amd64.tar.gz
    sha256: c762b8392d1e6f44c7b9076cd2fed6d790452235d72c0035a047549f7f104c6b
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.20.3/radar_v1.20.3_linux_arm64.tar.gz
    sha256: 1d653b7b7d1c9883ce63aa39660f5fa0da39e4b4532dacbfaa6e26642ae94615
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.20.3/radar_v1.20.3_windows_amd64.zip
    sha256: a34252b85ee4e3b1fba8992c569edbf147985f74864d328339584750979424f1
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
