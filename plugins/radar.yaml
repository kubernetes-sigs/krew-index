apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.9.2
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.2/radar_v1.9.2_darwin_arm64.tar.gz
    sha256: 67b1aca0831acf34d96bd70553f1dcdb972d453555b3f87f64f211f4c111c56f
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.2/radar_v1.9.2_darwin_amd64.tar.gz
    sha256: 54fc12fc53d384973fa69bea79e1a0a8ab105aca2bc8e466775df00871419868
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.2/radar_v1.9.2_linux_amd64.tar.gz
    sha256: 4e8c06572aea132b990a5659782c56e624d8dbe5bc809dbbd77566fe2a47f34c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.2/radar_v1.9.2_linux_arm64.tar.gz
    sha256: 17a878c29024d3e8699fb2ac98911c04c490520db409dbf9905453542ea11942
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.2/radar_v1.9.2_windows_amd64.zip
    sha256: 1ae9343461c10c3014cbcea6d7ecc8a7a34c75a9093b72bf0fa464aa70c9766d
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
