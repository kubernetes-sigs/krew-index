apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.10.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.10.0/radar_v1.10.0_darwin_arm64.tar.gz
    sha256: 2939ed14eee10a98b24acbd227d83e84bd07e42716b518e3ebf6f4b75e34bc15
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.10.0/radar_v1.10.0_darwin_amd64.tar.gz
    sha256: 0ebdf0fe993843440057c2e0a17aadd6328c1591fba2b4ce6a4f63deab258dc5
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.10.0/radar_v1.10.0_linux_amd64.tar.gz
    sha256: 7612ab4d45b711bc37b21827bcfa776de2488fb633ae049bfe632d9dc3f00c5e
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.10.0/radar_v1.10.0_linux_arm64.tar.gz
    sha256: 5fe807e45a9e5834063fa5c333d20b95fc151eec71e8cffa6f48651528394adc
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.10.0/radar_v1.10.0_windows_amd64.zip
    sha256: 9965cad03300ad319405c2d33ec99faec84f3699d43b2b85530a87fa6782d1d2
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
