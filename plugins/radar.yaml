apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.9.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.0/radar_v1.9.0_darwin_arm64.tar.gz
    sha256: 16a5c1ae588c317921c5cd5da896c4a3bcefb462b946948274fcf6f2d5abe674
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.0/radar_v1.9.0_darwin_amd64.tar.gz
    sha256: bad6831230f692ff2620c811669e9362daf8ef07481d6728914a56ca0514bed8
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.0/radar_v1.9.0_linux_amd64.tar.gz
    sha256: 71c02d48be38027813b3e4a4403a1ad6e65103d8e0b8de421933a159aefbc84c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.0/radar_v1.9.0_linux_arm64.tar.gz
    sha256: c98342793816ef19cb6b904e6929bbcb3f92045b2adb4f525785a991fa58988c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.0/radar_v1.9.0_windows_amd64.zip
    sha256: fcdfc57440fee350f0107b893e91845afd840d4db37a68c955f1c6c4ea915b16
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
