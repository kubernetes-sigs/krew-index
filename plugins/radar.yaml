apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.13.1
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.13.1/radar_v1.13.1_darwin_arm64.tar.gz
    sha256: fa16f0beb2c96686891de4cacb46223e286688e5cd09399a2e30f1063623cdce
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.13.1/radar_v1.13.1_darwin_amd64.tar.gz
    sha256: c8c63899cbed39d3a7b91993b04c8c9b5dba7a42c537c164faa58f06973bb828
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.13.1/radar_v1.13.1_linux_amd64.tar.gz
    sha256: ede350edc66960b756ccd1b6b7c14bafea0578fc0a300ab5565f2e5fc952c483
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.13.1/radar_v1.13.1_linux_arm64.tar.gz
    sha256: ac9644b0bf1410accf46290edf5955f49877cfe36b7711e9fa879262a2b7e714
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.13.1/radar_v1.13.1_windows_amd64.zip
    sha256: 804e60eddcfd4034f7e366b3cf0050c84a012d63ca9bca3bf7144d9e8a13e9bc
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
