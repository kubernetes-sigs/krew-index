apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.14.1
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.1/radar_v1.14.1_darwin_arm64.tar.gz
    sha256: 419c425dabba713c8bd251c9b22b5557d7b02ca4db81bb9879fffd4b057b6dec
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.1/radar_v1.14.1_darwin_amd64.tar.gz
    sha256: 1150987eda6e587dfd85936853c7da1caccbe268d7e8378a5772ef7f6d8e396d
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.1/radar_v1.14.1_linux_amd64.tar.gz
    sha256: 7588ce4bb29b62e1526a852e577401b436835d88ce0a6fd48e9fd20339a665be
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.1/radar_v1.14.1_linux_arm64.tar.gz
    sha256: c51c53a19bebd43692ba82a8ab571dfca071b597f44365cab2eca2a9dcecee44
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.14.1/radar_v1.14.1_windows_amd64.zip
    sha256: 3d43270a7806cbc4eea2f928856f3a099ae5d16577fc535a40bfffb0f1014839
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
