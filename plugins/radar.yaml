apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.21.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.0/radar_v1.21.0_darwin_arm64.tar.gz
    sha256: cf2efed980dada75b2509a7bb1e1bbad0185e55ed1c76a08f40bf8257b8590f5
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.0/radar_v1.21.0_darwin_amd64.tar.gz
    sha256: c24fb061aa017f2c350d6be6c517c4f2f84edc51ebe86abc5c1c5876b0c7eebb
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.0/radar_v1.21.0_linux_amd64.tar.gz
    sha256: 2296e54b31f1b675f52fe54684d6021f3d2ff5a3cf30652b9583741f295d7f8d
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.0/radar_v1.21.0_linux_arm64.tar.gz
    sha256: f620969f6b4309a310da79eb119e936370998c6ba3d44d4c1c9372d4bf3f9ab8
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.21.0/radar_v1.21.0_windows_amd64.zip
    sha256: 5877590350c7bb5bbabd1f30c9771271ddabcf37067d6cb9ab97fb27ad86961f
    files:
    - from: kubectl-radar.exe
      to: .
