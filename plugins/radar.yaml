apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.18.2
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.2/radar_v1.18.2_darwin_arm64.tar.gz
    sha256: 1cdc994f0fe703dabbf1a97ed9cf25ef1a105b39b6daeb99272b71f1f52c79b8
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.2/radar_v1.18.2_darwin_amd64.tar.gz
    sha256: 37b6f36e530dd3305795fa7a0c5731004db71d8fec47d087434ac578cff07d24
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.2/radar_v1.18.2_linux_amd64.tar.gz
    sha256: a1f87afcd8a81487cfaf3e872eba7b3183e8d1656acde0a8d18a3af6d28f4e4f
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.2/radar_v1.18.2_linux_arm64.tar.gz
    sha256: 456ca35dd70ab61c5ae03b3e130c20c6b7607fc8637ae94587d33fdaf9673270
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.18.2/radar_v1.18.2_windows_amd64.zip
    sha256: a09e1931593b6296361bde1dc03227cc2625c2df6a98a141666e173b1358105e
    files:
