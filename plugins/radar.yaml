apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.22.0
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_darwin_arm64.tar.gz
    sha256: f3dd37d19d11ccbe04b1fe1ed389d9c5c39b39196389fe3bd32b07a381d77be7
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_darwin_amd64.tar.gz
    sha256: 6464479c64b3d18012ddea93766615b5ca66324fa3c8e4d99a102090c7bd6603
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_linux_amd64.tar.gz
    sha256: 0ec9251e06214992641a068da13a9ce25b57e495366df26c45cace2ecae1339a
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_linux_arm64.tar.gz
    sha256: 34a4ebb1e1cd8c6b321f60960d965882b8a86d13493900a19eea0e4deeb813b7
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.0/radar_v1.22.0_windows_amd64.zip
    sha256: f1e8e515967b2eaf73fc31830fb006bdc0e495333f3f631a1ecc53db676808a1
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
