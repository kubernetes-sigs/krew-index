apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.9.1
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.1/radar_v1.9.1_darwin_arm64.tar.gz
    sha256: 6a666353876444b90d61b06958503f6d21147057f3db29ab3ce3e20976698fd0
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.1/radar_v1.9.1_darwin_amd64.tar.gz
    sha256: 76ff44e41a63e272d1d6f591aa58e118c24a6e90f7185f22c67008cd46899f67
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.1/radar_v1.9.1_linux_amd64.tar.gz
    sha256: 12709cdf310ee4662e54691265ef319fa92c05f585c6fbf79fb9ec1aaba69e1f
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.1/radar_v1.9.1_linux_arm64.tar.gz
    sha256: 23fe02e6aab8973e13a4daa91a9276bb63d6c98a87eb5426610a17600bfcbd1e
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.9.1/radar_v1.9.1_windows_amd64.zip
    sha256: e19a2a6296621d6f9ca60ccd8ae1d3868ed0eb9d971baf86dd08bdf9d4aaea57
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
