apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: radar
spec:
  version: v1.22.1
  homepage: https://github.com/skyhook-io/radar
  shortDescription: Cluster dashboard with topology and traffic maps
  description: |
    Radar provides real-time visibility into your Kubernetes cluster.

    Features:
    - Topology visualization of resources and their relationships
    - Service traffic maps showing network connections
    - Event timeline with resource change history
    - Resource browser with YAML editing
    - Helm release management
    - Pod logs and terminal exec
    - Port forwarding

    Local-first. No account required. No cloud dependency.
  caveats: |
    This plugin opens a web UI in your browser by default.
    Use --no-browser to start the server without opening a browser.
  platforms:
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.1/radar_v1.22.1_darwin_arm64.tar.gz
    sha256: 15f11d8554958c4a34aed6f6ce7ca8441d0c2ed110a06a20af718515db048cde
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.1/radar_v1.22.1_darwin_amd64.tar.gz
    sha256: dd27365f8079f1e162fc077e445b1b9bcfe6edb0fbd0a7a368bb36ffe6dbc86c
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.1/radar_v1.22.1_linux_amd64.tar.gz
    sha256: 6147479f11fa69f13e68294a47f3dd6913b6117120aee940051d10591ea163ad
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - bin: kubectl-radar
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.1/radar_v1.22.1_linux_arm64.tar.gz
    sha256: a9f3c1a072386a1eb055e5e1ab0b32e476d80c096c17f8e1a8017a8ccd4df2fd
    files:
    - from: kubectl-radar
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - bin: kubectl-radar.exe
    uri: https://github.com/skyhook-io/radar/releases/download/v1.22.1/radar_v1.22.1_windows_amd64.zip
    sha256: 35fd3d43874e83a74f1f49b75564177bda73a0079c3e9cbed54fe07c023ba543
    files:
    - from: kubectl-radar.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
