apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly-leaky
spec:
  version: v0.7.2
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Read-only wrapper that shows secret values
  description: |
    The leaky profile of kubectl-readonly: the same guardrail against writes and
    exec, and secret values are shown. get secret -o yaml, get --raw on secret
    paths and config view --raw print credentials.

    Use it when you need to read a secret value and still want the write
    guardrail. Install the readonly plugin to keep secret values hidden.
    Does NOT protect against deliberate bypass attempts.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_linux_amd64.tar.gz
    sha256: ba78a16386c492720ce1959e6b51fa7185340962331fef53556dd7b4831dd858
    bin: kubectl-readonly-leaky
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_linux_arm64.tar.gz
    sha256: e9ad9fd94ff39f04112d31b7e72139dbbc273211df86fb771cbcfff5752d02b6
    bin: kubectl-readonly-leaky
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_darwin_amd64.tar.gz
    sha256: 05fdbfe68ad08c879b1ae070778c1daece680b95f572437427c297093c3feae9
    bin: kubectl-readonly-leaky
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_darwin_arm64.tar.gz
    sha256: 913b4f5e9d5f8c4c696324e84f1374cfa0ece4e9da7b90b94539f064174c5e8e
    bin: kubectl-readonly-leaky
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_windows_amd64.zip
    sha256: 34cf2eb5fdedfd6e89ed43e5bf56a17da9398f1881ffa11e0677d912f3cb1fcc
    bin: kubectl-readonly-leaky.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-leaky_0.7.2_windows_arm64.zip
    sha256: dc28c4ed68f2a8b353173980cc3c4d4056026333a5d4aa68691f1466e7c45ae7
    bin: kubectl-readonly-leaky.exe
