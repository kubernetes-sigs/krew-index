apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly-strict
spec:
  version: v0.7.2
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Read-only wrapper with a sanitized environment
  description: |
    The strict profile of kubectl-readonly: the same read-only policy (writes,
    exec and secret values blocked), and kubectl runs without
    KUBECTL_EXTERNAL_DIFF (runs a program on kubectl diff) and with kuberc
    disabled (KUBERC=off).
    Other variables pass through, so credential plugins and proxies work.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Does NOT protect against deliberate bypass attempts.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_linux_amd64.tar.gz
    sha256: 679960fead6caa46ea0996f496c10d245bfd84c0d70bab70ecc75780760e2377
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_linux_arm64.tar.gz
    sha256: 8bd452ad3daf736a8d03987a9dc837c7692dcd948d96fc530d74cbd8ad1a2035
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_darwin_amd64.tar.gz
    sha256: eb996f4352b0eb0b0296a4eb6baf81ff655296cbdddefe608d66000e1ab4b25f
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_darwin_arm64.tar.gz
    sha256: d322392a075a82c171b78152cb6f1a5fcc4fb03260f69fe89e6c73c97af4a9ef
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_windows_amd64.zip
    sha256: e52422509f1896526064871e594d71f0d6d0f86f6b931eb38cc08d7823c33c1e
    bin: kubectl-readonly-strict.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly-strict_0.7.2_windows_arm64.zip
    sha256: ae883f0f9061b429331a1bf6874b1a19222592f7490ae7000be67fb629989a9c
    bin: kubectl-readonly-strict.exe
