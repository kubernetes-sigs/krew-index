apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly-strict
spec:
  version: v0.7.1
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Read-only wrapper with a sanitized environment
  description: |
    The strict profile of kubectl-readonly: the same read-only policy (writes,
    exec and secret values blocked), and kubectl runs without
    KUBECTL_EXTERNAL_DIFF (runs a program on kubectl diff) and with kuberc
    disabled (KUBERC=off).
    Other variables pass through, so credential plugins and proxies work.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Does NOT protect against deliberate bypass attempts.
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_linux_amd64.tar.gz
    sha256: cd7a5d7c8e6815aa5b118a1d660fdb5d4519256fd9ebed0452e206e15d0bec5d
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_linux_arm64.tar.gz
    sha256: c2de5713a1bcfd1f49b74e8b699e0b1653db53f4ca3f269d2210af58099d5fca
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_darwin_amd64.tar.gz
    sha256: 63e60aaf0005de8abf60a436d721c3b79c07b63e9368bacd5998c5b79ed85eeb
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_darwin_arm64.tar.gz
    sha256: e175fe69c7b585aa1afce945a3ad363ee8f074e1387a01deeb7c8c5091b4f57f
    bin: kubectl-readonly-strict
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_windows_amd64.zip
    sha256: f55f651a4f504665c57ff6cd55c9d6e4267bcdaba4f3eaf1087d916c68b246f7
    bin: kubectl-readonly-strict.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly-strict_0.7.1_windows_arm64.zip
    sha256: c3b532bce92ce8b687d96f1012247df838ec0ddfbda80ce026c6967839fc5191
    bin: kubectl-readonly-strict.exe
