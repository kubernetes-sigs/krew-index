apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.6.0
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Guardrail against accidental cluster changes
  description: |
    A kubectl wrapper that prevents accidental modifications. Allowed commands
    are passed through to kubectl in your PATH.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Also provides basic protection against leaking secret values
    to LLM context. Does NOT protect against deliberate bypass attempts.

    Examples:
    - Allowed: get pods, describe deploy, logs, top nodes
    - Blocked: delete pod, apply -f, exec, scale
    - Secrets: list allowed, but -o yaml/-o json blocked
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_linux_amd64.tar.gz
    sha256: d081dae93f281b0ef79fcfe66ec5a1ef5551835734220c3fd64e4ea1b9caa57d
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_linux_arm64.tar.gz
    sha256: a54228545ccce14b40a3678f5f3eb2652c3f57298a940b80b6bf4af3007dc699
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_darwin_amd64.tar.gz
    sha256: 2fe2d861733f6bc973b979ccb5f8525d8ecd85a31d73e071c8bf06ed0ec3be60
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_darwin_arm64.tar.gz
    sha256: 55b68e12fce3df9ffaedee4c48c06178a1950be4fe4950ca679f90e1c0f16d0e
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_windows_amd64.zip
    sha256: 5d42840a7c9ef2ea2dd3f8576c07e4f1a1439ee1842ea6a442a81c31bef8b169
    bin: kubectl-readonly.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.6.0/kubectl-readonly_0.6.0_windows_arm64.zip
    sha256: 9287ee23d7ee366c46bc6385d92fd003d1962a1aca0303c10c50f9b3f16bfb64
    bin: kubectl-readonly.exe
