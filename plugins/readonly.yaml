apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.7.2
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Guardrail against accidental cluster changes
  description: |
    A kubectl wrapper that prevents accidental modifications. Allowed commands
    are passed through to kubectl in your PATH.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Also provides basic protection against leaking secret values
    to LLM context. Does NOT protect against deliberate bypass attempts.

    Examples:
    - Allowed: get pods, describe deploy, logs, top nodes
    - Blocked: delete pod, apply -f, exec, scale
    - Secrets: list allowed, but -o yaml/-o json blocked
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_linux_amd64.tar.gz
    sha256: e01d4c7e5c32370a124ee03c6aea62612b14e58764a71507e94d3b88bfdc7f4c
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_linux_arm64.tar.gz
    sha256: e99581198fe1e8dfc3c508a0d3ccd6ecc5e9fabd980cade47d06f021c3b46e95
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_darwin_amd64.tar.gz
    sha256: bc5b3f7eb4226e88f1ba9360a5e15bd9fc019161826fa8a5f1ec02099272aa99
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_darwin_arm64.tar.gz
    sha256: f74e34bfbf0b7554e2eaf3d83cd5562d0d44873c0314574a81f4300225877ec6
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_windows_amd64.zip
    sha256: 81ce26d66d04ccdb1e62a493d7e1b680b1461a0583afb7b99ef6fb9ef497924d
    bin: kubectl-readonly.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.2/kubectl-readonly_0.7.2_windows_arm64.zip
    sha256: 38c6c95e841609fed5f1c2b49c27c7cd816f1943e321857c06850d7ccabc15b5
    bin: kubectl-readonly.exe
