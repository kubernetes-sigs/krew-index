apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.7.1
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Guardrail against accidental cluster changes
  description: |
    A kubectl wrapper that prevents accidental modifications. Allowed commands
    are passed through to kubectl in your PATH.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Also provides basic protection against leaking secret values
    to LLM context. Does NOT protect against deliberate bypass attempts.

    Examples:
    - Allowed: get pods, describe deploy, logs, top nodes
    - Blocked: delete pod, apply -f, exec, scale
    - Secrets: list allowed, but -o yaml/-o json blocked
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_linux_amd64.tar.gz
    sha256: d37009e4c28cb5731461bc55f7a58cacfa7ef53a6ea0689be28dfb87b58f5ddd
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_linux_arm64.tar.gz
    sha256: 03f23809ca3990d41d7b257ecb777b3293076a01065cf09c2d3645fd5becbbf4
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_darwin_amd64.tar.gz
    sha256: 79fe1b558df63be3025b5b8569698647201d32482998513cfaf6fe20c9150bde
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_darwin_arm64.tar.gz
    sha256: bb256f8562b27c966a4b35cb78b2aee83a237a834fa1eee5f4d291c8aa94bdd2
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_windows_amd64.zip
    sha256: 87c7f4c6a4bcaa801d7eac896fe67fe943cc97bf7d6775088cbacb0995c8609a
    bin: kubectl-readonly.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.1/kubectl-readonly_0.7.1_windows_arm64.zip
    sha256: d35caffa23d6769533b62b99c5ae89f428710762d73287648aa898124731389b
    bin: kubectl-readonly.exe
