apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: readonly
spec:
  version: v0.7.0
  homepage: https://github.com/Evaneos/kubectl-readonly
  shortDescription: Guardrail against accidental cluster changes
  description: |
    A kubectl wrapper that prevents accidental modifications. Allowed commands
    are passed through to kubectl in your PATH.

    Designed to guard against human errors and AI assistants overstepping their
    instructions. Also provides basic protection against leaking secret values
    to LLM context. Does NOT protect against deliberate bypass attempts.

    Examples:
    - Allowed: get pods, describe deploy, logs, top nodes
    - Blocked: delete pod, apply -f, exec, scale
    - Secrets: list allowed, but -o yaml/-o json blocked
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_linux_amd64.tar.gz
    sha256: 155d60aef533c0e54bdddadfa488a99eade9326c65cd7b8a80e043e3a0159371
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_linux_arm64.tar.gz
    sha256: 7be3f9ec6de0bc146ce57bfd2b212624a63aadbc699c0e2c5b87d3d0c6f1d1a3
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_darwin_amd64.tar.gz
    sha256: 4c7d6ce296a8aec9998a69f02319bd760b4f6496ed5cc3b0f26fd42e45757129
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_darwin_arm64.tar.gz
    sha256: 8b59e858ef4cbe2f043cc9dddd6c1d0301089efcbc3a87ed38e689ec8ec11018
    bin: kubectl-readonly
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_windows_amd64.zip
    sha256: 9f555be5eb1a544ff8321338f5faecf2a7c32df94714ef20f6711f8206e75d6a
    bin: kubectl-readonly.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/Evaneos/kubectl-readonly/releases/download/v0.7.0/kubectl-readonly_0.7.0_windows_arm64.zip
    sha256: 1397fdca0b0d397604cb3a87fe86ac4f2ad5c69d4aeb9f9b67898ab6d15b0713
    bin: kubectl-readonly.exe
