apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: relay
spec:
  version: v0.2.1
  homepage: https://github.com/knight42/krelay
  shortDescription: Drop-in "port-forward" replacement with UDP and hostname resolution.
  description: |
    This kubectl plugin is a drop-in replacement for `kubectl port-forward` with some enhanced features:
    * Supports UDP port forwarding
    * Supports simultaneous forwarding of data to multiple targets
    * Forwarding session will not be interfered after performing rolling updates
    * Forwarding data to the given IP or hostname that is accessible within the kubernetes cluster
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/knight42/krelay/releases/download/v0.2.1/kubectl-relay_v0.2.1_darwin-amd64.tar.gz
    sha256: 7fec0b3e4c9c7c2a201137fd6776c7d77fc4733e0632f40365c54e7c8684d6ea
    bin: kubectl-relay
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/knight42/krelay/releases/download/v0.2.1/kubectl-relay_v0.2.1_darwin-arm64.tar.gz
    sha256: e4d3f743b8df981af7855a46fd74ef7ae4e9c0a80b39413dbddc23db5fdbdf43
    bin: kubectl-relay
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/knight42/krelay/releases/download/v0.2.1/kubectl-relay_v0.2.1_linux-amd64.tar.gz
    sha256: a626c87363484d77ea35d5ef9c0e7d2f064392f4346402f5707c68a6cc370224
    bin: kubectl-relay
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/knight42/krelay/releases/download/v0.2.1/kubectl-relay_v0.2.1_linux-arm64.tar.gz
    sha256: 3a18fc33380d0768656f9efefafcf8e0295a1f9774c3cdd35cd04c059f8b8623
    bin: kubectl-relay
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/knight42/krelay/releases/download/v0.2.1/kubectl-relay_v0.2.1_windows-amd64.tar.gz
    sha256: 7ee5d2e73f87f8d5028dfef25db01ed64e733e83aa37cf9bd142bed33a0d5969
    bin: kubectl-relay.exe
