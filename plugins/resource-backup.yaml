apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: resource-backup
spec:
  version: v0.3.6
  homepage: https://github.com/zak905/kubectl-resource-backup
  shortDescription: Save Kubernetes resources to disk
  description: |
    Backs up Kubernetes objects (including CRDs) to the local file system. 
    Before saving any resource, some additional processing is done to remove:
    - the status stanza if the object has any.
    - the server generated fields from the object metadata. 
    - any field with a null value.
    The aims is to make the saved objects look like the original creation request.
  caveats: |
    The fields that has a default value are not removed (unlike the neat plugin)  
    because it's not possible to make a distinction between a value set 
    by a creation/update request and a value set by a controller 
    or a mutating admission webhook.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.6/kubectl-resource-backup_darwin_amd64.tar.gz
    sha256: 7801fd23ae11bea73bbdd3b685f439238738694c6a0c9c6730ecb34a2c3732d6
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.6/kubectl-resource-backup_darwin_arm64.tar.gz
    sha256: 66a333f0f91974d5a5735558699973b925702c8b4f33d96a6f151d64f987a6b7
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.6/kubectl-resource-backup_linux_amd64.tar.gz
    sha256: 1be541b07675decc491b82a5c96e6520366da26e1e41abedaa59a0ac6042e2ed
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.6/kubectl-resource-backup_linux_arm64.tar.gz
    sha256: 820f52943c9fffbaf95d8c7eb781d62bdc376833a00b57c03d1bab760faaab17
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
