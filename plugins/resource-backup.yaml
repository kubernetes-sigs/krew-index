apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: resource-backup
spec:
  version: v0.3.5
  homepage: https://github.com/zak905/kubectl-resource-backup
  shortDescription: Save Kubernetes resources to disk
  description: |
    Backs up Kubernetes objects (including CRDs) to the local file system. 
    Before saving any resource, some additional processing is done to remove:
    - the status stanza if the object has any.
    - the server generated fields from the object metadata. 
    - any field with a null value.
    The aims is to make the saved objects look like the original creation request.
  caveats: |
    The fields that has a default value are not removed (unlike the neat plugin)  
    because it's not possible to make a distinction between a value set 
    by a creation/update request and a value set by a controller 
    or a mutating admission webhook.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.5/kubectl-resource-backup_darwin_amd64.tar.gz
    sha256: 1a0ecacc9254148140b547d644be58e47c8e3a388356a8324623a85cd5a6a8dc
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.5/kubectl-resource-backup_darwin_arm64.tar.gz
    sha256: 7d18e276a4aa84fe635392c0f7f6ca6a9877f9df72676e1014df84456beb6802
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.5/kubectl-resource-backup_linux_amd64.tar.gz
    sha256: 29f116f4f7ff6efe05f2e32d68c29cfed6c2104e22493ae7ca0ed8f0bd79d21f
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.5/kubectl-resource-backup_linux_arm64.tar.gz
    sha256: da3178b907f563847d96f19b00db29f2e39b462e2b3a079aff9555d6b97fc664
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.5/kubectl-resource-backup_windows_amd64.tar.gz
    sha256: 87db469fc3495af2229159186fbe3e7b97bea4ccbd20c930674ea4592b174bba
