apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: resource-backup
spec:
  version: v0.3.4
  homepage: https://github.com/zak905/kubectl-resource-backup
  shortDescription: Save Kubernetes resources to disk
  description: |
    Backs up Kubernetes objects (including CRDs) to the local file system. 
    Before saving any resource, some additional processing is done to remove:
    - the status stanza if the object has any.
    - the server generated fields from the object metadata. 
    - any field with a null value.
    The aims is to make the saved objects look like the original creation request.
  caveats: |
    The fields that has a default value are not removed (unlike the neat plugin)  
    because it's not possible to make a distinction between a value set 
    by a creation/update request and a value set by a controller 
    or a mutating admission webhook.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.4/kubectl-resource-backup_darwin_amd64.tar.gz
    sha256: 746bed1752146f7768d32e2e953331e8e20e9fca4676c838c28b5924673c7ff9
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.4/kubectl-resource-backup_darwin_arm64.tar.gz
    sha256: d6df21f14009e6f6683f9b17253c389e6356d5019bfb77309485407b2a382c52
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.4/kubectl-resource-backup_linux_amd64.tar.gz
    sha256: 47f82bf80af0e76cc20b570ca725de0d2a52d9931fa8b5866dadcf7590ef72e4
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.4/kubectl-resource-backup_linux_arm64.tar.gz
    sha256: 537c2c239d192418a6e4fa2f7ce53e6788e3e6ab38921e105a8f2d33e19f73cb
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
