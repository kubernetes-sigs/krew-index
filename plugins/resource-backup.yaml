        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.4/kubectl-resource-backup_windows_amd64.tar.gz
    sha256: f31e3c1e8103cfaea201dd5abf3245f1743d601851c2000f44921801ffbee306
