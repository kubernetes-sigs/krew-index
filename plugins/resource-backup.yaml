apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: resource-backup
spec:
  version: v0.3.3
  homepage: https://github.com/zak905/kubectl-resource-backup
  shortDescription: Save Kubernetes resources to disk
  description: |
    Backs up Kubernetes objects (including CRDs) to the local file system. 
    Before saving any resource, some additional processing is done to remove:
    - the status stanza if the object has any.
    - the server generated fields from the object metadata. 
    - any field with a null value.
    The aims is to make the saved objects look like the original creation request.
  caveats: |
    The fields that has a default value are not removed (unlike the neat plugin)  
    because it's not possible to make a distinction between a value set 
    by a creation/update request and a value set by a controller 
    or a mutating admission webhook.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.3/kubectl-resource-backup_darwin_amd64.tar.gz
    sha256: cfcc5af70465ad05cab394de0d79a5f4051d411244c90a478a286cc75b44c361
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.3/kubectl-resource-backup_darwin_arm64.tar.gz
    sha256: b5b9c2b7bf209819e3dda96afde43d4a3b067bd263f5d11089d91744b452e104
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.3/kubectl-resource-backup_linux_amd64.tar.gz
    sha256: 87c4d44cb2ae3f93ce7206d270e2265ddfd14f9d9b67728e416615a8be3c53a6
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/zak905/kubectl-resource-backup/releases/download/v0.3.3/kubectl-resource-backup_linux_arm64.tar.gz
    sha256: 4553855e6803bf9e1e50b1e6c623f052ac27f5de67c58bcb348bed4a9c013e28
    bin: kubectl-resource-backup
  - selector:
      matchLabels:
