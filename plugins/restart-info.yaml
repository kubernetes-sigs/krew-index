apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: restart-info
spec:
  version: "v0.1.0"
  homepage: https://github.com/sdmoradi/krestart
  shortDescription: Inspect Pod restarts.
  description: |
    Identify Kubernetes Pods with container restarts and inspect their
    restart counts, termination reasons, exit codes, and related events.
    Supports all namespaces or a selected namespace, and inspection of
    individual Pods.
  platforms:
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.0/krestart_0.1.0_linux_amd64.tar.gz
    sha256: 40d05d11a3f77d98ca0fc3102a4388f108333545419eac81e821c9f3907a7b7f
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.0/krestart_0.1.0_linux_arm64.tar.gz
    sha256: 9a05c692ff75cb3637f7b43210c72a3dae749900d86798aa8a3f96f79ae0b80d
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.0/krestart_0.1.0_darwin_amd64.tar.gz
    sha256: d1c525b42f753a894f32548bc45eaf4951bb5ecc9dcb012966d1b01b168703e1
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.0/krestart_0.1.0_darwin_arm64.tar.gz
    sha256: 8b1b7e2e1ce468f0ecf7b6af22498590f3db24305cd2915c027760a80ed697e9
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.0/krestart_0.1.0_windows_amd64.zip
    sha256: 161fc64f6436d9ab95c9133862ce7fb0a5170ef96786c1bdb96f613e4a301f3d
    bin: restart-info.exe
    files:
    - from: ./kubectl-krestart.exe
      to: restart-info.exe
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
