apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: restart-info
spec:
  version: "v0.1.1"
  homepage: https://github.com/sdmoradi/krestart
  shortDescription: Inspect Pod restarts.
  description: |
    Identify Kubernetes Pods with container restarts and inspect their
    restart counts, termination reasons, exit codes, and related events.
    Supports all namespaces or a selected namespace, and inspection of
    individual Pods.
  platforms:
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.1/krestart_0.1.1_linux_amd64.tar.gz
    sha256: 89a84f0eab62335f78ccbf25aac0ce8d97f67e810d2ec667eb260b2a06397184
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.1/krestart_0.1.1_linux_arm64.tar.gz
    sha256: ac8829a5497c234889ff606fea270868e1bbc8761508795cd9762d2102561d29
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.1/krestart_0.1.1_darwin_amd64.tar.gz
    sha256: c53c55979755b0a3f6606383b839246c2cc2cccee1dd63b57fc6170a3998d1a8
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.1/krestart_0.1.1_darwin_arm64.tar.gz
    sha256: 5ca24400611316b1e9893137948ec869572c1ec7ba06d5c76d2dd32cdb5c3a50
    bin: restart-info
    files:
    - from: ./kubectl-krestart
      to: restart-info
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - uri: https://github.com/sdmoradi/krestart/releases/download/v0.1.1/krestart_0.1.1_windows_amd64.zip
    sha256: cfac1a7cf7b827ef947b9c49b4b71c541c67c39e2ef8266e0adfb418aedda26e
    bin: restart-info.exe
    files:
    - from: ./kubectl-krestart.exe
      to: restart-info.exe
    - from: ./LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
