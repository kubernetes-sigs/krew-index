apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.9
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-darwin-amd64-v1.2.9.tar.gz
    sha256: e3f33601d5466bebe1351beb75a5799a65dfaf3d3ae597c21ee26ae109f5b89e
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-darwin-arm64-v1.2.9.tar.gz
    sha256: f8b4a16c9c4d1cf21aae33312ac1d5b9763fa3dcc5eb2bab0820213e1feafa1e
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-linux-amd64-v1.2.9.tar.gz
    sha256: 96254835e5d20cb0ab37407ca7271f452efaa247606e365506b0524012374cb5
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-linux-arm64-v1.2.9.tar.gz
    sha256: 85dad1e44ea1640a874b0ccdf1e2fbe20089ae0cae0a8124401f67c454c720c1
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-windows-amd64-v1.2.9.zip
    sha256: c756c27259937bb15cc8c519d57b93de782529467c2821a72012651f8d220d49
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.9/kubectl-retina-windows-arm64-v1.2.9.zip
    sha256: a1ca62fabfeae09a8f0d994206adbdd5574d439f1754d275b39c1829c8a5f690
    bin: kubectl-retina-windows-arm64.exe

