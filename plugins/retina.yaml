apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.6
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-darwin-amd64-v1.2.6.tar.gz
    sha256: f9bb88fdb2e9a17c25fd25dba3e0023088c4c37dddab00aa9b032c53fa735eb2
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-darwin-arm64-v1.2.6.tar.gz
    sha256: 10c5cd43eb32ab4f1167d064f592cef775b127cc6b152cf81c4e905c566cd4e0
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-linux-amd64-v1.2.6.tar.gz
    sha256: e79a3314d9c897143e076bd57e9e2c951e59ba20bda44931b08feed8bcbbe773
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-linux-arm64-v1.2.6.tar.gz
    sha256: 619138b2f8cee449edbe7b87f1faf73c3cf047c7bd312eccccd1b92997bfc08e
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-windows-amd64-v1.2.6.zip
    sha256: f979228333a264c09cafc46f85b1884ba82776c2c159d4be6abf763cbe180113
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.6/kubectl-retina-windows-arm64-v1.2.6.zip
    sha256: 773789c7c9345ccc3617b3417e7d0f1607978f7846b82460b13118c7960cf0a6
    bin: kubectl-retina-windows-arm64.exe

