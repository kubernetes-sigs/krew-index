apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.8
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-darwin-amd64-v1.2.8.tar.gz
    sha256: 2446c5d300d11de6b8b2da4262166183938b1669009afe6036772e691e77db83
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-darwin-arm64-v1.2.8.tar.gz
    sha256: 79ea883753b0083a795774471ae66ec295b090c83e71f03f8886fed0ea970621
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-linux-amd64-v1.2.8.tar.gz
    sha256: 578e45792f5eca3353930751fb1290e680f977f5c90607905377f108b8be333b
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-linux-arm64-v1.2.8.tar.gz
    sha256: a3fcca5f3abbfd8fc84f998b2c3815e6cc368043a9746328ca779216a1f11691
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-windows-amd64-v1.2.8.zip
    sha256: 0ff3893440aeb1f9da826f174152be83520d5f7b0048e68c2f5f82b3552b32f3
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.8/kubectl-retina-windows-arm64-v1.2.8.zip
    sha256: 6e90909ae90aa05c28acab87bec39942dea1bddc601812b7e6436de9fd29e534
    bin: kubectl-retina-windows-arm64.exe

