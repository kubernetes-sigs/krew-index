apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.5
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-darwin-amd64-v1.2.5.tar.gz
    sha256: 2d3759255eb0b7015d9ffc0483c260d65655a3bb1d11514221fc6d8729a7a61a
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-darwin-arm64-v1.2.5.tar.gz
    sha256: 7f3d279dfde97917219812735d0a914f26dc7c64e4cc1e7dbb077baa2206823a
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-linux-amd64-v1.2.5.tar.gz
    sha256: 5e6a66ac138da0b795d15147adcb7ebffe1d490bcd19d81dd2030c63ab7a9274
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-linux-arm64-v1.2.5.tar.gz
    sha256: f4a392dc0493da04f9f0729eb7495d56a5d181499fabef7bdf698e70277317f5
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-windows-amd64-v1.2.5.zip
    sha256: 5fa94bfcdd32c0a014bbddd09d299f4ff262b8edd0a650958225f864992d83a9
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.5/kubectl-retina-windows-arm64-v1.2.5.zip
    sha256: 1df03fd402d6d8977b691ecbf6e25fd094799cb00c1069af532794c8fcd600d8
    bin: kubectl-retina-windows-arm64.exe

