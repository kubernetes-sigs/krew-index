apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.7
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-darwin-amd64-v1.2.7.tar.gz
    sha256: 6bafcc1fb9ce50ecf19892c27b11b47b3d8f9f7c842ec1048a636432ad210870
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-darwin-arm64-v1.2.7.tar.gz
    sha256: 169172e3f0f75ae30bc626302127bae98a17275d0208148da9c2198386aa6623
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-linux-amd64-v1.2.7.tar.gz
    sha256: 77e9cf05fb209a1fc84061e81174518926ae68ce1c3db3956268cbe2802648ca
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-linux-arm64-v1.2.7.tar.gz
    sha256: 3efc61d3d01b9e603bdf6b9640d01d632a6d436fb4fa287e384a66703169d1b9
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-windows-amd64-v1.2.7.zip
    sha256: 929b7e5b758b39e169aa40abe21ae7f42b021098069f3d9e280d7c4f340ea559
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.7/kubectl-retina-windows-arm64-v1.2.7.zip
    sha256: b9e76ef5b417585a773205031c5873c98e92e4c9e52f3712b6f5f1bdad49d8e2
    bin: kubectl-retina-windows-arm64.exe

