apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.3.3
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-darwin-amd64-v1.3.3.tar.gz
    sha256: 778cf0bc8865eb9199a27dba2a1b2344a3028c545582df63f62be2ed01b65bf2
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-darwin-arm64-v1.3.3.tar.gz
    sha256: 5ac5fef7b2110fc286df74b4e29b7719bd4f4d5144479ef99867e6416e0e091b
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-linux-amd64-v1.3.3.tar.gz
    sha256: 597363043c545c3e3324873643ae2a7925a46359397ab96e11cc704a8019feec
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-linux-arm64-v1.3.3.tar.gz
    sha256: 70faa2c230f407cb2fb708a894b7131b6ef1c9114baf354f7581721a555e6959
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-windows-amd64-v1.3.3.zip
    sha256: 3a9da2f06441a3fe4919b2d13881b96769df2dd8601f4bfdff85fd23bfebce40
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.3/kubectl-retina-windows-arm64-v1.3.3.zip
    sha256: 20dcabd16f3287695417ebb5eea91beca0fd73c8e686fca7f4110674d2f03b5f
    bin: kubectl-retina-windows-arm64.exe

