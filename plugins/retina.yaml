apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.3.2
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-darwin-amd64-v1.3.2.tar.gz
    sha256: 95c1040462342c2ba0f2161c0d08f9521056df74a2c33195b5993fe18bcd8dbf
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-darwin-arm64-v1.3.2.tar.gz
    sha256: 62f97c04f89094208ad23fc9a18d3171ce1a16df89fbe5840a6795943b2b0de9
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-linux-amd64-v1.3.2.tar.gz
    sha256: ec24379f282be6e124c105120a1cb1d98e88e78dd5dcf88848d979552b9f3a74
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-linux-arm64-v1.3.2.tar.gz
    sha256: da19494067799f51167740764b814b38ad5eff15b759f239124d36779d5335af
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-windows-amd64-v1.3.2.zip
    sha256: 341427d0e01f66f5d5183ff5279e1f8414928bf1093137a07adb07edd007f15b
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.2/kubectl-retina-windows-arm64-v1.3.2.zip
    sha256: b9b81a38f5ca02405f7c38f17287fcea42e23d5a0656bcb3057e166b34262eda
    bin: kubectl-retina-windows-arm64.exe

