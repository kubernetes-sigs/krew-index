apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.2.4
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-darwin-amd64-v1.2.4.tar.gz
    sha256: a39b4e95a019a0e423530e15936b16cee87c756b1507ebd09ec87ce7b3701d7a
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-darwin-arm64-v1.2.4.tar.gz
    sha256: 90ee7f24b1ed5122c49bbe400d421a69cf1a92540d886a67e38c56de9c18d9f9
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-linux-amd64-v1.2.4.tar.gz
    sha256: c7a64ce49ac675995e44122f64f7d190213aeffa6b0c5cd51ec9c86e728e030f
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-linux-arm64-v1.2.4.tar.gz
    sha256: f7ef8696192bf10251ee1da97a18e23eeeed1a98ecf99c602897bd1c7f5367e2
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-windows-amd64-v1.2.4.zip
    sha256: 3a531060958ad46759716f44123f886a9662aa6447d51376973d8a9175177bab
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.2.4/kubectl-retina-windows-arm64-v1.2.4.zip
    sha256: 1cf643ae3d11cdd5fad9e4bf0d1b361deac62869e31184cbe27062826653c192
    bin: kubectl-retina-windows-arm64.exe

