apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.3.0
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-darwin-amd64-v1.3.0.tar.gz
    sha256: 6acb04f4a4893b45f650920960c565d202285b2822beb4cf0e4d4d8507581c80
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-darwin-arm64-v1.3.0.tar.gz
    sha256: 6f559cae9fee2b5b7236e069abb8965d0554dccda3afa6b986a136ac21049338
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-linux-amd64-v1.3.0.tar.gz
    sha256: 725a00b61b575bb363cddf71d63cdbb217a660dae6fd10fe3e93b8c3a8f536f8
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-linux-arm64-v1.3.0.tar.gz
    sha256: 414fdee0f0be5cd68158679116b0ecb3c7568ad5b20b47dfe64fd9154e5b3ed9
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-windows-amd64-v1.3.0.zip
    sha256: 2014003c8f2f5d0fd214481b7039f6791cca20fa010f750e980c58a63ebe947c
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.0/kubectl-retina-windows-arm64-v1.3.0.zip
    sha256: a54bdffb3008e66f1f807888d580bc885049d3a85fdf00cb75fd6481d983be36
    bin: kubectl-retina-windows-arm64.exe

