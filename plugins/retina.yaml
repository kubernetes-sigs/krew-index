apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: retina
spec:
  version: v1.3.1
  homepage: https://github.com/microsoft/retina
  shortDescription: Distributed network captures and telemetry
  description: |
    The Retina CLI plugin enables users to collect distributed network captures in an
    OS and vendor-agnostic way. Capture jobs can be created via the CLI to target specific
    nodes or pods in a time-limited or size limited way. Capture jobs can also filter specific
    network traffic based on the given configurations; more info on the configurations can be 
    found on the official docs. The captures are collected in formats like pcap, etl and 
    text files, and can then be stored at remote storage destinations.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-darwin-amd64-v1.3.1.tar.gz
    sha256: e14cfb18ea3845d0063129949bf3ce0e348c7f8edafdb778220cecb3e03f4171
    bin: kubectl-retina-darwin-amd64
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-darwin-arm64-v1.3.1.tar.gz
    sha256: bdadac390b9dc7faca2ad870d986c03ac974510a2a0fffa5232e8aa1f3c76272
    bin: kubectl-retina-darwin-arm64
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-linux-amd64-v1.3.1.tar.gz
    sha256: 5780b03239da39eef916ec81605b5c4fbff552e77eb1d3dacffac449b845a1b1
    bin: kubectl-retina-linux-amd64
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-linux-arm64-v1.3.1.tar.gz
    sha256: 707babdaa1ab950f04fbaf0939e6805537b699c2ec3dbba6f953dbdb20e9d8ce
    bin: kubectl-retina-linux-arm64
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-windows-amd64-v1.3.1.zip
    sha256: 90d15476b914b116e309783fa3cd0fb96522b4218a3e1cb389ac0f39a5e24527
    bin: kubectl-retina-windows-amd64.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/microsoft/retina/releases/download/v1.3.1/kubectl-retina-windows-arm64-v1.3.1.zip
    sha256: c1dcbafd98a6d990c570572e553a873ce772333bb1c550d44dfe40dfd6f7715d
    bin: kubectl-retina-windows-arm64.exe

