apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: ripple
spec:
  version: v0.1.1
  homepage: https://github.com/mehrabix/kubectl-ripple
  shortDescription: See what a ConfigMap or Secret change will break
  description: |
    ripple maps the ConfigMaps and Secrets that workloads consume and reports
    what a change or a delete will actually do: which workloads restart, which
    reload in place, which are unaffected, and which objects nothing references.

    Read-only, deterministic and offline. No agent, no LLM.
  caveats: |
    ripple never modifies your cluster. It needs get/list on ConfigMaps,
    Secrets and the pod-template workload kinds.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_linux_amd64.tar.gz
      sha256: 55e46875800b92ebc04c8dbc84ad6e431750739dde03867a42a914e5c48e0219
      bin: kubectl-ripple
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_linux_arm64.tar.gz
      sha256: 648c4590ed46b3c1d2f20a8b3f6e6bad7f96c4dcbfdc21078a33c6f0cbd4f123
      bin: kubectl-ripple
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_darwin_amd64.tar.gz
      sha256: 1285318c7b2f35a7850b1dd1f00a8a3b7b3beeb70a92a203f7973075c5217d24
      bin: kubectl-ripple
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_darwin_arm64.tar.gz
      sha256: 8348076242f75334cce41c2d10680124ac9e4c75694082bd06eea7c336cd3998
      bin: kubectl-ripple
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_windows_amd64.zip
      sha256: 88a46807a6543cc535b258d30848ed7db7d5c53fde8b2a546148a78a82e08bc6
      bin: kubectl-ripple.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/mehrabix/kubectl-ripple/releases/download/v0.1.1/kubectl-ripple_0.1.1_windows_arm64.zip
      sha256: 74acd574dfd21fc41f41f6786e5a695a5684e1c8694a8274504d334936c15abd
      bin: kubectl-ripple.exe
