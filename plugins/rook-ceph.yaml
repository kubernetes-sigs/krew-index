apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: rook-ceph
spec:
  version: v0.10.0
  homepage: https://github.com/rook/kubectl-rook-ceph
  shortDescription: Rook plugin for Ceph management
  description: |
    The kubectl-rook-ceph is a Krew plugin designed for Rook-Ceph. It simplifies the management, debugging, and
    troubleshooting processes, while also offering valuable insights into the configuration of the Rook-Ceph clusters.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/rook/kubectl-rook-ceph/releases/download/v0.10.0/kubectl-rook-ceph_v0.10.0_darwin_amd64.tar.gz
    sha256: 7b36d59a46aef05bffb67fd62a519180299a7654a1c4337479ce412100d13b8a
    bin: kubectl-rook-ceph
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/rook/kubectl-rook-ceph/releases/download/v0.10.0/kubectl-rook-ceph_v0.10.0_darwin_arm64.tar.gz
    sha256: f8c3c7f40e2c6fef57d3809d3b67111eff773d754d334fe497ec636ac0f62bff
    bin: kubectl-rook-ceph
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/rook/kubectl-rook-ceph/releases/download/v0.10.0/kubectl-rook-ceph_v0.10.0_linux_amd64.tar.gz
    sha256: 5cf781f778f444e33d7e868c152634a30b64823c2d293dfbfb48eb1cadc9693a
