    sha256: 380ee2eab1d16058d046f06398d38165c2223a1ebd8a8ebe41b4a2ce7ffddc2f
    bin: kubectl-rook-ceph
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/rook/kubectl-rook-ceph/releases/download/v0.10.0/kubectl-rook-ceph_v0.10.0_windows_amd64.tar.gz
    sha256: c300bf289cf963b8ec2444649cb3dd10b659c2bf25b99414869b0e780d3d7d4a
