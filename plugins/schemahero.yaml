  name: schemahero
spec:
  version: v0.26.2
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.2/kubectl-schemahero_linux_amd64.tar.gz
    sha256: 7b0b687cdaf9756d1e5444e4276912cd754e68b3cb6ede07ca6d389c5cbfed23
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.2/kubectl-schemahero_linux_arm64.tar.gz
    sha256: 5101e849a5274db65a9c37e92c79eb5c60737e417ef6a704018f24068c4e2746
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.2/kubectl-schemahero_darwin_amd64.tar.gz
    sha256: a62c93ea920201af4666903ba80ca3a89c6f4c7e173b459c1d5ad5ccea477696
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.2/kubectl-schemahero_darwin_arm64.tar.gz
    sha256: 82d4bfbf596515434e3296c32dbc75e554a506ac3ca8a253910c56077a0b4870
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.2/kubectl-schemahero_windows_amd64.tar.gz
    sha256: 859476e8bd05fe8df43ef5bc2a08ad0f96efa54bd9091dd6561f631440da38fb
    files:
    - from: kubectl-schemahero.exe
      to: .
    - from: LICENSE
