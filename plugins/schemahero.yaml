    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.1/kubectl-schemahero_linux_arm64.tar.gz
    sha256: 1b609a7cb53af5695dd70329611ede48ae3be99165f295172a752123de7ef725
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.1/kubectl-schemahero_darwin_amd64.tar.gz
    sha256: 724d86a38fa2da9baac53da49ceaef7b74c6f613b3f15573ee78009e5226e57f
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
