  name: schemahero
spec:
  version: v0.26.0
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.0/kubectl-schemahero_linux_amd64.tar.gz
    sha256: bef0983db523866823c236a2fb14c9e5b7d98a6d13007adf61e049a628b0d0c8
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.0/kubectl-schemahero_linux_arm64.tar.gz
    sha256: c1bc7c954751844c29265a3cee425a7e7a65038b131b454a8b6a0b1a5cf76b51
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.0/kubectl-schemahero_darwin_amd64.tar.gz
    sha256: 1c5dc7604318bc53acbedf6f7f712f396097bac426076a42815106f6f511f558
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.0/kubectl-schemahero_darwin_arm64.tar.gz
    sha256: 500b03c81e10340e37270394cc4626bb22206432efd0e69be88c54d4d9f4126e
    files:
    - from: kubectl-schemahero
      to: .
    - from: LICENSE
      to: .
    bin: kubectl-schemahero
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/schemahero/schemahero/releases/download/v0.26.0/kubectl-schemahero_windows_amd64.tar.gz
    sha256: c9d36f5467f882a3e16ace9c40dc2eea7808e087f283ea84f568237d776d25c5
    files:
    - from: kubectl-schemahero.exe
      to: .
    - from: LICENSE
