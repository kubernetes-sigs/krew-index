apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sgmap
spec:
  version: v1.4.11
  homepage: https://github.com/naka-gawa/kubectl-sgmap
  shortDescription: "Visualize security group per pod."
  description: |
    A kubectl plugin to visualize security group per pod.
    This plugin provides a command to generate a security group map for pods in a Kubernetes cluster.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.11/kubectl-sgmap_Darwin_arm64.tar.gz
      sha256: 907c85e77a173190a9a7b11a99f3a965d284dff84bc87f42736c7dadfb56d854
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.11/kubectl-sgmap_Darwin_x86_64.tar.gz
      sha256: d1c79afbcd1f35f764ee2d6fd08c1aaeee7f7ff5f1f5f26d1973178c3d1838e1
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.11/kubectl-sgmap_Linux_x86_64.tar.gz
      sha256: 8a8270942e745a2e87c5f2f3526f348d7d50efdf69d678551f355605d1597ea5
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.11/kubectl-sgmap_Linux_arm64.tar.gz
      sha256: 9962006379350cf89fc3d93c647f120cef5992f4d43248504211fdea4162a7cb
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
