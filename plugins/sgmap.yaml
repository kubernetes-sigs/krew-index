apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sgmap
spec:
  version: v1.5.0
  homepage: https://github.com/naka-gawa/kubectl-sgmap
  shortDescription: "Visualize security group per pod."
  description: |
    A kubectl plugin to visualize security group per pod.
    This plugin provides a command to generate a security group map for pods in a Kubernetes cluster.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.5.0/kubectl-sgmap_Darwin_arm64.tar.gz
      sha256: 404b99360313cf8bd9de7c2abd141da4b60366c4c9d801ae2c9caa075c958b5c
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.5.0/kubectl-sgmap_Darwin_x86_64.tar.gz
      sha256: 9698d416c97b03014b1c1934868c6a84d8522aa4428a5549ea7112f7812f4727
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.5.0/kubectl-sgmap_Linux_x86_64.tar.gz
      sha256: 542621f0055c2c52f1c496477a1305aacebafcf5339b8c4b19b6f14d6ffb3448
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.5.0/kubectl-sgmap_Linux_arm64.tar.gz
      sha256: f9c84c218b6ec369ffcd43fab58981778a2ae943f5da1887d727ab35b43b9598
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
