apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: sgmap
spec:
  version: v1.4.12
  homepage: https://github.com/naka-gawa/kubectl-sgmap
  shortDescription: "Visualize security group per pod."
  description: |
    A kubectl plugin to visualize security group per pod.
    This plugin provides a command to generate a security group map for pods in a Kubernetes cluster.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.12/kubectl-sgmap_Darwin_arm64.tar.gz
      sha256: 7411915ef50318ea1400292ac6db59912fc9902a954f4e62cc3202d836d72e86
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.12/kubectl-sgmap_Darwin_x86_64.tar.gz
      sha256: 6ad895f74ee6a469b13d7c576fe703daa754b39974f8d6d7297e0a05007123a6
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.12/kubectl-sgmap_Linux_x86_64.tar.gz
      sha256: 777aafd02a4ad3220cb4316947adc38cd7e0d082fb2d874cb71c595d7a7ef2ce
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/naka-gawa/kubectl-sgmap/releases/download/v1.4.12/kubectl-sgmap_Linux_arm64.tar.gz
      sha256: 30f2f1f07be15bd649f482253ea9c0a515c9684d550ce25a618ffc7e4ea2b60d
      files:
        - from: "kubectl-sgmap"
          to: "."
        - from: "LICENSE"
          to: "."
      bin: "./kubectl-sgmap"
