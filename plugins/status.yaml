  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.25/status_linux_arm64.tar.gz
    sha256: ae2cbb9a1d70a89cc997faef9c6b56a5ff571300006004d58064396069150084
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.25/status_darwin_amd64.tar.gz
    sha256: 29564f5f4d1d6d406f33726364d23c6024f155a56c21d0e92535f292da8145e6
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
