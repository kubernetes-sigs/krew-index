  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.24/status_linux_arm64.tar.gz
    sha256: 4b4503c04ea02625a9b5128a3aea730dd1272c39eb601f8a6fabc168f0aa59e8
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.24/status_darwin_amd64.tar.gz
    sha256: 3f4a79baf362878332e14a37d00205a7acf2962a3363d32f7930bee5db7c3296
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.24/status_darwin_arm64.tar.gz
    sha256: daeefd70eaf38caf796419d00bfa4681fd8df0c3b64b3fc2493399893cf08f82
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.24/status_windows_amd64.zip
    sha256: 2f2ba782826ddcd2d257f6787439c637012ed1b1945b363e6d361a46dbeb7b6a
    files:
    - from: "/status.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status.exe"
  shortDescription: Show status of Kubernetes resources at a glance.
  homepage: https://github.com/bergerx/kubectl-status
  caveats: |
    Usage:
      $ kubectl status

    For additional options:
      $ kubectl status --help

  description: |
    Shows the status of any Kubernetes resource in one command, in place of
    separate get/describe calls. Most useful when debugging why a resource
    isn't healthy.
