apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.28
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.28/status_linux_amd64.tar.gz
    sha256: 42317c652b0a8d342788aaa32cf3a91b2cf8e80af8ac567215ddf28d7e611906
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.28/status_linux_arm64.tar.gz
    sha256: 39514ad9140d102e0f9805657976b192425c6ead6f34f7bffef748835ffae795
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.28/status_darwin_amd64.tar.gz
    sha256: 8869249a1e623c7bf2bdd134b7f16a632d692b68e7168ec6c9fd399bd00fb1e6
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.28/status_darwin_arm64.tar.gz
    sha256: 88153fa601771837d7970ae67dd9dde71ae2d5e03105e28ef9be090a05ef4db1
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.28/status_windows_amd64.zip
    sha256: 47d109fc0c2be1c8c3f013d32d6aad74911073abeb08efbe816ea3bc2ca2cf5c
    files:
    - from: "/status.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status.exe"
  shortDescription: Show status of Kubernetes resources at a glance.
  homepage: https://github.com/bergerx/kubectl-status
  caveats: |
    Usage:
      $ kubectl status

    For additional options:
      $ kubectl status --help

  description: |
    Shows the status of any Kubernetes resource in one command, in place of
    separate get/describe calls. Most useful when debugging why a resource
    isn't healthy.
