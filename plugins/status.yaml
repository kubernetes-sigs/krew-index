    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.27/status_windows_amd64.zip
    sha256: bae4db65e3e33e013a3cbcaabee04a98f6b7a9a9e864fca1d50ca824f789eb22
