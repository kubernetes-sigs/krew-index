apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.24
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.24/status_linux_amd64.tar.gz
    sha256: 2915e0a56eb9e29b4b7ce20517fffcfb481e6794c58f745e93c26868c01a2adc
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
