apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.22
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.22/status_linux_amd64.tar.gz
    sha256: 5fb9baf688171e287db99baa3a6437de1078e98c7dd0ffb6c6d46e9963261d2e
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.22/status_linux_arm64.tar.gz
    sha256: fd969e6e00a159a2af8eb88f5365e0cd171de9d858f9d6ee757b2a11902b7cb5
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.22/status_darwin_amd64.tar.gz
    sha256: c48cf9cd03cc160bb9a5af33a3c48403fb73eb0011a7bcabd5bac297db9f1e29
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.22/status_darwin_arm64.tar.gz
    sha256: 364729890c1c23d8d8a3ce5eb9d609af9933993a47699f4234d38e760135dd44
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.22/status_windows_amd64.zip
    sha256: 17030a4944dc2615391de3a1767abfa73cd2aaeb8395cad76981b509be439210
    files:
    - from: "/status.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status.exe"
  shortDescription: Show status of Kubernetes resources at a glance.
  homepage: https://github.com/bergerx/kubectl-status
  caveats: |
    Usage:
      $ kubectl status

    For additional options:
      $ kubectl status --help

  description: |
    Shows the status of any Kubernetes resource in one command, in place of
    separate get/describe calls. Most useful when debugging why a resource
    isn't healthy.
