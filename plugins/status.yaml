apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.26
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.26/status_linux_amd64.tar.gz
    sha256: c519c1a45e725009c4b4c144ed6c7c73084f52fded12dd21d6dba689c43dc8d9
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.26/status_linux_arm64.tar.gz
    sha256: e3449f929062a6ad4082940e5d039dc87075c0f5f10e3ba429844003dbc28b70
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.26/status_darwin_amd64.tar.gz
    sha256: 683e56a9e4d1dca6cc25ec1f1ed422a5f80d945291e26d499552e8285675871a
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.26/status_darwin_arm64.tar.gz
    sha256: f7b1f8d9324feeb6e8db113453030785037846464e08b833aabde821f748a9c7
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.26/status_windows_amd64.zip
    sha256: dc0e31264a11ed0daf9756518bfe61ebaa40d2ae16b256b9f6aeedc063185700
    files:
    - from: "/status.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status.exe"
  shortDescription: Show status of Kubernetes resources at a glance.
  homepage: https://github.com/bergerx/kubectl-status
  caveats: |
    Usage:
      $ kubectl status

    For additional options:
      $ kubectl status --help

  description: |
    Shows the status of any Kubernetes resource in one command, in place of
    separate get/describe calls. Most useful when debugging why a resource
    isn't healthy.
