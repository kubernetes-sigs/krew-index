apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.23
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.23/status_linux_amd64.tar.gz
    sha256: 4d6097d1ca681819cff9cdb95b9b606067db56653eece6d380ee1e8bc5a9568f
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.23/status_linux_arm64.tar.gz
    sha256: 33478831c1eb1a96e3feac6187c5fc9fba373a5e537d9a1f976d74c338986eff
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.23/status_darwin_amd64.tar.gz
    sha256: 71368ab453d91d77cbd3a358554492e70355e42545a278783eb54e617aa6cee1
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.23/status_darwin_arm64.tar.gz
    sha256: 0563d2c5ccd9a9fcde3a063d24c2d0b577dc8650253233b26dc70919bef7c1dd
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.23/status_windows_amd64.zip
    sha256: 1e6a1405161273033371cac1decfd9f1415f7b2ec98985408a2c9ed98615d8eb
    files:
    - from: "/status.exe"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status.exe"
  shortDescription: Show status of Kubernetes resources at a glance.
  homepage: https://github.com/bergerx/kubectl-status
  caveats: |
    Usage:
      $ kubectl status

    For additional options:
      $ kubectl status --help

  description: |
    Shows the status of any Kubernetes resource in one command, in place of
    separate get/describe calls. Most useful when debugging why a resource
    isn't healthy.
