      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.29/status_linux_arm64.tar.gz
    sha256: 30317980c9afed260742ea755db39a3f2855d335949b945756fceb93b53f2677
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.29/status_darwin_amd64.tar.gz
    sha256: 83265913b1357a006dd3ff021a9f839ccd629822e0bed24a9ea9009f88f1f85d
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
    bin: "status"
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
