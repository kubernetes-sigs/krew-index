apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: status
spec:
  version: v0.7.25
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/bergerx/kubectl-status/releases/download/v0.7.25/status_linux_amd64.tar.gz
    sha256: 8b4db76b89307c4eddc7a8f9e74953d70729c73057f0002fca27b0183eae9e49
    files:
    - from: "./status"
      to: "."
    - from: LICENSE
      to: "."
