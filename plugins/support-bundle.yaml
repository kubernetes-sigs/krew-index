apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: support-bundle
spec:
  version: v0.134.4
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.4/support-bundle_linux_amd64.tar.gz
    sha256: 120ffd7d641f608202a134d788b693c16edeec1fd09ff0882a85a1c21e8cf5e1
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.4/support-bundle_linux_arm64.tar.gz
    sha256: 50ec9a581ca71374d59801ba08657d063ab98a5d3c73f510a06dd5c7ece5a221
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.4/support-bundle_linux_arm.tar.gz
    sha256: 28829f3de76f29403be1f766c7e88ccf0a74a08646d10f4b0f8d70590f9d6a43
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.4/support-bundle_darwin_all.tar.gz
    sha256: 45347ca8378c469200a49b1271a182b5a86ffe0660cc2fbf40a16a0d3c0ef917
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.4/support-bundle_darwin_all.tar.gz
    sha256: 45347ca8378c469200a49b1271a182b5a86ffe0660cc2fbf40a16a0d3c0ef917
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
