apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: support-bundle
spec:
  version: v0.134.3
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3/support-bundle_linux_amd64.tar.gz
    sha256: 6c7db621f939dfb98250a5a1f295e8c212641685422c058a083bb0f4477abe7d
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3/support-bundle_linux_arm64.tar.gz
    sha256: 5785cb3f83c172e5d23ee95861ba0cef79a573a4a3dd428bf9d9cc22a9a4593f
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3/support-bundle_linux_arm.tar.gz
    sha256: 9b10753f25c86e91b7ff7453b3468083c3abf356323c0d7a20843577d6a5ce91
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3/support-bundle_darwin_all.tar.gz
    sha256: 7dd517bc0cd5d3e54c76e9df95b4383c1ed558addb43a1e41437ec93564e4376
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.3/support-bundle_darwin_all.tar.gz
    sha256: 7dd517bc0cd5d3e54c76e9df95b4383c1ed558addb43a1e41437ec93564e4376
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
