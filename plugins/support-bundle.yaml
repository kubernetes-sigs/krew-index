  name: support-bundle
spec:
  version: v0.134.0
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.0/support-bundle_linux_amd64.tar.gz
    sha256: 3f091882becc9ca05278f51de0395617e95a9e83775697437a5b61c3e6616c6c
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.0/support-bundle_linux_arm64.tar.gz
    sha256: 0a71853c1165b7d8f08439bcf285af39738173eb945cfb9f9d3f978154005520
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: linux
        arch: arm
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.0/support-bundle_linux_arm.tar.gz
    sha256: d1d1a8d33d55c743f26b7c65d1bd27933285da05369cbe699b778ceae2f943c2
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.0/support-bundle_darwin_all.tar.gz
    sha256: 1c5dbc9db009924e52c4ee5fafd3f935b18a623fffaa2c23f7969e207a063f2a
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
      to: .
    bin: support-bundle
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/replicatedhq/troubleshoot/releases/download/v0.134.0/support-bundle_darwin_all.tar.gz
    sha256: 1c5dbc9db009924e52c4ee5fafd3f935b18a623fffaa2c23f7969e207a063f2a
    files:
    - from: support-bundle
      to: .
    - from: LICENSE
