apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tns-csi
spec:
  version: v0.5.5
  homepage: https://github.com/fenio/tns-csi
  shortDescription: Manage TrueNAS CSI volumes
  description: |
    kubectl plugin for managing TrueNAS CSI driver volumes.

    Commands:
    - list: List all managed volumes with clone relationships
    - list-snapshots: List snapshots with source volumes
    - list-orphaned: Find volumes without matching PVCs
    - describe: Show detailed volume information
    - health: Check health of all volumes
    - troubleshoot: Diagnose PVC issues
    - summary: Dashboard overview of all resources
    - cleanup: Delete orphaned volumes safely
    - mark-adoptable: Mark volumes for DR/adoption
    - adopt: Generate PV manifest for adoption
    - status: Show volume status from TrueNAS
    - connectivity: Test TrueNAS connection
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/fenio/tns-csi/releases/download/plugin-v0.5.5/kubectl-tns_csi-linux-amd64.tar.gz
    sha256: f84f5d849217880b6ff06e8e18e2f2a329b4d34da34646205bbb1cb859a26cef
    bin: kubectl-tns_csi
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/fenio/tns-csi/releases/download/plugin-v0.5.5/kubectl-tns_csi-linux-arm64.tar.gz
    sha256: ee1883a25ba2b51013d81d3a0babb1b74e7f6e06feb90c7bfb875863caec3ee7
    bin: kubectl-tns_csi
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/fenio/tns-csi/releases/download/plugin-v0.5.5/kubectl-tns_csi-darwin-amd64.tar.gz
    sha256: c968f26a7c5bfafbc9f66cb739954901ec9a175791cffe8b098cc6f4bcd4d167
    bin: kubectl-tns_csi
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/fenio/tns-csi/releases/download/plugin-v0.5.5/kubectl-tns_csi-darwin-arm64.tar.gz
    sha256: c157172e16eb521e0cdd5e9afdd622bec5cfc7fba4cdae2dc21c71215b83cada
    bin: kubectl-tns_csi
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/fenio/tns-csi/releases/download/plugin-v0.5.5/kubectl-tns_csi-windows-amd64.zip
    sha256: acf07a7b387bb7620d6970e75732ee1ff28d315e67187bed0d43a6751dac93a9
    bin: kubectl-tns_csi.exe
