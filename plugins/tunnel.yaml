apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.3.0
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Darwin_x86_64.tar.gz
    sha256: 2864a09f70d5e2a4cd5ba283f1a1b9a672391cbd118cf8f4c6d50aff5e76c836
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Darwin_arm64.tar.gz
    sha256: 0445249884cfe216fdf663f44988082ad9a9a32f4679abad15383bdb90a96c4d
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Linux_x86_64.tar.gz
    sha256: 48b2b41d60e0c365847c5d2dd8c32602cc05e57b068042a90814bcf148ba5cc0
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Linux_arm64.tar.gz
    sha256: 79efccda60636a2cfdc381d5f946d75e9abfd43bba7af7086a2a99524065f2d5
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Windows_x86_64.tar.gz
    sha256: 9ee147e3675f04f5796bf5153a8e74c59c0a04fcfcb53fd27e4de53d544cc90c
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.3.0/ktunnel_2.3.0_Windows_arm64.tar.gz
    sha256: e4cf3c5d56298935fe01e81fe130b2dc14b133850bb1378d97a79553beeb860b
    bin: ktunnel.exe

