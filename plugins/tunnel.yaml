apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.4.0
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Darwin_x86_64.tar.gz
    sha256: de851697fac19f56bca135d313718f268157d6b2a63f9dd0cf58323a96f16bf9
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Darwin_arm64.tar.gz
    sha256: 9bbe18fd0698f84b77ddbde9050f543ec73da3d748ad2d0a59c05d6b2fd60d53
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Linux_x86_64.tar.gz
    sha256: a6520cc2032773cd3c45352839412da15946ab34929ed038900cf04212190300
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Linux_arm64.tar.gz
    sha256: aedace0d5e2899b1d292d65c2fe04854f74deeb21ca5306a8b37cceb6e8393ab
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Windows_x86_64.tar.gz
    sha256: 595dfcf7fe067ddd83c3f7fd338a9062fe3e8292a31ca689da1e9f93d8341f62
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.0/ktunnel_2.4.0_Windows_arm64.tar.gz
    sha256: ab1baeb5c0119c6f685f7a414b443a5f894eed470e43afb624ac45e81b76314f
    bin: ktunnel.exe

