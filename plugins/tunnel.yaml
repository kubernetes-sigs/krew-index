apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.4.1
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Darwin_x86_64.tar.gz
    sha256: 541c02ee794763e3d76e77bc9b0dfbb395fb8f70776242ff02a7482e620d578d
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Darwin_arm64.tar.gz
    sha256: 8870d7ba92825d6686a8355a37f798f1090a60f045e3637b708e042d93ccc0c2
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Linux_x86_64.tar.gz
    sha256: 63d4db962314289d300d119cdd9a8427adadf2e1ad20c87cdd3d272abc3d4fdb
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Linux_arm64.tar.gz
    sha256: 58fbbbe56504314ea0b77721b0474f7f76310ef627bcc0e1680d709a2151b430
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Windows_x86_64.tar.gz
    sha256: dad8e95be57be6a63f4b6f196f8d2197fc87d7710a7a882e2951c42580f18e3c
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.4.1/ktunnel_2.4.1_Windows_arm64.tar.gz
    sha256: c269fc99a981d6e037c57941ca7f4153551566e9f3f8acab1f46992735e5aa8a
    bin: ktunnel.exe

