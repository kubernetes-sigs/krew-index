apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.1.0
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Darwin_x86_64.tar.gz
    sha256: 45b30b06c7ff680558f857e9aabbf40a2da9a43fb09de1f1176a94fd8ce3355e
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Darwin_arm64.tar.gz
    sha256: c44157407ed669ad40dad776b949d9c8ca078e7d6496c42046856550a3727f71
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Linux_x86_64.tar.gz
    sha256: 16a4b11eb50f09e227043b5ff5acfd2e283dcf234f4d1b8e2f3bacb98b24417d
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Linux_arm64.tar.gz
    sha256: a7cab2b7d83f3c101e5e2e2251520569b30d926f7f4ef2bf4370d8c97f53b2b5
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Windows_x86_64.tar.gz
    sha256: 41eceecc56c2725daa75ab86755566fdd9c6216b889f16c34525e4806a0c6610
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.1.0/ktunnel_2.1.0_Windows_arm64.tar.gz
    sha256: ecc3d5627e63d9515dbdeabb36f8173f852ab592fdd383be333fb03fe24e0e4b
    bin: ktunnel.exe

