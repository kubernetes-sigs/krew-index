apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.0.2
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Darwin_x86_64.tar.gz
    sha256: a0b4b42068bcb54d525e036a2538bf79a45f012ea8f2ed31b5921afe352e971b
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Darwin_arm64.tar.gz
    sha256: 3c27998eabdb88cc5f46726a551d02a31925e398630e335aa283a92d9491d9a1
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Linux_x86_64.tar.gz
    sha256: c4d744291c195ee3d0b631ac0430facd37d6c0b112dcfd1007ff1f735d8198cd
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Linux_arm64.tar.gz
    sha256: 8b390403e94e2574b7504608b6fd8a50aa4cb2154b5858a8dec35f303588677b
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Windows_x86_64.tar.gz
    sha256: 72f095a345e8865eabfd0b8ee9c023caf43064a3e8b50005f5cbaa8b2116a7f8
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.0.2/ktunnel_2.0.2_Windows_arm64.tar.gz
    sha256: e5793162f3bb382d3689000bf14ff8294030de23a711577a040599736795982b
    bin: ktunnel.exe

