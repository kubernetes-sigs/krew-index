apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.2.0
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Darwin_x86_64.tar.gz
    sha256: b09838e21c96192a909ee2a77159837efcb3f4b5f9cfc0dc6cd3e1806dc3ef48
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Darwin_arm64.tar.gz
    sha256: 0132f695494adb84786060783eff2bcf1ffd07fab0d1b87b07ab29f226022bce
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Linux_x86_64.tar.gz
    sha256: 1b92a0b601226997bb769248032791d26acc575caba4eabbb81937fbc722869c
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Linux_arm64.tar.gz
    sha256: abec0fd69f312bda3c954516054056099e74510d0f61194399d3908b0c4f038d
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Windows_x86_64.tar.gz
    sha256: 3530ee6ea7c2eaa89a65096fd7aacf303518524fd89212cfa521761323aceef6
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.2.0/ktunnel_2.2.0_Windows_arm64.tar.gz
    sha256: 06576db703ec237121b20fd06e100be5210c75df41d139fca443eec400bf4acd
    bin: ktunnel.exe

