apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: tunnel
spec:
  version: v2.5.0
  homepage: https://github.com/omrikiei/ktunnel
  shortDescription: Reverse tunneling between cluster and your machine
  description: |
      This plugin establishes a reverse tunnel between the Kubernetes cluster
      and your local machine. It lets you expose your machine as a service in
      the cluster or expose it to a specific deployment as a local host.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Darwin_x86_64.tar.gz
    sha256: 58bb2ed906bc455e3fefb44fe053d666eaceae11d1f825604f6869c6c20f8a15
    bin: ktunnel
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Darwin_arm64.tar.gz
    sha256: b53403297af2cfb24447ce01675c8510356d7963e37447d71798e819c01b5cc9
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Linux_x86_64.tar.gz
    sha256: c5a591aea62930fadd416b35ce5318a1870f2554459b4ea12abb49e1f9a52422
    bin: ktunnel
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Linux_arm64.tar.gz
    sha256: 1bc22f3d851a74513f5f4a8cef9146de0c0ef5f5c7297f47d9493117ef17ae44
    bin: ktunnel
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Windows_x86_64.tar.gz
    sha256: bac243a6142c64bcfa97ba636bd73b2e4d90e3390d7da8452f7e2bac66d8b1f4
    bin: ktunnel.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    uri: https://github.com/omrikiei/ktunnel/releases/download/v2.5.0/ktunnel_2.5.0_Windows_arm64.tar.gz
    sha256: ee5220df6522c7b4cf4150ce0d417875f2c36a7981eb5cb5d994e93b785c732b
    bin: ktunnel.exe

