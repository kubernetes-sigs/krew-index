apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: upgradescope
spec:
  version: v0.2.2
  homepage: https://github.com/abd-ulbasit/upgradescope
  shortDescription: Find what blocks your next Kubernetes upgrade
  description: |
    upgradescope checks a cluster's readiness for a Kubernetes minor upgrade
    before you start it. It finds stored objects and live callers of
    deprecated or removed APIs, end-of-life add-ons (from a cited,
    regularly synced registry), version skew between the control plane and
    the nodes, and Helm charts that do not support the target version. It
    rolls them up into a readiness score and a verdict.

      kubectl upgradescope scan --target 1.37
      kubectl upgradescope scan --target 1.37 --output json
      kubectl upgradescope scan --files rendered/ --target 1.37 --output sarif

    It is read-only: it never changes the cluster. The same binary also runs
    as an in-cluster agent and a fleet server (see the homepage).
  caveats: |
    upgradescope only reads. The scan needs these permissions in the current
    context:
      * get/list on namespaces, nodes and pods;
      * get on the /version and /metrics non-resource URLs. /metrics is how
        it finds live callers of deprecated APIs;
      * get/list on the deprecated API resources it probes, and on
        customresourcedefinitions;
      * optionally get/list on secrets and configmaps, to read Helm releases.
    A check it cannot run is reported as NOT ASSESSED, never as passing.
    By default the verdict is then unknown and the gate fails (exit 2).
    Pass --allow-incomplete to gate on findings alone.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_linux_amd64.tar.gz
      sha256: e4a849e8c8417e01ee8b4933d32e1f2b628dcbd7370af1ac84169e725d014acc
      bin: upgradescope
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_linux_arm64.tar.gz
      sha256: a1532e43e83d20e2b389af8799d73a9b33f1776e199cdf441456bcff6f7d22a5
      bin: upgradescope
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_darwin_amd64.tar.gz
      sha256: 9c1d7833d794f5f9c001b85cd2980bea3fae6f0f09e37f91b1e2222a4b367763
      bin: upgradescope
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_darwin_arm64.tar.gz
      sha256: a9a343d23745222cbcbaab7c8ed844222c911ac6dc909c9e443edf5735766b91
      bin: upgradescope
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_windows_amd64.zip
      sha256: 5b5c88913262b60771cf1cc90a9e9ffab30fe09fd57bb4066f3b7d84ae7bb8e5
      bin: upgradescope.exe
    - selector:
        matchLabels:
          os: windows
          arch: arm64
      uri: https://github.com/abd-ulbasit/upgradescope/releases/download/v0.2.2/upgradescope_windows_arm64.zip
      sha256: fc38437d99ce48bea2e77131469392620c9fc59411288f67ae9b125adc881536
      bin: upgradescope.exe
