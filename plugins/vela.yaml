  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/oam-dev/kubevela/releases/download/v1.11.2/kubectl-vela-v1.11.2-darwin-amd64.tar.gz
    sha256: 71f50031f95b664598743498626e8c6d915298f94cd57af2cc14a1e3ddadc8dd
    files:
    - from: "*/kubectl-vela"
      to: "."
    - from: "*/LICENSE"
      to: "."
    bin: "kubectl-vela"
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/oam-dev/kubevela/releases/download/v1.11.2/kubectl-vela-v1.11.2-windows-amd64.zip
    sha256: 6ea6d0209b33503b0beb66d6ae626b14ccd83ae48029f42a29b30dd78748193d
    files:
    - from: "*/kubectl-vela.exe"
      to: "."
    - from: "*/LICENSE"
      to: "."
    bin: "kubectl-vela.exe"
  shortDescription: Easily interact with KubeVela
  homepage: https://kubevela.io
  description: |
    kubectl vela is a kubectl plugin from the KubeVela project. KubeVela is
    a modern application platform that is fully self-service, and adapts to
    your needs when you grow. This plugin allows you to better view, manage
    and maintain KubeVela applications.