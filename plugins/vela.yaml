spec:
  version: "v1.11.1"
  platforms:
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/oam-dev/kubevela/releases/download/v1.11.1/kubectl-vela-v1.11.1-linux-amd64.tar.gz
    sha256: 13a2732a7cf9bcd57e5d352482250d48207923c71ad8f33a7cd6e2f72fbd7488
