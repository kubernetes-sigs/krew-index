# Manifiesto de krew para kdoctor (plugin de kubectl: `kubectl venom-doctor`; el nombre `doctor` ya lo usa otro plugin del índice).
# PENDIENTE antes de publicar en el índice de krew:
#   - los sha256 corresponden al release kdoctor-v0.1.2 (checksums.txt); el repositorio ya es público;
#   - el índice exige que el archivo se llame como el plugin (venom-doctor.yaml); aquí se mantiene kdoctor.yaml
#     como pide CLAUDE.md y se renombrará al enviarlo al índice.
# Prueba local tras un release: kubectl krew install --manifest=kdoctor.yaml --archive=<archivo.tar.gz>
apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: venom-doctor
spec:
  version: v0.1.2
  homepage: https://github.com/CloudVipers/VenomOps/tree/main/packages/kdoctor
  shortDescription: Explica por qué algo está roto en tu clúster y cómo arreglarlo
  description: |
    kubectl venom-doctor revisa los Pods de un namespace (o de todos) y explica en lenguaje claro por qué fallan
    y cómo arreglarlo: CrashLoopBackOff, OOMKilled, ImagePullBackOff y Pending. Es de solo lectura.
    La explicación con IA (--explain, Amazon Bedrock) es opcional y está desactivada por defecto.
  platforms:
    - selector:
        matchLabels: {os: linux, arch: amd64}
      uri: https://github.com/CloudVipers/VenomOps/releases/download/kdoctor-v0.1.2/kdoctor_v0.1.2_linux_amd64.tar.gz
      sha256: "17f9a4bb8c9ed118558ec823e56beb558e828e631157ae8b8f75e37ab4494984"
      bin: kubectl-venom_doctor
    - selector:
        matchLabels: {os: linux, arch: arm64}
      uri: https://github.com/CloudVipers/VenomOps/releases/download/kdoctor-v0.1.2/kdoctor_v0.1.2_linux_arm64.tar.gz
      sha256: "1ce49ead129de498d0290c273fdd53b98519f14c07676abf2002c1b8af6de2b9"
      bin: kubectl-venom_doctor
    - selector:
        matchLabels: {os: darwin, arch: amd64}
      uri: https://github.com/CloudVipers/VenomOps/releases/download/kdoctor-v0.1.2/kdoctor_v0.1.2_darwin_amd64.tar.gz
      sha256: "7f27bb25305089c3b634ad4795844d97a338f7c436d3b40236322b61f8ca21da"
      bin: kubectl-venom_doctor
    - selector:
        matchLabels: {os: darwin, arch: arm64}
      uri: https://github.com/CloudVipers/VenomOps/releases/download/kdoctor-v0.1.2/kdoctor_v0.1.2_darwin_arm64.tar.gz
      sha256: "544f1e7992785332663ae8b618da7bab362ce7e2b127a2091a24e80c58937817"
      bin: kubectl-venom_doctor
    - selector:
        matchLabels: {os: windows, arch: amd64}
      uri: https://github.com/CloudVipers/VenomOps/releases/download/kdoctor-v0.1.2/kdoctor_v0.1.2_windows_amd64.zip
      sha256: "90d984832899e51a7a844cfc5278d24c31c15040a3b186c610accea775dd1193"
      bin: kubectl-venom_doctor.exe
