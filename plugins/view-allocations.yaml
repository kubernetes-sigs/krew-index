apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: view-allocations
spec:
  version: "v3.1.0"
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/davidB/kubectl-view-allocations/releases/download/3.1.0/kubectl-view-allocations_3.1.0-x86_64-apple-darwin.tar.gz
      sha256: 7317933a92c78f538947a220410d94fc877dba4f1d54dc18350d599787b0865b
      bin: "./kubectl-view-allocations"
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/davidB/kubectl-view-allocations/releases/download/3.1.0/kubectl-view-allocations_3.1.0-aarch64-apple-darwin.tar.gz
      sha256: 09edd354ae9de580d65a762f8378efc3225a9e3e397485b31710ce81e48783bc
      bin: "./kubectl-view-allocations"
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/davidB/kubectl-view-allocations/releases/download/3.1.0/kubectl-view-allocations_3.1.0-x86_64-unknown-linux-musl.tar.gz
      sha256: 01d8a5053fe3f61acc7d8631d8c6c7e14c96e84a79f543e3aadf5f8c5d658407
      bin: "./kubectl-view-allocations"
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/davidB/kubectl-view-allocations/releases/download/3.1.0/kubectl-view-allocations_3.1.0-aarch64-unknown-linux-musl.tar.gz
      sha256: 4441ead7b23ed0d6577b39b91f452149128dbafaabb33d0a9c1ca9228788ed5a
      bin: "./kubectl-view-allocations"
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/davidB/kubectl-view-allocations/releases/download/3.1.0/kubectl-view-allocations_3.1.0-x86_64-pc-windows-msvc.zip
      sha256: 9815cbf1c3edb1c5118d0248e5bf08d1f409afb74d30bba4fab927ce513ce102
      bin: "./kubectl-view-allocations.exe"
  shortDescription: List allocations per resources, nodes, pods.
  homepage: https://github.com/davidB/kubectl-view-allocations
  description: |
    This plugin lists resources (cpu, memory, gpu,...) allocations (requested,
    limit, allocatable) as defined in the manifest of nodes and running pods,
    and utilization from metrics-server.
    try `kubectl view-allocations -h`, `kubectl view-allocations`
