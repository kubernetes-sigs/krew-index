apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: view-secret
spec:
  version: v0.17.0
  homepage: https://github.com/elsesiy/kubectl-view-secret
  shortDescription: Decode Kubernetes secrets
  description: |+2
    Base64 decode by key or all key/value pairs in a given secret.

    # print secret keys
    $ kubectl view-secret <secret>

    # decode specific entry
    $ kubectl view-secret <secret> <key>

    # decode all secret contents
    $ kubectl view-secret <secret> -a/--all

    # print keys for secret in different namespace
    $ kubectl view-secret <secret> -n/--namespace foo

    # print keys for secret in different context
    $ kubectl view-secret <secret> -c/--context ctx

    # print keys for secret by providing kubeconfig
    $ kubectl view-secret <secret> -k/--kubeconfig <cfg>

    # suppress info output
    $ kubectl view-secret <secret> -q/--quiet
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/elsesiy/kubectl-view-secret/releases/download/v0.17.0/kubectl-view-secret_v0.17.0_darwin_amd64.tar.gz
    sha256: 85d136082d174101f7739de1a6fcfd38debb4a285050634f6bd3ee5b79541ef0
    bin: kubectl-view-secret
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/elsesiy/kubectl-view-secret/releases/download/v0.17.0/kubectl-view-secret_v0.17.0_darwin_arm64.tar.gz
    sha256: ec37a1842b1f15e636e79909ffddeaea5d929b860ca83989e7717af3a53d2a73
    bin: kubectl-view-secret
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/elsesiy/kubectl-view-secret/releases/download/v0.17.0/kubectl-view-secret_v0.17.0_linux_amd64.tar.gz
    sha256: 1c8aca396e7379c497f46bae938032cfa4ce446888fa038d7b1b891e39caa0c1
    bin: kubectl-view-secret
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/elsesiy/kubectl-view-secret/releases/download/v0.17.0/kubectl-view-secret_v0.17.0_linux_arm64.tar.gz
    sha256: 900b5c65d8f3b73c357293fdcfc495cbd4c23ef5f8a5fc9a19d956a646199a6d
    bin: kubectl-view-secret
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/elsesiy/kubectl-view-secret/releases/download/v0.17.0/kubectl-view-secret_v0.17.0_windows_amd64.tar.gz
    sha256: 0c860dc997aa77ec0abf58f490dbaef370cb062b6dd9e469d008a1c2a304a483
    bin: kubectl-view-secret.exe
