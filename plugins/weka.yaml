apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: weka
spec:
  version: "v0.4.1"
  homepage: https://github.com/weka/kubectl-weka
  shortDescription: "Manage WEKA deployments in Kubernetes"
  description: |
    Kubectl plugin for WEKA operator and cluster planning, deployment, management and maintenance (status, preflight, logs, instances, support bundles).

  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.1/kubectl-weka_v0.4.1_linux_amd64.tar.gz
      sha256: b2b3d1c7662c7febfa9bb08a2bfad126f81e5669ac44ddc4e1fb8052ed3dd5a8
      bin: "kubectl-weka"

    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.1/kubectl-weka_v0.4.1_linux_arm64.tar.gz
      sha256: 44aff00ed09bc674f2a08880342ec74be8d16ef70156dcd1759339e4a6439b5b
      bin: "kubectl-weka"

    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/weka/kubectl-weka/releases/download/v0.4.1/kubectl-weka_v0.4.1_darwin_amd64.tar.gz
