apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: wpa
spec:
  version: "v0.12.0"
  shortDescription: Easily interact and manage WatermarkPodAutoscaler resources.
  description: |
    The WatermarkPodAutoscaler kubectl plugin provides useful utilities to operate WatermarkPodAutoscaler
    via the WatermarkPodAutoscaler controller and the WatermarkPodAutoscaler CRD.
  homepage: https://github.com/DataDog/watermarkpodautoscaler
  platforms:
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_darwin_amd64.zip
    sha256: "d48c11422cd1da26a1ed5f58e3d7e1c5c6b3447493cf7a7e731df16225e4de8e"
    bin: kubectl-wpa
    files:
    - from: kubectl-wpa
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: amd64
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_linux_amd64.zip
    sha256: "9cdceb9f2f562ad8c3b142e8f925619b8bf5b86232bcefe4d7cf05b6e501388f"
    bin: kubectl-wpa
    files:
    - from: kubectl-wpa
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: amd64
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_windows_amd64.zip
    sha256: "8bb647ac9a54d1d96e1fcbcd7d20235c3926296d10b7b454dc6eee697e8f3ff8"
    bin: kubectl-wpa.exe
    files:
    - from: kubectl-wpa.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: amd64
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_darwin_arm64.zip
    sha256: "df714b2a5a1549b16d5a6ae364d9c4c7e183354a660dc14aedc15aa6cd598038"
    bin: kubectl-wpa
    files:
    - from: kubectl-wpa
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: darwin
        arch: arm64
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_linux_arm64.zip
    sha256: "d9628b6a244487eb00a2e4fcc3bd2c06fec43695c36acdc1b12980580a486053"
    bin: kubectl-wpa
    files:
    - from: kubectl-wpa
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: linux
        arch: arm64
  - uri: https://github.com/DataDog/watermarkpodautoscaler/releases/download/v0.12.0/kubectl-wpa_0.12.0_windows_arm64.zip
    sha256: "2a4c2087f2b965fddfd8cb08a06af2b7aca8df0db0af9c58fc8e94d4c6641dc4"
    bin: kubectl-wpa.exe
    files:
    - from: kubectl-wpa.exe
      to: .
    - from: LICENSE
      to: .
    selector:
      matchLabels:
        os: windows
        arch: arm64
